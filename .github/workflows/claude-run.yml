name: Claude Code run

on:
  workflow_call:
    inputs:
      mode:
        description: 'review, implement, or fix-pr (fix-pr-review is a deprecated alias for fix-pr)'
        required: true
        type: string
      flow:
        description: 'Docs/release flow: empty, sync-docs, create-release, or sync-release'
        required: false
        type: string
        default: ''
      model:
        description: 'Model shorthand from the @claude invocation (opus, sonnet, or fable, each also with a 5 suffix); anything else selects the default'
        required: false
        type: string
        default: ''
      model_id:
        description: 'Deprecated: a caller-resolved model id, used verbatim when set; pass model instead'
        required: false
        type: string
        default: ''
      effort:
        description: 'Requested effort (low, medium, high, or xhigh); empty selects high'
        required: false
        type: string
        default: ''
      runs_on:
        description: 'Runner label for the job (e.g. self-hosted)'
        required: false
        type: string
        default: 'ubuntu-latest'
      timeout_minutes:
        description: 'Job timeout in minutes (raise for repos whose implement runs exceed the default)'
        required: false
        type: number
        default: 45
      go_version:
        description: 'If non-empty, install this Go version — ONLY for gofmt on edited files; pair with extra_allowed_tools: Bash(gofmt *)'
        required: false
        type: string
        default: ''
      extra_allowed_tools:
        description: 'Comma-separated allowlist entries appended to every route except the hard-locked create-release flow'
        required: false
        type: string
        default: ''
      review_subprocess_scrub:
        description: 'Review route only. true lets the action secret scrub run, except on a self-hosted Linux runner with a layout known to break the scrub sandbox (see review_subprocess_scrub_self_hosted) unless review_subprocess_scrub_self_hosted is true; on Linux the scrub installs bubblewrap and socat with sudo apt-get and sets kernel.apparmor_restrict_unprivileged_userns=0. false skips those host changes and the scrub on every runner, so tool subprocesses can see the Claude credential.'
        required: false
        type: boolean
        default: true
      review_subprocess_scrub_self_hosted:
        description: 'Review route only. On a self-hosted Linux runner with a layout known to break the scrub bubblewrap sandbox, the secret scrub runs only when this is true and review_subprocess_scrub is true; otherwise tool subprocesses can see the Claude credential. The layouts: the literal or resolved workspace is inside $HOME/actions-runner or $HOME/runners (anthropics/claude-code#97730), or the review runs as root and a workspace ancestor owned by another uid lacks .claude or .mcp.json (anthropics/claude-code#97731). Default false, because the sandbox fails every Bash call in those layouts. GitHub-hosted runners and other self-hosted layouts ignore this input.'
        required: false
        type: boolean
        default: false
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        description: 'Claude Code OAuth token for agent authentication'
        required: true

jobs:
  run:
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    env:
      CLAUDE_HARNESS: anthropics/claude-code-action@v1
      BOT_LOGIN: ${{ inputs.mode == 'review' && 'github-actions[bot]' || 'claude[bot]' }}
    steps:
      - name: Resolve the review subprocess scrub for this runner
        if: inputs.mode == 'review'
        env:
          SCRUB: ${{ inputs.review_subprocess_scrub }}
          SCRUB_SELF_HOSTED: ${{ inputs.review_subprocess_scrub_self_hosted }}
        run: |
          if [ "$SCRUB" != "true" ]; then
            echo "CLAUDE_CODE_SUBPROCESS_ENV_SCRUB=0" >> "$GITHUB_ENV"
            echo "Review subprocess scrub off: review_subprocess_scrub is false."
          elif [ "$RUNNER_ENVIRONMENT" != "self-hosted" ]; then
            echo "Review subprocess scrub on: runner environment '${RUNNER_ENVIRONMENT:-unknown}'."
          elif [ "$SCRUB_SELF_HOSTED" = "true" ]; then
            echo "Review subprocess scrub on: review_subprocess_scrub_self_hosted is true."
          elif [ "$(uname -s)" != "Linux" ]; then
            echo "Review subprocess scrub on: self-hosted runner is not Linux."
          else
            HOME_REAL=$(cd -P "${HOME:-/nonexistent}" 2>/dev/null && pwd -P || true)
            WS_REAL=$(cd -P "$GITHUB_WORKSPACE" 2>/dev/null && pwd -P || true)
            UID_NOW=$(id -u)
            REASON=""
            for h in "${HOME:-}" "$HOME_REAL"; do
              h="${h%/}"
              [ -n "$h" ] || continue
              for w in "$GITHUB_WORKSPACE" "$WS_REAL"; do
                case "$w" in
                  "$h"/actions-runner/*|"$h"/runners/*)
                    REASON="the workspace $w is inside a denied runner path under $h (anthropics/claude-code#97730)" ;;
                esac
              done
            done
            if [ -z "$REASON" ] && [ "$UID_NOW" = "0" ]; then
              for w in "$GITHUB_WORKSPACE" "$WS_REAL"; do
                [ -n "$w" ] || continue
                d=$(dirname "$w")
                while [ "$d" != "/" ] && [ "$d" != "." ] && [ -z "$REASON" ]; do
                  OWNER=$(stat -c %u "$d" 2>/dev/null || echo 0)
                  if [ "$OWNER" != "0" ] && { [ ! -e "$d/.claude" ] || [ ! -e "$d/.mcp.json" ]; }; then
                    REASON="the workspace ancestor $d is owned by uid $OWNER and lacks .claude or .mcp.json, while the review runs as root (anthropics/claude-code#97731)"
                  fi
                  d=$(dirname "$d")
                done
              done
            fi
            if [ -n "$REASON" ]; then
              echo "CLAUDE_CODE_SUBPROCESS_ENV_SCRUB=0" >> "$GITHUB_ENV"
              echo "::warning::Review subprocess scrub off: $REASON, so the scrub sandbox would fail every Bash call. Tool subprocesses can see the Claude credential. Set review_subprocess_scrub_self_hosted: true to keep the scrub on."
            else
              echo "Review subprocess scrub on: this self-hosted runner has no layout known to break the scrub sandbox."
            fi
          fi


      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ inputs.mode == 'review' && '0' || '1' }}
          persist-credentials: ${{ inputs.mode != 'review' }}

      - name: Read review git credentials from the environment at fetch time
        if: inputs.mode == 'review'
        run: |
          git config --local core.repositoryformatversion 1
          git config --local extensions.worktreeConfig true
          git config --worktree credential.helper ""
          git config --worktree "credential.${GITHUB_SERVER_URL}.helper" ""
          git config --worktree --add "credential.${GITHUB_SERVER_URL}.helper" "!f() { test \"\$1\" = get || return 0; echo username=x-access-token; echo \"password=\$GH_TOKEN\"; }; f"

      - name: Checkout rk-skills (shared prompts and scripts)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: richkuo/rk-skills
          ref: main
          path: .rk-skills-shared
          fetch-depth: 1
          persist-credentials: false

      - name: Stage shared assets outside the workspace
        run: |
          rm -rf "$RUNNER_TEMP/rk-shared"
          mkdir -p "$RUNNER_TEMP/rk-shared"
          cp -R .rk-skills-shared/templates/claude-workflow/prompts "$RUNNER_TEMP/rk-shared/prompts"
          cp -R .rk-skills-shared/templates/claude-workflow/scripts "$RUNNER_TEMP/rk-shared/scripts"
          rm -rf .rk-skills-shared

      - name: Resolve model and effort
        id: resolve
        env:
          MODEL_SHORT: ${{ inputs.model }}
          MODEL_ID_IN: ${{ inputs.model_id }}
          EFFORT_IN: ${{ inputs.effort }}
        run: |
          if [ -n "$MODEL_ID_IN" ]; then
            MODEL_ID="$MODEL_ID_IN"
          else
            case "$(printf '%s' "$MODEL_SHORT" | tr '[:upper:]' '[:lower:]')" in
              opus|opus5)     MODEL_ID="claude-opus-5-5" ;;
              sonnet|sonnet5) MODEL_ID="claude-sonnet-5-5" ;;
              fable|fable5)   MODEL_ID="claude-fable-5-1" ;;
              *)              MODEL_ID="claude-opus-5-5" ;;
            esac
          fi
          ID_RE='^[A-Za-z0-9][A-Za-z0-9._:@/-]*(\[[A-Za-z0-9]+\])?$'
          if ! [[ "$MODEL_ID" =~ $ID_RE ]]; then
            echo "::error::The model id is not a valid model id."
            exit 1
          fi

          EFFORT=$(printf '%s' "$EFFORT_IN" | tr '[:upper:]' '[:lower:]')
          case "$EFFORT" in
            '') EFFORT=high ;;
            low|medium|high|xhigh) ;;
            *)
              echo "::error::The effort must be low, medium, high, or xhigh."
              exit 1
              ;;
          esac

          echo "model_id=$MODEL_ID" >> "$GITHUB_OUTPUT"
          echo "effort=$EFFORT" >> "$GITHUB_OUTPUT"
          echo "::notice::Using model: $MODEL_ID"
          echo "::notice::Using effort: $EFFORT"

      - name: Prune stale worktrees before Claude runs
        run: |
          git worktree list --porcelain | sed -n 's/^worktree //p' | while IFS= read -r wt; do
            case "$wt" in
              "$GITHUB_WORKSPACE"/.claude/worktrees/*)
                git worktree remove --force "$wt" 2>/dev/null || rm -rf "$wt" ;;
            esac
          done
          git worktree prune

      - name: Stage the pull request under review
        if: inputs.mode == 'review'
        id: pr_context
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          SETTINGS_FILE: ${{ runner.temp }}/claude-review-settings.json
          GUARD_FILE: ${{ runner.temp }}/claude-review-credential-guard.sh
        run: |
          rm -f "$GUARD_FILE" "$SETTINGS_FILE"
          cat > "$GUARD_FILE" <<'GUARD_EOF'
          #!/usr/bin/env bash
          set -u
          block() {
            echo "Credential guard: $1. The job token can be readable, so stop the review and report that this run is unsafe." >&2
            exit 2
          }
          AFTER_ACTION=0
          [ "${1:-}" = "--after-action" ] && AFTER_ACTION=1
          action_token_output_only() {
            case "$1" in
              "${RUNNER_TEMP:-/nonexistent}"/_runner_file_commands/set_output_*) ;;
              *) return 1 ;;
            esac
            [ -f "$1" ] && [ ! -L "$1" ] || return 1
            awk -v t="$2" -v b="$3" '
              state == 1 { if ($0 != t) bad = 1; state = 2; next }
              state == 2 { if ($0 != delim) bad = 1; state = 0; next }
              /^github_token<<ghadelimiter_[0-9a-f-]+$/ { delim = substr($0, 15); state = 1; next }
              index($0, t) || index($0, b) { bad = 1 }
              END { exit (bad || state != 0) }
            ' "$1"
          }
          WS="${GITHUB_WORKSPACE:-$PWD}"
          CONFIG=$(git -C "$WS" config --list 2>/dev/null) || block "git config cannot be read"
          if printf '%s\n' "$CONFIG" | grep -qiE '^http\..*\.extraheader='; then
            block "git config sets an http extraheader entry"
          fi
          if printf '%s\n' "$CONFIG" | grep -qiE '^remote\.[^=]*\.(push)?url=[a-z][a-z0-9+.-]*://[^/@]*@'; then
            block "a git remote URL holds a credential"
          fi
          if printf '%s\n' "$CONFIG" | grep -qF 'x-access-token:'; then
            block "a git config value holds an access token"
          fi
          if printf 'protocol=https\nhost=example.invalid\n\n' | GIT_TERMINAL_PROMPT=0 GIT_ASKPASS= SSH_ASKPASS= git -C "$WS" credential fill 2>/dev/null | grep -q '^password='; then
            block "git offers a credential to a host other than the GitHub server"
          fi
          for TOKEN in "${GH_TOKEN:-}" "${GITHUB_TOKEN:-}"; do
            [ -n "$TOKEN" ] || continue
            AUTH_B64=$(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')
            if printf '%s\n' "$CONFIG" | grep -qF -e "$TOKEN" -e "$AUTH_B64"; then
              block "a git config value holds the job token"
            fi
            LEAKED=""
            while IFS= read -r FILE; do
              [ -n "$FILE" ] || continue
              if [ "$AFTER_ACTION" = 1 ] && action_token_output_only "$FILE" "$TOKEN" "$AUTH_B64"; then
                continue
              fi
              LEAKED="$LEAKED $FILE"
            done < <(grep -rlF -e "$TOKEN" -e "$AUTH_B64" "${RUNNER_TEMP:-/nonexistent}" "$HOME/.git-credentials" "${XDG_CONFIG_HOME:-$HOME/.config}/git/credentials" 2>/dev/null)
            if [ -n "$LEAKED" ]; then
              block "a file under RUNNER_TEMP or a git credential store holds the job token:$LEAKED"
            fi
          done
          exit 0
          GUARD_EOF
          chmod 400 "$GUARD_FILE"
          GUARD_OID=$(git hash-object "$GUARD_FILE")
          echo "guard_oid=$GUARD_OID" >> "$GITHUB_OUTPUT"

          BASE_REF=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json baseRefName -q .baseRefName)
          git fetch --quiet origin "+refs/pull/${PR_NUMBER}/head:refs/rk-claude/pr-head"
          git fetch --quiet origin "+refs/heads/${BASE_REF}:refs/rk-claude/pr-base"
          git checkout --quiet --detach refs/rk-claude/pr-head
          echo "base_sha=$(git merge-base refs/rk-claude/pr-base refs/rk-claude/pr-head)" >> "$GITHUB_OUTPUT"
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

          cat > "$SETTINGS_FILE" <<EOF
          {
            "claudeMdExcludes": [
              "${GITHUB_WORKSPACE}/CLAUDE.md",
              "${GITHUB_WORKSPACE}/CLAUDE.local.md",
              "${GITHUB_WORKSPACE}/AGENTS.md",
              "${GITHUB_WORKSPACE}/.claude/CLAUDE.md",
              "${GITHUB_WORKSPACE}/.claude/rules/**",
              "${GITHUB_WORKSPACE}/**/CLAUDE.md",
              "${GITHUB_WORKSPACE}/**/CLAUDE.local.md",
              "${GITHUB_WORKSPACE}/**/AGENTS.md",
              "${GITHUB_WORKSPACE}/**/.claude/CLAUDE.md",
              "${GITHUB_WORKSPACE}/**/.claude/rules/**"
            ],
            "hooks": {
              "PreToolUse": [
                {
                  "matcher": "*",
                  "hooks": [
                    { "type": "command", "command": "git hash-object ${GUARD_FILE} | grep -qx ${GUARD_OID} || { echo 'Credential guard: the guard script changed, so stop the review and report that this run is unsafe.' >&2; exit 2; }; bash ${GUARD_FILE} || exit 2" }
                  ]
                }
              ]
            }
          }
          EOF
          chmod 400 "$SETTINGS_FILE"
          echo "settings_oid=$(git hash-object "$SETTINGS_FILE")" >> "$GITHUB_OUTPUT"

      - name: Set up Go (gofmt only)
        if: inputs.go_version != ''
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go_version }}

      - name: Record PR head sha before Claude runs
        if: inputs.mode == 'implement'
        id: pre_claude
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          SHA=""
          KIND=local
          if [ -n "$PR_NUMBER" ]; then
            SHA=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json headRefOid -q .headRefOid 2>/dev/null || echo "")
          fi
          if [ -n "$SHA" ]; then
            KIND=pr
          else
            SHA=$(git rev-parse HEAD)
          fi
          echo "head_sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "baseline_kind=$KIND" >> "$GITHUB_OUTPUT"

      - name: Compose Claude prompt
        id: compose_prompt
        env:
          MODEL_ID: ${{ steps.resolve.outputs.model_id }}
          EFFORT: ${{ steps.resolve.outputs.effort }}
          MODE: ${{ inputs.mode }}
          FLOW: ${{ inputs.flow }}
          EXTRA_ALLOWED: ${{ inputs.extra_allowed_tools }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          HEAD_SHA: ${{ steps.pr_context.outputs.head_sha }}
          BASE_SHA: ${{ steps.pr_context.outputs.base_sha }}
          SETTINGS_FILE: ${{ runner.temp }}/claude-review-settings.json
          GH_TOKEN: ${{ github.token }}
        run: |
          PROMPTS_DIR="$RUNNER_TEMP/rk-shared/prompts"
          if [ -n "$FLOW" ]; then
            PROMPT_FILE=$PROMPTS_DIR/sync-docs-release.md
            case "$FLOW" in
              create-release)
                ALLOWED='Read,Glob,Grep,Bash(git status*),Bash(git log*),Bash(git tag --sort*),Bash(git fetch*),Bash(git rev-parse*),Bash(gh auth status),Bash(gh release create*),Bash(gh release view*)'
                ;;
              *)
                ALLOWED='Read,Edit,Write,Glob,Grep,Bash(wc *),Bash(ls *),Bash(git status*),Bash(git log*),Bash(git diff*),Bash(git show*),Bash(git fetch*),Bash(git tag --sort*),Bash(git branch*),Bash(git rev-parse*),Bash(git checkout -b docs-sync/*),Bash(git checkout -b docs-release/*),Bash(git add*),Bash(git commit*),Bash(git push origin docs-sync/*),Bash(git push origin docs-release/*),Bash(gh pr create*),Bash(gh pr view*),Bash(gh issue view*)'
                ;;
            esac
          elif [ "$MODE" = "implement" ]; then
            PROMPT_FILE=$PROMPTS_DIR/issue-workflow.md
            ALLOWED='Bash(git *),Bash(gh *),Read,Edit,Write,Glob,Grep,Skill,EnterWorktree'
          elif [ "$MODE" = "fix-pr" ] || [ "$MODE" = "fix-pr-review" ]; then
            PROMPT_FILE=$PROMPTS_DIR/fix-pr.md
            ALLOWED='Bash(wc *),Bash(ls *),Bash(git status*),Bash(git log*),Bash(git diff*),Bash(git show*),Bash(git fetch*),Bash(git merge origin/*),Bash(git branch*),Bash(git rev-parse*),Bash(git checkout*),Bash(git switch*),Bash(git add*),Bash(git commit*),Bash(git push origin HEAD),Bash(gh pr checkout*),Bash(gh pr view*),Bash(gh pr diff*),Bash(gh pr comment*),Bash(gh issue view*),Bash(gh issue list*),Bash(gh issue create*),Bash(gh api graphql*),Read,Edit,Write,Glob,Grep'
          else
            PROMPT_FILE=$PROMPTS_DIR/pr-review-format.md
            ALLOWED='Bash(git status*),Bash(git log*),Bash(git diff*),Bash(git show*),Bash(git fetch origin),Bash(git fetch origin *),Bash(git branch*),Bash(git rev-parse*),Bash(gh pr view*),Bash(gh pr diff*),Bash(gh pr comment*),Bash(gh issue view*)'
          fi

          if [ -n "$EXTRA_ALLOWED" ]; then
            if printf '%s' "$EXTRA_ALLOWED" | grep -q '["`$]'; then
              echo "::error::extra_allowed_tools must not contain double quotes, backticks, or dollar signs (claude_args is shell-evaluated)."
              exit 1
            fi
            if [ "$FLOW" = "create-release" ]; then
              echo "::notice::extra_allowed_tools is ignored in the create-release flow (hard-locked allowlist)."
            else
              ALLOWED="$ALLOWED,$EXTRA_ALLOWED"
            fi
          fi

          flatten() { tr '\n' ' ' | sed -e 's/[[:space:]]\{2,\}/ /g' -e 's/^ *//' -e 's/ *$//'; }
          TRUSTED_REF=""
          if git fetch --quiet --depth 1 origin "refs/heads/$DEFAULT_BRANCH" 2>/dev/null; then
            TRUSTED_REF=FETCH_HEAD
          else
            echo "::warning::Could not fetch the default branch — repo prompt overrides are skipped this run."
          fi
          PROMPT_NAME=$(basename "$PROMPT_FILE")
          REPLACEMENT_PATH=".github/prompts/$PROMPT_NAME"
          LOCAL_PATH=".github/prompts/$(basename "$PROMPT_FILE" .md)-local.md"
          LEGACY_REPLACEMENT_PATH=""
          LEGACY_LOCAL_PATH=""
          if [ "$MODE" = "fix-pr-review" ]; then
            LEGACY_REPLACEMENT_PATH=".github/prompts/fix-pr-review.md"
            LEGACY_LOCAL_PATH=".github/prompts/fix-pr-review-local.md"
          fi
          if [ -n "$TRUSTED_REF" ] && git cat-file -e "$TRUSTED_REF:$REPLACEMENT_PATH" 2>/dev/null; then
            PROMPT=$(git show "$TRUSTED_REF:$REPLACEMENT_PATH" | flatten)
          elif [ -n "$TRUSTED_REF" ] && [ -n "$LEGACY_REPLACEMENT_PATH" ] && git cat-file -e "$TRUSTED_REF:$LEGACY_REPLACEMENT_PATH" 2>/dev/null; then
            PROMPT=$(git show "$TRUSTED_REF:$LEGACY_REPLACEMENT_PATH" | flatten)
          else
            PROMPT=$(flatten < "$PROMPT_FILE")
          fi
          if [ -n "$TRUSTED_REF" ] && git cat-file -e "$TRUSTED_REF:$LOCAL_PATH" 2>/dev/null; then
            PROMPT="$PROMPT $(git show "$TRUSTED_REF:$LOCAL_PATH" | flatten)"
          elif [ -n "$TRUSTED_REF" ] && [ -n "$LEGACY_LOCAL_PATH" ] && git cat-file -e "$TRUSTED_REF:$LEGACY_LOCAL_PATH" 2>/dev/null; then
            PROMPT="$PROMPT $(git show "$TRUSTED_REF:$LEGACY_LOCAL_PATH" | flatten)"
          fi
          if printf '%s' "$PROMPT" | grep -q '["`$]'; then
            echo "::error::The prompt for this route ($PROMPT_NAME, including any $REPLACEMENT_PATH / $LOCAL_PATH override) must not contain double quotes, backticks, or dollar signs (claude_args is shell-evaluated)."
            exit 1
          fi
          PROMPT="$PROMPT The harness identifier for LLM attribution footers in this run is ${CLAUDE_HARNESS}."
          if [ -n "$FLOW" ]; then
            PROMPT="$PROMPT The requested operation mode for this run is ${FLOW}."
          fi
          if [ "$MODE" = "review" ]; then
            PROMPT="$PROMPT The pull request head is checked out in this workspace already, as a detached HEAD at commit ${HEAD_SHA}. Its merge base with the target branch is ${BASE_SHA}."
          fi
          ARGS="--model ${MODEL_ID} --effort ${EFFORT} --append-system-prompt \"${PROMPT}\" --allowedTools \"${ALLOWED}\""
          if [ "$MODE" = "review" ]; then
            ARGS="$ARGS --disallowedTools \"Edit,Write,NotebookEdit,WebFetch,WebSearch,Skill,Agent,Task,Read(//proc/**),Bash(git *--output*),Bash(git diff*--no-index*),Bash(git fetch*--upload-pack*),Bash(gh pr comment*--body-file*),Bash(gh pr comment* -F*)\" --setting-sources user --settings ${SETTINGS_FILE}"
          fi
          {
            printf 'claude_args<<CLAUDE_ARGS_EOF\n'
            printf '%s\n' "$ARGS"
            printf 'CLAUDE_ARGS_EOF\n'
          } >> "$GITHUB_OUTPUT"

      - name: Confirm no job credential persists on disk before Claude runs
        if: inputs.mode == 'review'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Git config keys, each with the file that sets it:"
          git config --list --show-origin --name-only
          echo "RUNNER_TEMP contents:"
          ls -la "$RUNNER_TEMP"
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::The job token is empty, so the credential check cannot run."
            exit 1
          fi
          AUTH_B64=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          echo "::add-mask::$AUTH_B64"
          FOUND=0
          if git config --list --name-only | grep -qiE '^http\..*\.extraheader$'; then
            echo "::error::Git config sets an http extraheader entry."
            FOUND=1
          fi
          if git config --list | grep -qF -e "$GH_TOKEN" -e "$AUTH_B64"; then
            echo "::error::A git config value holds the job token."
            FOUND=1
          fi
          LEAKED=$(grep -rlF -e "$GH_TOKEN" -e "$AUTH_B64" "$RUNNER_TEMP" "$HOME/.git-credentials" "${XDG_CONFIG_HOME:-$HOME/.config}/git/credentials" 2>/dev/null || true)
          if [ -n "$LEAKED" ]; then
            echo "::error::Files under RUNNER_TEMP or in a git credential store hold the job token: $(printf '%s' "$LEAKED" | tr '\n' ' ')"
            FOUND=1
          fi
          if [ "$FOUND" -ne 0 ]; then
            echo "::error::A job credential persists on disk, so Claude does not start."
            exit 1
          fi

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@8ce9314fa9a404564fa7e954cd84f25bcba2b829 # v1.0.235 (Claude Code 2.1.283)
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          github_token: ${{ inputs.mode == 'review' && github.token || '' }}

          allowed_non_write_users: ${{ inputs.mode == 'review' && 'rk-skills:no-login-matches' || '' }}

          allowed_bots: 'claude'

          show_full_output: true

          plugin_marketplaces: |
            https://github.com/anthropics/claude-code.git
            https://github.com/richkuo/rk-skills.git
          plugins: |
            code-review@claude-code-plugins
            rk-skills@rk-skills

          claude_args: ${{ steps.compose_prompt.outputs.claude_args }}

      - name: Confirm no job credential persisted on disk while Claude ran
        if: always() && inputs.mode == 'review' && steps.claude.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
          GUARD_FILE: ${{ runner.temp }}/claude-review-credential-guard.sh
          SETTINGS_FILE: ${{ runner.temp }}/claude-review-settings.json
          GUARD_OID: ${{ steps.pr_context.outputs.guard_oid }}
          SETTINGS_OID: ${{ steps.pr_context.outputs.settings_oid }}
        run: |
          echo "Git config keys, each with the file that sets it:"
          git config --list --show-origin --name-only
          if [ -z "$GUARD_OID" ] || [ "$(git hash-object "$GUARD_FILE" 2>/dev/null)" != "$GUARD_OID" ]; then
            echo "::error::The credential guard script changed while Claude ran."
            exit 1
          fi
          if [ -z "$SETTINGS_OID" ] || [ "$(git hash-object "$SETTINGS_FILE" 2>/dev/null)" != "$SETTINGS_OID" ]; then
            echo "::error::The review settings file changed while Claude ran."
            exit 1
          fi
          if ! bash "$GUARD_FILE" --after-action; then
            echo "::error::The job token persisted on disk while Claude ran."
            exit 1
          fi

      - name: Fail if Claude Code returned an error
        if: steps.claude.outcome == 'success'
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            echo "::warning::jq is not installed on this runner — skipping the Claude Code error check."
            exit 0
          fi
          if [ -z "$EXECUTION_FILE" ] || [ ! -f "$EXECUTION_FILE" ]; then
            echo "::error::Claude Code execution output file is missing."
            exit 1
          fi

          RESULT=$(jq -s '
            def records:
              .[] | if type == "array" then .[] else . end;
            [records | select(type == "object" and .type == "result")] | last // {}
          ' "$EXECUTION_FILE")
          IS_ERROR=$(printf '%s' "$RESULT" | jq -r '.is_error // false')
          if [ "$IS_ERROR" = "true" ]; then
            API_STATUS=$(printf '%s' "$RESULT" | jq -r '.api_error_status // empty')
            MESSAGE=$(printf '%s' "$RESULT" | jq -r '.result // "Claude Code reported an error."')
            if [ -n "$API_STATUS" ]; then
              echo "::error::Claude Code failed with API status ${API_STATUS}: ${MESSAGE}"
            else
              echo "::error::Claude Code failed: ${MESSAGE}"
            fi
            exit 1
          fi

      - name: Detect if Claude made commits
        if: inputs.mode == 'implement' && steps.claude.outcome == 'success'
        id: claude_changes
        env:
          GH_TOKEN: ${{ github.token }}
          PRE_HEAD_SHA: ${{ steps.pre_claude.outputs.head_sha }}
          BASELINE_KIND: ${{ steps.pre_claude.outputs.baseline_kind }}
          PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$BASELINE_KIND" = "pr" ]; then
            AFTER_SHA=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json headRefOid -q .headRefOid 2>/dev/null || echo "")
            if [ -n "$AFTER_SHA" ] && [ "$PRE_HEAD_SHA" != "$AFTER_SHA" ]; then
              echo "made_commits=true" >> "$GITHUB_OUTPUT"
            else
              echo "made_commits=false" >> "$GITHUB_OUTPUT"
              echo "::notice::Claude pushed no commits — skipping CLAUDE.md revision."
            fi
          else
            git fetch --quiet origin "$GITHUB_REF_NAME" 2>/dev/null || true
            CURRENT_SHA=$(git rev-parse HEAD)
            if [ "$PRE_HEAD_SHA" != "$CURRENT_SHA" ] || ! git diff --quiet || [ -n "$(git status --porcelain)" ]; then
              echo "made_commits=true" >> "$GITHUB_OUTPUT"
            else
              echo "made_commits=false" >> "$GITHUB_OUTPUT"
              echo "::notice::Claude made no code changes — skipping CLAUDE.md revision."
            fi
          fi

      - name: Capture primary Claude comment before revise pass
        if: inputs.mode == 'implement' && steps.claude.outcome == 'success'
        id: primary_comment
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SELECT_ONLY: '1'
        run: echo "id=$(bash "$RUNNER_TEMP/rk-shared/scripts/patch_claude_comment.sh")" >> "$GITHUB_OUTPUT"

      - name: Revise CLAUDE.md with session learnings
        if: inputs.mode == 'implement' && steps.claude.outcome == 'success' && steps.claude_changes.outputs.made_commits == 'true'
        uses: anthropics/claude-code-action@8ce9314fa9a404564fa7e954cd84f25bcba2b829 # v1.0.235 (Claude Code 2.1.283)
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: "Use the Skill tool to invoke the 'claude-md-management:revise-claude-md' skill. Review the changes made in this session (use git log and git diff to inspect them) and update CLAUDE.md with any new patterns, conventions, or important context learned. If you modified CLAUDE.md, you MUST persist it: commit it on the current branch following the repository commit conventions and push with git push origin HEAD — an uncommitted edit is discarded when this job ends."
          plugin_marketplaces: |
            https://github.com/anthropics/claude-code.git
            https://github.com/anthropics/claude-plugins-official.git
          plugins: |
            code-review@claude-code-plugins
            claude-md-management@claude-plugins-official
          claude_args: --model ${{ steps.resolve.outputs.model_id }} --effort ${{ steps.resolve.outputs.effort }} --allowedTools "Bash(git status*),Bash(git log*),Bash(git diff*),Bash(git show*),Bash(git add*),Bash(git commit*),Bash(git push origin HEAD),Edit,Read,Grep,Glob,Write"

      - name: Append LLM footer to Claude comment
        env:
          GH_TOKEN: ${{ github.token }}
          MODEL_ID: ${{ steps.resolve.outputs.model_id }}
          EFFORT: ${{ steps.resolve.outputs.effort }}
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          TARGET_COMMENT_ID: ${{ steps.primary_comment.outputs.id }}
        run: bash "$RUNNER_TEMP/rk-shared/scripts/patch_claude_comment.sh"

      - name: Mark cancellation for downstream status note
        if: always() && cancelled()
        run: echo "IS_CANCELLED=true" >> "$GITHUB_ENV"

      - name: Note workflow cancellation/failure on Claude comment
        if: always() && (cancelled() || failure())
        env:
          GH_TOKEN: ${{ github.token }}
          MODEL_ID: ${{ steps.resolve.outputs.model_id }}
          EFFORT: ${{ steps.resolve.outputs.effort }}
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          ON_MISS: post
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ ! -f "$RUNNER_TEMP/rk-shared/scripts/patch_claude_comment.sh" ]; then
            echo "::notice::Shared scripts unavailable — cannot patch the Claude comment."
            exit 0
          fi

          if [ "${IS_CANCELLED:-}" = "true" ]; then
            STATUS_NOTE="**Workflow cancelled before completion.** See [run log]($RUN_URL)."
          else
            STATUS_NOTE="**Workflow failed before completion.** See [run log]($RUN_URL)."
          fi
          export STATUS_NOTE

          bash "$RUNNER_TEMP/rk-shared/scripts/patch_claude_comment.sh"

      - name: Clean up worktrees after Claude runs
        if: always()
        run: |
          git worktree list --porcelain | sed -n 's/^worktree //p' | while IFS= read -r wt; do
            case "$wt" in
              "$GITHUB_WORKSPACE"/.claude/worktrees/*)
                git worktree remove --force "$wt" 2>/dev/null || rm -rf "$wt" ;;
            esac
          done
          git worktree prune
