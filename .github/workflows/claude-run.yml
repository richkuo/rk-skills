name: Claude Code run

on:
  workflow_call:
    inputs:
      mode:
        description: 'review, implement, or fix-pr (fix-pr-review is a deprecated alias for fix-pr)'
        required: true
        type: string
      flow:
        description: 'Docs/release flow: empty, sync-docs, create-release, or sync-release'
        required: false
        type: string
        default: ''
      model:
        description: 'Model shorthand from the @claude invocation (opus, sonnet, or fable, each also with a 5 suffix); anything else selects the default'
        required: false
        type: string
        default: ''
      model_id:
        description: 'Deprecated: a caller-resolved model id, used verbatim when set; pass model instead'
        required: false
        type: string
        default: ''
      effort:
        description: 'Requested effort (low, medium, high, or xhigh); empty selects high'
        required: false
        type: string
        default: ''
      runs_on:
        description: 'Runner label for the job (e.g. self-hosted)'
        required: false
        type: string
        default: 'ubuntu-latest'
      timeout_minutes:
        description: 'Job timeout in minutes (raise for repos whose implement runs exceed the default)'
        required: false
        type: number
        default: 45
      go_version:
        description: 'If non-empty, install this Go version — ONLY for gofmt on edited files; pair with extra_allowed_tools: Bash(gofmt *)'
        required: false
        type: string
        default: ''
      extra_allowed_tools:
        description: 'Comma-separated allowlist entries appended to every route except the hard-locked create-release flow'
        required: false
        type: string
        default: ''
      review_subprocess_scrub:
        description: 'Review route only. true (the default) runs the action secret scrub on every runner; on Linux the scrub installs bubblewrap and socat with sudo apt-get and sets kernel.apparmor_restrict_unprivileged_userns=0. On a self-hosted Linux runner whose layout breaks the scrub sandbox (the workspace inside $HOME/actions-runner or $HOME/runners, anthropics/claude-code#97730, or a root review with a workspace ancestor owned by another uid, anthropics/claude-code#97731), the workflow prepares the run so the scrub stays on: a temporary HOME for the action step and root-owned .claude and .mcp.json stubs in those ancestors. When that preparation fails, the review stops before Claude starts; it never turns the scrub off. false turns the scrub off on every runner, so tool subprocesses can see the Claude credential; it runs only for a pull request author with the OWNER, MEMBER, or COLLABORATOR association (or claude[bot]) and only with review_subprocess_scrub_off_accepted: true.'
        required: false
        type: boolean
        default: true
      review_subprocess_scrub_self_hosted:
        description: 'Ignored. Kept only so a caller that sets it still runs. The value skips no layout detection, no stub or home preparation, no protection check, and no author gate.'
        required: false
        type: boolean
        default: false
      review_subprocess_scrub_off_accepted:
        description: 'Review route only. Accepts the credential exposure of review_subprocess_scrub: false. A review with the scrub off runs only when this is true and the pull request author has the OWNER, MEMBER, or COLLABORATOR association (or is claude[bot]); any other author is refused whatever this value is. It has no effect while review_subprocess_scrub is true.'
        required: false
        type: boolean
        default: false
      command_policy:
        description: 'Write routes only (implement, fix-pr, fix-pr-review, and the docs and release flows); the review route ignores it. true loads the command policy checker .claude/hooks/command_policy.py of the calling repository at command_policy_sha from a copy outside the checkout, through a settings file that this workflow writes, for every launch except the review route. The run stops before Claude starts when the policy, the hook interpreter, or the runtime proof cannot be trusted. See the command policy section of templates/claude-workflow/README.md.'
        required: false
        type: boolean
        default: false
      command_policy_sha:
        description: 'Write routes only, with command_policy true; ignored on the review route and when command_policy is false. The full 40-character commit of the calling repository, on its default branch, that holds the reviewed checker. There is no branch or tag fallback.'
        required: false
        type: string
        default: ''
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        description: 'Claude Code OAuth token for agent authentication'
        required: true

jobs:
  run:
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    env:
      CLAUDE_HARNESS: anthropics/claude-code-action@v1
      BOT_LOGIN: ${{ inputs.mode == 'review' && 'github-actions[bot]' || 'claude[bot]' }}
    steps:
      - name: Refuse a docs, release, or implement run on a pull request
        env:
          MODE: ${{ inputs.mode }}
          FLOW: ${{ inputs.flow }}
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_PR_URL: ${{ github.event.issue.pull_request.url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          ON_PR=false
          if [ -n "$ISSUE_PR_URL" ] || [ -n "$PR_NUMBER" ]; then
            ON_PR=true
          fi
          case "$EVENT_NAME" in
            pull_request|pull_request_target|pull_request_review|pull_request_review_comment) ON_PR=true ;;
          esac
          if [ "$ON_PR" = "true" ] && { [ -n "$FLOW" ] || [ "$MODE" = "implement" ]; }; then
            echo "::error::Run refused: a docs or release flow, or the implement route, cannot run on a pull request event. Start a docs or release flow from a comment on a plain issue. Update the caller workflow from the current template."
            exit 1
          fi

      - name: Resolve the review execution contract
        if: inputs.mode == 'review'
        id: review_contract
        env:
          SCRUB: ${{ inputs.review_subprocess_scrub }}
          SCRUB_SELF_HOSTED: ${{ inputs.review_subprocess_scrub_self_hosted }}
          SCRUB_OFF_ACCEPTED: ${{ inputs.review_subprocess_scrub_off_accepted }}
          REPO_PRIVATE: ${{ github.event.repository.private }}
          ISSUE_PR_URL: ${{ github.event.issue.pull_request.url }}
          ISSUE_AUTHOR_ASSOC: ${{ github.event.issue.author_association }}
          ISSUE_AUTHOR_LOGIN: ${{ github.event.issue.user.login }}
          PR_AUTHOR_ASSOC: ${{ github.event.pull_request.author_association }}
          PR_AUTHOR_LOGIN: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          fail() {
            echo "::error::Review refused: $1"
            exit 1
          }
          one_line() {
            case "$2" in
              *$'\n'*|*$'\r'*) fail "$1 holds a line break, so the run contract cannot record it." ;;
            esac
          }
          [ -n "${HOME:-}" ] || fail "HOME is empty, so the job home cannot be recorded."
          [ -n "${GITHUB_WORKSPACE:-}" ] || fail "GITHUB_WORKSPACE is empty."
          one_line HOME "$HOME"
          one_line GITHUB_WORKSPACE "$GITHUB_WORKSPACE"
          REAL_HOME="$HOME"
          if [ "$SCRUB_SELF_HOSTED" = "true" ]; then
            echo "::notice::review_subprocess_scrub_self_hosted is ignored. It changes no scrub decision, preparation, protection check, or author gate."
          fi

          SCRUB_VALUE=1
          NEEDS_TEMP_HOME=false
          STUB_SCAN=false
          HOME_PARENT_DENY=false
          if [ "$SCRUB" != "true" ]; then
            if [ -n "$ISSUE_PR_URL" ]; then
              AUTHOR_ASSOC="$ISSUE_AUTHOR_ASSOC"
              AUTHOR_LOGIN="$ISSUE_AUTHOR_LOGIN"
            else
              AUTHOR_ASSOC="$PR_AUTHOR_ASSOC"
              AUTHOR_LOGIN="$PR_AUTHOR_LOGIN"
            fi
            AUTHOR_TRUSTED=false
            case "$AUTHOR_ASSOC" in
              OWNER|MEMBER|COLLABORATOR) AUTHOR_TRUSTED=true ;;
            esac
            if [ "$AUTHOR_LOGIN" = "claude[bot]" ]; then
              AUTHOR_TRUSTED=true
            fi
            echo "Review pull request author association: ${AUTHOR_ASSOC:-NONE}, trusted: $AUTHOR_TRUSTED."
            echo "review_subprocess_scrub_off_accepted: ${SCRUB_OFF_ACCEPTED:-false}."
            if [ "$REPO_PRIVATE" = "true" ]; then
              EXPOSURE="This repository is private, so only accounts with access can post comments, but commits from other people can still be in the diff."
            else
              EXPOSURE="This repository is public, so any GitHub user can post that text."
            fi
            if [ "$AUTHOR_TRUSTED" != "true" ]; then
              fail "review_subprocess_scrub is false, so tool subprocesses could see the Claude credential, and the pull request author association is ${AUTHOR_ASSOC:-NONE}. A review of a pull request from an author outside OWNER, MEMBER, COLLABORATOR, or claude[bot] runs only with the scrub on, and review_subprocess_scrub_off_accepted does not change this. Remove review_subprocess_scrub: false from the review job (the default is true)."
            fi
            if [ "$SCRUB_OFF_ACCEPTED" != "true" ]; then
              fail "review_subprocess_scrub is false, so tool subprocesses could see the Claude credential. Every review reads text that people other than the pull request author can write: comments, formal reviews, inline review comments, and commits in the diff. $EXPOSURE A review runs with the scrub off only when the review job also sets review_subprocess_scrub_off_accepted: true. Remove review_subprocess_scrub: false from the review job (the default is true), or set review_subprocess_scrub_off_accepted: true to accept the exposure."
            fi
            echo "::warning::Review subprocess scrub off: review_subprocess_scrub is false and review_subprocess_scrub_off_accepted is true, so tool subprocesses can see the Claude credential (CLAUDE_CODE_OAUTH_TOKEN) while the review reads text that people other than the pull request author can write: comments, formal reviews, inline review comments, and commits in the diff. $EXPOSURE A prompt injection in that text can try to read the credential."
            SCRUB_VALUE=0
          elif [ "${RUNNER_ENVIRONMENT:-}" != "self-hosted" ]; then
            echo "Review subprocess scrub on: runner environment '${RUNNER_ENVIRONMENT:-unknown}'."
          elif [ "$(uname -s)" != "Linux" ]; then
            echo "Review subprocess scrub on: self-hosted runner is not Linux."
          else
            HOME_RESOLVED=$(cd -P "$HOME" 2>/dev/null && pwd -P) || fail "the job home $HOME cannot be resolved."
            WS_RESOLVED=$(cd -P "$GITHUB_WORKSPACE" 2>/dev/null && pwd -P) || fail "the workspace $GITHUB_WORKSPACE cannot be resolved."
            UID_NOW=$(id -u) || fail "the user ID cannot be read."
            HOME_PARENT_DENY=true
            DENIED_ROOTS=()
            for h in "$HOME" "$HOME_RESOLVED"; do
              h="${h%/}"
              [ -n "$h" ] || continue
              for name in actions-runner runners; do
                DENIED_ROOTS+=("$h/$name")
                if [ -e "$h/$name" ]; then
                  ROOT_RESOLVED=$(cd -P "$h/$name" 2>/dev/null && pwd -P) || fail "the runner path $h/$name exists but cannot be resolved."
                  DENIED_ROOTS+=("$ROOT_RESOLVED")
                fi
              done
            done
            for d in "${DENIED_ROOTS[@]}"; do
              for w in "$GITHUB_WORKSPACE" "$WS_RESOLVED"; do
                case "$w" in
                  "$d"/*)
                    if [ "$NEEDS_TEMP_HOME" != "true" ]; then
                      echo "The workspace $w is inside the denied runner path $d under the job home (anthropics/claude-code#97730), so the action step runs with a temporary HOME."
                    fi
                    NEEDS_TEMP_HOME=true
                    ;;
                esac
              done
            done
            if [ "$UID_NOW" = "0" ]; then
              STUB_SCAN=true
              echo "The review runs as root, so workspace ancestors owned by another user ID get .claude and .mcp.json stubs (anthropics/claude-code#97731)."
            fi
            echo "Review subprocess scrub on: self-hosted Linux runner, temporary HOME: $NEEDS_TEMP_HOME, ancestor stub scan: $STUB_SCAN."
          fi
          {
            printf 'scrub=%s\n' "$SCRUB_VALUE"
            printf 'real_home=%s\n' "$REAL_HOME"
            printf 'needs_temp_home=%s\n' "$NEEDS_TEMP_HOME"
            printf 'stub_scan=%s\n' "$STUB_SCAN"
            printf 'home_parent_deny=%s\n' "$HOME_PARENT_DENY"
          } >> "$GITHUB_OUTPUT"

      - name: Prepare workspace ancestor stubs for the scrub sandbox
        id: ancestor_stubs
        if: inputs.mode == 'review' && steps.review_contract.outputs.stub_scan == 'true'
        run: |
          set -euo pipefail
          if ! command -v python3 >/dev/null 2>&1; then
            echo "::error::Review refused: python3 is required to prepare the workspace ancestor stubs safely."
            exit 1
          fi
          python3 -I - "$GITHUB_WORKSPACE" << 'PY'
          import errno
          import os
          import pwd
          import secrets
          import stat
          import sys

          MCP_CONTENT = b'{"mcpServers":{}}\n'
          workspace = sys.argv[1]
          os.umask(0o022)
          rejected = []

          def report(kind, path, detail=""):
              print(f"{kind}: {path}{(' (' + detail + ')') if detail else ''}")

          def ancestors_of(path):
              found = []
              current = os.path.dirname(path.rstrip("/") or "/")
              while current and current != "/":
                  found.append(current)
                  current = os.path.dirname(current)
              return found

          candidates = []
          for source in (workspace, os.path.realpath(workspace)):
              for ancestor in ancestors_of(source):
                  canonical = os.path.realpath(ancestor)
                  if canonical != "/" and canonical not in candidates:
                      candidates.append(canonical)

          def open_dir_nofollow(path):
              fd = os.open("/", os.O_RDONLY | os.O_DIRECTORY)
              try:
                  for part in [p for p in path.split("/") if p]:
                      next_fd = os.open(part, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW, dir_fd=fd)
                      os.close(fd)
                      fd = next_fd
              except BaseException:
                  os.close(fd)
                  raise
              return fd

          def entry_state(fd, name):
              try:
                  return os.stat(name, dir_fd=fd, follow_symlinks=False)
              except FileNotFoundError:
                  return None

          def check_dir_entry(fd, path, name, st, created):
              target = f"{path}/{name}"
              if stat.S_ISLNK(st.st_mode) or not stat.S_ISDIR(st.st_mode):
                  report("rejected", target, "exists and is not a real directory")
                  rejected.append(target)
                  return
              report("created" if created else "kept", target)

          def check_file_entry(fd, path, name, st, created):
              target = f"{path}/{name}"
              if stat.S_ISLNK(st.st_mode) or not stat.S_ISREG(st.st_mode):
                  report("rejected", target, "exists and is not a regular file")
                  rejected.append(target)
                  return
              report("created" if created else "kept", target)

          def home_owner(path, owner):
              try:
                  entry = pwd.getpwuid(owner)
              except KeyError:
                  return None
              if entry.pw_dir and os.path.realpath(entry.pw_dir) == path:
                  return entry
              return None

          def warn_home_stub(fd, path, owner_entry):
              if not owner_entry:
                  return
              st = entry_state(fd, ".claude")
              if st is None or st.st_uid != 0:
                  return
              print(f"::warning::{path}/.claude is a root-owned directory in the home directory of {owner_entry.pw_name}. The scrub sandbox of a root review needs it there (anthropics/claude-code#97731), so it stays. Claude Code run by {owner_entry.pw_name} cannot write its settings in it. To give the directory back, move the runner out of that home, then run: sudo rm -r {path}/.claude")

          def ensure_claude_dir(fd, path):
              name = ".claude"
              st = entry_state(fd, name)
              if st is not None:
                  check_dir_entry(fd, path, name, st, False)
                  return
              try:
                  os.mkdir(name, 0o755, dir_fd=fd)
              except FileExistsError:
                  st = entry_state(fd, name)
                  if st is None:
                      report("rejected", f"{path}/{name}", "changed during creation")
                      rejected.append(f"{path}/{name}")
                      return
                  check_dir_entry(fd, path, name, st, False)
                  return
              new_fd = os.open(name, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW, dir_fd=fd)
              try:
                  os.fchmod(new_fd, 0o755)
                  st = os.fstat(new_fd)
              finally:
                  os.close(new_fd)
              if st.st_uid != 0 or stat.S_IMODE(st.st_mode) != 0o755:
                  report("rejected", f"{path}/{name}", "created with the wrong owner or mode")
                  rejected.append(f"{path}/{name}")
                  return
              check_dir_entry(fd, path, name, st, True)

          def ensure_mcp_file(fd, path):
              name = ".mcp.json"
              st = entry_state(fd, name)
              if st is not None:
                  check_file_entry(fd, path, name, st, False)
                  return
              temp_name = f".mcp.json.rk-{os.getpid()}-{secrets.token_hex(8)}"
              temp_fd = os.open(temp_name, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o644, dir_fd=fd)
              try:
                  try:
                      os.write(temp_fd, MCP_CONTENT)
                      os.fchmod(temp_fd, 0o644)
                      os.fsync(temp_fd)
                  finally:
                      os.close(temp_fd)
                  try:
                      os.link(temp_name, name, src_dir_fd=fd, dst_dir_fd=fd, follow_symlinks=False)
                      created = True
                  except FileExistsError:
                      created = False
              finally:
                  try:
                      os.unlink(temp_name, dir_fd=fd)
                  except FileNotFoundError:
                      pass
              st = entry_state(fd, name)
              if st is None:
                  report("rejected", f"{path}/{name}", "changed during creation")
                  rejected.append(f"{path}/{name}")
                  return
              if created and (st.st_uid != 0 or stat.S_IMODE(st.st_mode) != 0o644):
                  report("rejected", f"{path}/{name}", "created with the wrong owner or mode")
                  rejected.append(f"{path}/{name}")
                  return
              check_file_entry(fd, path, name, st, created)

          for path in candidates:
              try:
                  fd = open_dir_nofollow(path)
              except OSError as error:
                  report("rejected", path, f"cannot open without following a link: {errno.errorcode.get(error.errno, error.errno)}")
                  rejected.append(path)
                  continue
              try:
                  owner = os.fstat(fd).st_uid
                  if owner == 0:
                      continue
                  owner_entry = home_owner(path, owner)
                  if owner_entry:
                      print(f"ancestor owned by uid {owner} is the home of {owner_entry.pw_name}: {path}")
                  else:
                      print(f"ancestor owned by uid {owner}: {path}")
                  ensure_claude_dir(fd, path)
                  ensure_mcp_file(fd, path)
                  warn_home_stub(fd, path, owner_entry)
              except OSError as error:
                  report("rejected", path, f"stub preparation failed: {errno.errorcode.get(error.errno, error.errno)}")
                  rejected.append(path)
              finally:
                  os.close(fd)

          if rejected:
              print("::error::Review refused: the workspace ancestor stubs could not be prepared safely, so the scrub sandbox cannot run. Safe entries stay in place. Rejected: " + ", ".join(rejected))
              sys.exit(1)
          PY

      - name: Select the agent home
        id: agent_home
        env:
          NEEDS_TEMP_HOME: ${{ steps.review_contract.outputs.needs_temp_home }}
          HOME_PARENT_DENY: ${{ steps.review_contract.outputs.home_parent_deny }}
        run: |
          set -euo pipefail
          umask 077
          PARENT=""
          NO_PARENT_REASON=""
          if [ "${HOME_PARENT_DENY:-}" = "true" ]; then
            UID_NOW=$(id -u)
            PW_HOME=$(getent passwd "$UID_NOW" 2>/dev/null | cut -d: -f6) || PW_HOME=""
            PW_RESOLVED=""
            if [ -n "$PW_HOME" ]; then
              PW_RESOLVED=$(cd -P "$PW_HOME" 2>/dev/null && pwd -P) || PW_RESOLVED=""
            fi
            if [ -n "$PW_RESOLVED" ] && [ "$PW_RESOLVED" != "/" ] && [ -d "$PW_RESOLVED" ] && [ -O "$PW_RESOLVED" ] && [ -z "$(find "$PW_RESOLVED" -maxdepth 0 -perm /022 -print)" ]; then
              PARENT="$PW_RESOLVED/.rk-claude-homes"
              mkdir "$PARENT" 2>/dev/null || true
              if [ ! -L "$PARENT" ] && [ -d "$PARENT" ] && [ -O "$PARENT" ]; then
                chmod go-rwx "$PARENT"
              fi
              if [ -L "$PARENT" ] || [ ! -d "$PARENT" ] || [ ! -O "$PARENT" ] || [ -n "$(find "$PARENT" -maxdepth 0 -perm /077 -print)" ]; then
                echo "::error::Review refused: $PARENT, the directory that holds the temporary agent homes of this user, is not a directory owned by this user with no group or other permissions ($(stat -c '%F, owner %U, mode %a' "$PARENT" 2>&1)). Remove it when no review runs on this host."
                exit 1
              fi
              find "$PARENT" -mindepth 1 -maxdepth 1 -name 'home.??????????' -type d -empty -mmin +1440 -delete 2>/dev/null || true
            else
              NO_PARENT_REASON="the home directory of user ID $UID_NOW in the passwd database (${PW_HOME:-none}) is missing, is /, is not owned by this user, or is writable by group or others"
              echo "No directory for temporary agent homes: $NO_PARENT_REASON."
            fi
          fi
          if [ "${HOME_PARENT_DENY:-}" = "true" ] && [ ! -e "$HOME/.bash_profile" ] && [ ! -L "$HOME/.bash_profile" ]; then
            if printf '%s\n' "if [ -s \"\$HOME/.bash_login\" ]; then . \"\$HOME/.bash_login\"; elif [ -f \"\$HOME/.profile\" ]; then . \"\$HOME/.profile\"; fi" > "$HOME/.bash_profile" 2>/dev/null; then
              echo "Created $HOME/.bash_profile, which loads a .bash_login that has content, or else .profile, as a bash login shell does without it. Without this file, the scrub sandbox or the protected job home entries leave an empty .bash_profile, and a bash login shell then skips .profile. It stays on the host; delete it to remove it."
            else
              echo "::warning::$HOME/.bash_profile cannot be created. The scrub sandbox can leave an empty .bash_profile there, and a bash login shell then skips .profile."
            fi
          fi
          if [ "$NEEDS_TEMP_HOME" != "true" ]; then
            if [ "${HOME_PARENT_DENY:-}" = "true" ]; then
              for entry in .local/bin .bun/bin; do
                if [ ! -e "$HOME/$entry" ] && [ ! -L "$HOME/$entry" ]; then
                  if ! mkdir -p "$HOME/$entry"; then
                    echo "::error::Review refused: $HOME/$entry, where the action installs a program and which it adds to PATH, cannot be created, so the settings cannot deny sandboxed writes to it."
                    exit 1
                  fi
                  echo "Created $HOME/$entry, where the action installs a program and which it adds to PATH, so the settings can deny sandboxed writes to it. The action fills it; it stays on the host."
                fi
              done
            fi
            {
              printf 'path=%s\n' "$HOME"
              printf 'temp=\n'
              printf 'parent=%s\n' "$PARENT"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$PARENT" ]; then
            echo "::error::Review refused: a temporary agent home is needed, but there is no protected directory to hold it: ${NO_PARENT_REASON:-the run contract does not protect one}."
            exit 1
          fi
          AGENT_HOME=$(mktemp -d "$PARENT/home.XXXXXXXXXX")
          if [ -L "$AGENT_HOME" ] || [ ! -d "$AGENT_HOME" ] || [ ! -O "$AGENT_HOME" ] || [ -n "$(find "$AGENT_HOME" -maxdepth 0 -perm /077 -print)" ]; then
            echo "::error::Review refused: the temporary agent home $AGENT_HOME is not a directory owned by this user with no group or other permissions ($(stat -c '%F, owner %U, mode %a' "$AGENT_HOME" 2>&1))."
            exit 1
          fi
          printf '#!/bin/sh\nexit 0\n' > "$AGENT_HOME/.rk-exec-check"
          chmod 700 "$AGENT_HOME/.rk-exec-check"
          if ! "$AGENT_HOME/.rk-exec-check"; then
            echo "::error::Review refused: programs cannot run from the temporary agent home $AGENT_HOME (its file system is mounted noexec)."
            exit 1
          fi
          rm -f "$AGENT_HOME/.rk-exec-check"
          for entry in .bashrc .bash_profile .bash_login .bash_logout .profile .zshrc .zshenv .zprofile .zlogin .zlogout .bunfig.toml .npmrc .yarnrc .yarnrc.yml .netrc; do
            : > "$AGENT_HOME/$entry"
          done
          printf '{}\n' > "$AGENT_HOME/.claude.json"
          for entry in .claude .config/git .config/pip .config/gh .pip .local/bin .bun/bin .ssh runners actions-runner; do
            mkdir -p "$AGENT_HOME/$entry"
          done
          JOB_HOME_CREATED=()
          for entry in .bashrc .bash_profile .bash_login .bash_logout .profile .zshrc .zshenv .zprofile .zlogin .zlogout .bunfig.toml .npmrc .yarnrc .yarnrc.yml .netrc .gitconfig .git-credentials .claude.json; do
            if [ ! -e "$HOME/$entry" ] && [ ! -L "$HOME/$entry" ]; then
              if ! : > "$HOME/$entry"; then
                echo "::error::Review refused: the job home entry $HOME/$entry cannot be created, so the scrub sandbox cannot protect it."
                exit 1
              fi
              if [ "$entry" = .claude.json ]; then
                printf '{}\n' > "$HOME/$entry"
              fi
              JOB_HOME_CREATED+=("$entry")
            fi
          done
          for entry in .claude .config/git .config/pip .config/gh .pip .local/bin .bun/bin .ssh; do
            if [ ! -e "$HOME/$entry" ] && [ ! -L "$HOME/$entry" ]; then
              if ! mkdir -p "$HOME/$entry"; then
                echo "::error::Review refused: the job home entry $HOME/$entry cannot be created, so the scrub sandbox cannot protect it."
                exit 1
              fi
              JOB_HOME_CREATED+=("$entry")
            fi
          done
          if [ "${#JOB_HOME_CREATED[@]}" -gt 0 ]; then
            echo "The action step runs with a temporary HOME, so the sandbox no longer protects the job home $HOME by itself. Created the missing protected entries there, which the settings deny and which stay on the host: ${JOB_HOME_CREATED[*]}. Delete the listed entries to remove them."
          fi
          WS_RESOLVED=$(cd -P "$GITHUB_WORKSPACE" && pwd -P)
          git config --file "$AGENT_HOME/.gitconfig" --add safe.directory "$GITHUB_WORKSPACE"
          if [ "$WS_RESOLVED" != "$GITHUB_WORKSPACE" ]; then
            git config --file "$AGENT_HOME/.gitconfig" --add safe.directory "$WS_RESOLVED"
          fi
          echo "The action step runs with the temporary HOME $AGENT_HOME."
          {
            printf 'path=%s\n' "$AGENT_HOME"
            printf 'temp=%s\n' "$AGENT_HOME"
            printf 'parent=%s\n' "$PARENT"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ inputs.mode == 'review' && '0' || '1' }}
          persist-credentials: ${{ inputs.mode != 'review' }}

      - name: Read review git credentials from the environment at fetch time
        if: inputs.mode == 'review'
        run: |
          git config --local core.repositoryformatversion 1
          git config --local extensions.worktreeConfig true
          git config --worktree credential.helper ""
          git config --worktree "credential.${GITHUB_SERVER_URL}.helper" ""
          git config --worktree --add "credential.${GITHUB_SERVER_URL}.helper" "!f() { test \"\$1\" = get || return 0; echo username=x-access-token; echo \"password=\$GH_TOKEN\"; }; f"

      - name: Resolve immutable runtime revisions
        id: runtime_sources
        env:
          WORKFLOW_SHA: ${{ job.workflow_sha }}
          PLUGINS_OFFICIAL_SHA: e0ab6e51219eef74e417a0e1d89e5d53e5e763d4
          MODE: ${{ inputs.mode }}
          COMMAND_POLICY: ${{ inputs.command_policy }}
          COMMAND_POLICY_SHA: ${{ inputs.command_policy_sha }}
        run: |
          set -euo pipefail
          require_sha() {
            name="$1"
            value="$2"
            if ! printf '%s' "$value" | grep -qxE '[0-9a-f]{40}'; then
              echo "::error::${name} is not a full commit identifier. The run stops. There is no branch or tag fallback."
              exit 1
            fi
          }
          require_sha "Called workflow revision" "$WORKFLOW_SHA"
          require_sha "Pinned Claude plugin marketplace" "$PLUGINS_OFFICIAL_SHA"
          POLICY_ON=false
          POLICY_SHA=""
          if [ "$MODE" != "review" ] && [ "$COMMAND_POLICY" = "true" ]; then
            case "$COMMAND_POLICY_SHA" in
              *$'\n'*|*$'\r'*)
                echo "::error::Command policy refused: command_policy_sha holds a line break. The run stops. There is no branch or tag fallback."
                exit 1
                ;;
            esac
            require_sha "Command policy revision (command_policy_sha)" "$COMMAND_POLICY_SHA"
            POLICY_ON=true
            POLICY_SHA="$COMMAND_POLICY_SHA"
          fi
          {
            printf 'workflow_sha=%s\n' "$WORKFLOW_SHA"
            printf 'plugins_official_sha=%s\n' "$PLUGINS_OFFICIAL_SHA"
            printf 'command_policy=%s\n' "$POLICY_ON"
            printf 'command_policy_sha=%s\n' "$POLICY_SHA"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout rk-skills (shared prompts and scripts)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: richkuo/rk-skills
          ref: ${{ steps.runtime_sources.outputs.workflow_sha }}
          path: .rk-skills-shared
          fetch-depth: 1
          persist-credentials: false

      - name: Stage shared prompts and scripts outside the workspace
        env:
          WORKFLOW_SHA: ${{ steps.runtime_sources.outputs.workflow_sha }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$WORKFLOW_SHA" | grep -qxE '[0-9a-f]{40}'; then
            echo "::error::Called workflow revision is not a full commit identifier. The run stops. There is no branch or tag fallback."
            exit 1
          fi
          got_workflow="$(git -C .rk-skills-shared rev-parse HEAD)"
          if [ "$got_workflow" != "$WORKFLOW_SHA" ]; then
            echo "::error::Shared checkout ${got_workflow} does not match the called workflow commit ${WORKFLOW_SHA}."
            exit 1
          fi
          rm -rf "$RUNNER_TEMP/rk-shared"
          mkdir -p "$RUNNER_TEMP/rk-shared"
          cp -R .rk-skills-shared/templates/claude-workflow/prompts "$RUNNER_TEMP/rk-shared/prompts"
          cp -R .rk-skills-shared/templates/claude-workflow/scripts "$RUNNER_TEMP/rk-shared/scripts"
          test -d "$RUNNER_TEMP/rk-shared/prompts"
          test -f "$RUNNER_TEMP/rk-shared/scripts/patch_claude_comment.sh"

      - name: Checkout pinned Claude plugin sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: anthropics/claude-plugins-official
          ref: ${{ steps.runtime_sources.outputs.plugins_official_sha }}
          path: .rk-plugin-official
          fetch-depth: 1
          persist-credentials: false

      - name: Stage pinned plugin sources outside the workspace
        env:
          WORKFLOW_SHA: ${{ steps.runtime_sources.outputs.workflow_sha }}
          PLUGINS_OFFICIAL_SHA: ${{ steps.runtime_sources.outputs.plugins_official_sha }}
        run: |
          set -euo pipefail
          require_sha() {
            name="$1"
            value="$2"
            if ! printf '%s' "$value" | grep -qxE '[0-9a-f]{40}'; then
              echo "::error::${name} is not a full commit identifier. The run stops. There is no branch or tag fallback."
              exit 1
            fi
          }
          require_sha "Called workflow revision" "$WORKFLOW_SHA"
          require_sha "Pinned Claude plugin marketplace" "$PLUGINS_OFFICIAL_SHA"

          got_workflow="$(git -C .rk-skills-shared rev-parse HEAD)"
          if [ "$got_workflow" != "$WORKFLOW_SHA" ]; then
            echo "::error::Shared checkout ${got_workflow} does not match the called workflow commit ${WORKFLOW_SHA}."
            exit 1
          fi
          got_plugins="$(git -C .rk-plugin-official rev-parse HEAD)"
          if [ "$got_plugins" != "$PLUGINS_OFFICIAL_SHA" ]; then
            echo "::error::Plugin checkout ${got_plugins} does not match the pinned commit ${PLUGINS_OFFICIAL_SHA}."
            exit 1
          fi

          plugin_source() {
            file="$1"
            plugin="$2"
            if command -v jq >/dev/null 2>&1; then
              jq -er --arg name "$plugin" '
                (.plugins // []) | map(select(.name == $name)) as $matches
                | if ($matches | length) != 1 then
                    error("count")
                  else
                    $matches[0].source
                  end
                | if type != "string" then
                    error("type")
                  else
                    .
                  end
              ' "$file"
              return
            fi
            if ! command -v python3 >/dev/null 2>&1; then
              echo "::error::jq or python3 is required to validate pinned plugin sources." >&2
              return 1
            fi
            python3 -I - "$file" "$plugin" << 'PY'
          import json, sys
          path, name = sys.argv[1], sys.argv[2]
          with open(path) as handle:
              data = json.load(handle)
          matches = [item for item in data.get("plugins", []) if item.get("name") == name]
          if len(matches) != 1:
              sys.exit(1)
          source = matches[0].get("source")
          if not isinstance(source, str):
              sys.exit(1)
          print(source)
          PY
          }

          read_source() {
            file="$1"
            plugin="$2"
            if ! value="$(plugin_source "$file" "$plugin")"; then
              echo "::error::Could not read one string source for ${plugin}. The run stops. There is no branch or tag fallback." >&2
              exit 1
            fi
            printf '%s' "$value"
          }

          require_plugin_dir() {
            plugin="$1"
            source="$2"
            root="$3"
            if ! printf '%s' "$source" | grep -qxE '\./[A-Za-z0-9._/-]+'; then
              echo "::error::${plugin} source is not a relative path inside the pinned checkout. The run stops. There is no branch or tag fallback." >&2
              exit 1
            fi
            case "$source" in
              *..*)
                echo "::error::${plugin} source leaves the pinned checkout." >&2
                exit 1
                ;;
            esac
            rel="${source#./}"
            if [ ! -d "${root}/${rel}" ]; then
              echo "::error::Pinned checkout is missing ${plugin} at ${rel}." >&2
              exit 1
            fi
            printf '%s' "$rel"
          }

          skills_source="$(read_source ".rk-skills-shared/.claude-plugin/marketplace.json" rk-skills)"
          if [ "$skills_source" != "./" ]; then
            echo "::error::rk-skills plugin source is not the repository root. The run stops. There is no branch or tag fallback."
            exit 1
          fi

          code_review_source="$(read_source ".rk-plugin-official/.claude-plugin/marketplace.json" code-review)"
          md_source="$(read_source ".rk-plugin-official/.claude-plugin/marketplace.json" claude-md-management)"
          code_review_rel="$(require_plugin_dir code-review "$code_review_source" .rk-plugin-official)"
          md_rel="$(require_plugin_dir claude-md-management "$md_source" .rk-plugin-official)"

          rm -rf "$RUNNER_TEMP/rk-plugin-sources"
          mkdir -p "$RUNNER_TEMP/rk-plugin-sources"
          cp -R .rk-skills-shared "$RUNNER_TEMP/rk-plugin-sources/rk-skills"
          rm -rf "$RUNNER_TEMP/rk-plugin-sources/rk-skills/.git"

          pinned="$RUNNER_TEMP/rk-plugin-sources/rk-pinned-claude-plugins"
          mkdir -p "$pinned/.claude-plugin" "$(dirname "$pinned/$code_review_rel")" "$(dirname "$pinned/$md_rel")"
          cp -R ".rk-plugin-official/$code_review_rel" "$pinned/$code_review_rel"
          cp -R ".rk-plugin-official/$md_rel" "$pinned/$md_rel"
          if command -v python3 >/dev/null 2>&1; then
            python3 -I - ".rk-plugin-official/.claude-plugin/marketplace.json" "$pinned/.claude-plugin/marketplace.json" "$code_review_source" "$md_source" << 'PY'
          import json, sys
          upstream, dest, code_review, md = sys.argv[1:]
          with open(upstream) as handle:
              data = json.load(handle)
          def entry(name, source):
              matches = [item for item in data.get("plugins", []) if isinstance(item, dict) and item.get("name") == name]
              if len(matches) != 1:
                  sys.exit(1)
              item = dict(matches[0])
              item["source"] = source
              return item
          body = {
              "name": "rk-pinned-claude-plugins",
              "description": "Local copies of the required Claude plugins from one reviewed commit.",
              "owner": {"name": "rk-skills maintainers"},
              "plugins": [
                  entry("code-review", code_review),
                  entry("claude-md-management", md),
              ],
          }
          with open(dest, "w") as handle:
              json.dump(body, handle, indent=2)
              handle.write("\n")
          PY
          else
            jq -e --arg code_review "$code_review_source" --arg md "$md_source" \
              'def entry($name; $source): [.plugins[] | select(type == "object" and .name == $name)] | if length == 1 then .[0] | .source = $source else error("count") end; {name: "rk-pinned-claude-plugins", description: "Local copies of the required Claude plugins from one reviewed commit.", owner: {name: "rk-skills maintainers"}, plugins: [entry("code-review"; $code_review), entry("claude-md-management"; $md)]}' \
              .rk-plugin-official/.claude-plugin/marketplace.json > "$pinned/.claude-plugin/marketplace.json"
          fi

          rm -rf .rk-skills-shared .rk-plugin-official
          test -d "$RUNNER_TEMP/rk-shared/prompts"
          test -d "$RUNNER_TEMP/rk-shared/scripts"
          test -f "$RUNNER_TEMP/rk-plugin-sources/rk-skills/.claude-plugin/marketplace.json"
          test ! -e "$RUNNER_TEMP/rk-plugin-sources/rk-skills/.git"
          test -f "$pinned/.claude-plugin/marketplace.json"
          test -d "$pinned/$code_review_rel"
          test -d "$pinned/$md_rel"
          test ! -e .rk-skills-shared
          test ! -e .rk-plugin-official

      - name: Checkout the caller command policy
        if: steps.runtime_sources.outputs.command_policy == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ github.repository }}
          ref: ${{ steps.runtime_sources.outputs.command_policy_sha }}
          path: .rk-command-policy
          fetch-depth: 1
          persist-credentials: false

      - name: Stage the command policy outside the workspace
        id: command_policy
        if: steps.runtime_sources.outputs.command_policy == 'true'
        env:
          COMMAND_POLICY_SHA: ${{ steps.runtime_sources.outputs.command_policy_sha }}
          COMMAND_POLICY_PROOF_ACTION_SHA: f3b070c88125d33dbae5653df5f143101d4ea9dc
          POLICY_INTERPRETERS: /usr/bin/python3:/usr/local/bin/python3
          POLICY_WORKFLOW_FILE: ${{ runner.temp }}/rk-plugin-sources/rk-skills/.github/workflows/claude-run.yml
          POLICY_DIR: ${{ runner.temp }}/rk-command-policy
          POLICY_WORKSPACE: ${{ github.workspace }}
          AGENT_HOME: ${{ steps.agent_home.outputs.path }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          POLICY_MAIN_MARKETPLACES: |
            ${{ runner.temp }}/rk-plugin-sources/rk-pinned-claude-plugins
            ${{ runner.temp }}/rk-plugin-sources/rk-skills
          POLICY_MAIN_PLUGINS: |
            code-review@rk-pinned-claude-plugins
            rk-skills@rk-skills
          POLICY_GUIDE_MARKETPLACES: |
            ${{ runner.temp }}/rk-plugin-sources/rk-pinned-claude-plugins
          POLICY_GUIDE_PLUGINS: |
            code-review@rk-pinned-claude-plugins
            claude-md-management@rk-pinned-claude-plugins
        run: |
          set -euo pipefail
          refuse() {
            echo "::error::Command policy refused: $1"
            exit 1
          }
          require_sha() {
            case "$2" in
              *$'\n'*|*$'\r'*) refuse "$1 holds a line break." ;;
            esac
            if ! printf '%s' "$2" | grep -qxE '[0-9a-f]{40}'; then
              refuse "$1 is not a full commit identifier. There is no branch or tag fallback."
            fi
          }
          safe_path() {
            case "$2" in
              ''|*'"'*|*'`'*|*'$'*|*'\'*|*$'\n'*|*$'\r'*)
                refuse "$1 is empty or holds a double quote, backtick, dollar sign, backslash, or line break, so the launch arguments cannot carry it."
                ;;
            esac
          }

          require_sha "command_policy_sha" "$COMMAND_POLICY_SHA"
          if [ -z "$COMMAND_POLICY_PROOF_ACTION_SHA" ]; then
            refuse "no hook proof is recorded for the pinned anthropics/claude-code-action commit (COMMAND_POLICY_PROOF_ACTION_SHA is empty). Run the review sandbox probe on the pin and record the commit it proved."
          fi
          require_sha "The action commit that the hook proof ran against (COMMAND_POLICY_PROOF_ACTION_SHA)" "$COMMAND_POLICY_PROOF_ACTION_SHA"

          if [ ! -f "$POLICY_WORKFLOW_FILE" ] || [ -L "$POLICY_WORKFLOW_FILE" ]; then
            refuse "the called workflow file $POLICY_WORKFLOW_FILE is missing, so the pinned action commit cannot be read."
          fi
          PIN_COUNT=0
          while IFS= read -r line; do
            pin=$(printf '%s\n' "$line" | sed -nE 's/^[[:space:]]*(-[[:space:]]+)?uses:[[:space:]]*anthropics\/claude-code-action@([0-9a-f]{40})([[:space:]].*)?$/\2/p')
            if [ -z "$pin" ]; then
              refuse "the called workflow has an action step that does not pin anthropics/claude-code-action to a full commit, so the hook proof cannot cover it: $line"
            fi
            if [ "$pin" != "$COMMAND_POLICY_PROOF_ACTION_SHA" ]; then
              refuse "the pinned anthropics/claude-code-action commit $pin differs from the commit $COMMAND_POLICY_PROOF_ACTION_SHA that the hook proof ran against. Run the review sandbox probe on the new pin and record its commit."
            fi
            PIN_COUNT=$((PIN_COUNT + 1))
          done < <(grep -E '^[[:space:]]*(-[[:space:]]+)?uses:.*claude-code-action' "$POLICY_WORKFLOW_FILE" || true)
          if [ "$PIN_COUNT" -eq 0 ]; then
            refuse "the called workflow has no anthropics/claude-code-action step, so the pinned action commit cannot be read."
          fi

          if [ ! -d .rk-command-policy ] || [ -L .rk-command-policy ]; then
            refuse "the policy checkout .rk-command-policy is missing."
          fi
          GOT_SHA=$(git -C .rk-command-policy rev-parse HEAD) || refuse "the policy checkout has no commit."
          if [ "$GOT_SHA" != "$COMMAND_POLICY_SHA" ]; then
            refuse "the policy checkout is at $GOT_SHA, which differs from command_policy_sha $COMMAND_POLICY_SHA."
          fi

          case "$DEFAULT_BRANCH" in
            ''|-*|*..*|*[!A-Za-z0-9._/-]*) refuse "the default branch name of the repository is empty or is not a plain branch name." ;;
          esac
          command -v gh >/dev/null 2>&1 || refuse "gh is required to confirm that command_policy_sha is on the default branch."
          COMPARE=$(gh api "repos/$REPO/compare/$COMMAND_POLICY_SHA...$DEFAULT_BRANCH" -q .status 2>/dev/null) || refuse "the compare of command_policy_sha with the default branch $DEFAULT_BRANCH failed."
          case "$COMPARE" in
            ahead|identical) ;;
            *) refuse "command_policy_sha $COMMAND_POLICY_SHA is not on the default branch $DEFAULT_BRANCH (compare status: ${COMPARE:-none}). Use a commit that the default branch contains." ;;
          esac

          POLICY_PATH=.claude/hooks/command_policy.py
          ENTRY=$(git -C .rk-command-policy ls-tree HEAD -- "$POLICY_PATH") || refuse "the tree of command_policy_sha cannot be read."
          if [ -z "$ENTRY" ]; then
            refuse "$POLICY_PATH is missing at $COMMAND_POLICY_SHA, or a directory on its path is not a real directory."
          fi
          if [ "$(printf '%s\n' "$ENTRY" | wc -l | tr -d ' ')" != 1 ]; then
            refuse "$POLICY_PATH matches more than one tree entry at $COMMAND_POLICY_SHA."
          fi
          ENTRY_NAME="${ENTRY#*$'\t'}"
          read -r ENTRY_MODE ENTRY_TYPE CHECKER_OID <<< "${ENTRY%%$'\t'*}"
          if [ "$ENTRY_NAME" != "$POLICY_PATH" ] || [ "$ENTRY_TYPE" != blob ]; then
            refuse "$POLICY_PATH is not a regular file at $COMMAND_POLICY_SHA."
          fi
          case "$ENTRY_MODE" in
            100644|100755) ;;
            *) refuse "$POLICY_PATH is not a regular file at $COMMAND_POLICY_SHA (mode $ENTRY_MODE)." ;;
          esac

          INTERPRETER=""
          IFS=: read -r -a CANDIDATES <<< "$POLICY_INTERPRETERS"
          for candidate in "${CANDIDATES[@]}"; do
            case "$candidate" in
              /*) ;;
              *) continue ;;
            esac
            if [ -f "$candidate" ] && [ -x "$candidate" ]; then
              INTERPRETER="$candidate"
              break
            fi
          done
          if [ -z "$INTERPRETER" ]; then
            refuse "no hook interpreter: none of $POLICY_INTERPRETERS is an executable regular file. Install python3 at one of these paths."
          fi
          INTERPRETER_REAL=$("$INTERPRETER" -I -c 'import os, sys; print(os.path.realpath(sys.argv[1]))' "$INTERPRETER") || refuse "the hook interpreter $INTERPRETER does not run."
          if [ ! -f "$INTERPRETER_REAL" ] || [ -L "$INTERPRETER_REAL" ] || [ ! -x "$INTERPRETER_REAL" ]; then
            refuse "the hook interpreter $INTERPRETER resolves to $INTERPRETER_REAL, which is not an executable regular file."
          fi
          safe_path "The workspace path" "$POLICY_WORKSPACE"
          safe_path "RUNNER_TEMP" "$RUNNER_TEMP"
          safe_path "The hook interpreter path" "$INTERPRETER"
          if [ "$POLICY_DIR" != "$RUNNER_TEMP/rk-command-policy" ]; then
            refuse "the staging directory $POLICY_DIR is not RUNNER_TEMP/rk-command-policy."
          fi
          WS_REAL=$(cd -P "$POLICY_WORKSPACE" && pwd -P) || refuse "the workspace cannot be resolved."
          RT_REAL=$(cd -P "$RUNNER_TEMP" && pwd -P) || refuse "RUNNER_TEMP cannot be resolved."
          for root in "$POLICY_WORKSPACE" "$WS_REAL" "$RUNNER_TEMP" "$RT_REAL"; do
            for path in "$INTERPRETER" "$INTERPRETER_REAL"; do
              case "$path/" in
                "${root%/}"/*) refuse "the hook interpreter path $path is inside $root, where a session can change it." ;;
              esac
            done
          done
          INTERPRETER_OID=$(git -C / hash-object --no-filters "$INTERPRETER_REAL") || refuse "the hook interpreter cannot be hashed."

          if [ -L "$POLICY_DIR" ]; then
            rm -f "$POLICY_DIR"
          elif [ -e "$POLICY_DIR" ]; then
            if [ ! -d "$POLICY_DIR" ] || [ ! -O "$POLICY_DIR" ]; then
              refuse "a stale $POLICY_DIR is not a directory of this user, so it is not touched."
            fi
            find "$POLICY_DIR" -type d -exec chmod u+rwx {} \;
            rm -rf "$POLICY_DIR"
          fi
          if [ -e "$POLICY_DIR" ] || [ -L "$POLICY_DIR" ]; then
            refuse "the stale $POLICY_DIR cannot be removed."
          fi
          (umask 077 && mkdir "$POLICY_DIR")
          CHECKER="$POLICY_DIR/command_policy.py"
          SETTINGS="$POLICY_DIR/settings.json"
          CALL_RECORD="$POLICY_DIR/hook-calls.log"
          (umask 077 && git -C .rk-command-policy cat-file blob "$CHECKER_OID" > "$CHECKER") || refuse "the checker cannot be read from the policy commit."
          if [ "$(git -C .rk-command-policy hash-object --no-filters "$CHECKER")" != "$CHECKER_OID" ]; then
            refuse "the staged checker differs from the tree entry $CHECKER_OID."
          fi
          if [ ! -s "$CHECKER" ]; then
            refuse "$POLICY_PATH is empty at $COMMAND_POLICY_SHA."
          fi
          if ! "$INTERPRETER" -I -c 'import sys; compile(open(sys.argv[1], "rb").read(), sys.argv[1], "exec")' "$CHECKER"; then
            refuse "$POLICY_PATH at $COMMAND_POLICY_SHA does not compile with $INTERPRETER."
          fi
          CHECKER_OID=$(git -C / hash-object --no-filters "$CHECKER")
          CHECKER_SHA256=$("$INTERPRETER" -I -c 'import hashlib, sys; print(hashlib.sha256(open(sys.argv[1], "rb").read()).hexdigest())' "$CHECKER")
          (umask 077 && : > "$CALL_RECORD")

          LAUNCHER=$(cat << 'PY'
          import hashlib, os, sys, time
          def deny(reason):
              sys.stderr.write("Command policy hook: " + reason + " The tool call is blocked.\n")
              sys.exit(2)
          if len(sys.argv) != 4:
              deny("the launcher arguments are wrong.")
          path, digest, record = sys.argv[1:4]
          try:
              fd = os.open(path, os.O_RDONLY | os.O_NOFOLLOW)
              with os.fdopen(fd, "rb") as handle:
                  body = handle.read()
          except OSError:
              deny("the staged checker cannot be opened.")
          if hashlib.sha256(body).hexdigest() != digest:
              deny("the staged checker changed.")
          try:
              with open(record, "a") as handle:
                  handle.write("%f %d\n" % (time.time(), os.getpid()))
          except OSError:
              deny("the call record cannot be written.")
          sys.argv = [path]
          scope = {"__name__": "__main__", "__file__": path, "__builtins__": __builtins__}
          try:
              exec(compile(body, path, "exec"), scope)
          except SystemExit as stop:
              if stop.code is None or stop.code == 0:
                  sys.exit(0)
              if stop.code == 2:
                  sys.exit(2)
              if not isinstance(stop.code, int):
                  sys.stderr.write(str(stop.code) + "\n")
              deny("the checker stopped with an unexpected status.")
          except BaseException as error:
              deny("the checker failed (" + type(error).__name__ + ").")
          sys.exit(0)
          PY
          )
          case "$LAUNCHER" in
            *"'"*) refuse "the hook launcher holds a single quote." ;;
          esac
          SELF_TEST=$("$INTERPRETER" -I - "$INTERPRETER" "$LAUNCHER" "$CHECKER" "$CHECKER_SHA256" "$CALL_RECORD" "$SETTINGS" << 'PY'
          import json, shlex, sys
          interpreter, launcher, checker, digest, record, dest = sys.argv[1:7]
          def command(value):
              return " ".join([shlex.quote(interpreter), "-I", "-c", shlex.quote(launcher), shlex.quote(checker), value, shlex.quote(record)])
          body = {
              "disableAllHooks": False,
              "hooks": {
                  "PreToolUse": [
                      {
                          "matcher": "Bash",
                          "hooks": [
                              {
                                  "type": "command",
                                  "command": command(digest),
                                  "timeout": 30,
                                  "onFailure": "block",
                              }
                          ],
                      }
                  ]
              },
          }
          with open(dest, "x") as handle:
              json.dump(body, handle, indent=2)
              handle.write("\n")
          print(command("0" * 64))
          PY
          ) || refuse "the policy settings file cannot be written."
          chmod 400 "$CHECKER" "$SETTINGS"
          chmod 600 "$CALL_RECORD"
          SELF_STATUS=0
          printf '{}\n' | /bin/sh -c "$SELF_TEST" > /dev/null 2>&1 || SELF_STATUS=$?
          if [ "$SELF_STATUS" != 2 ]; then
            refuse "the hook self-test with a wrong checker hash exited $SELF_STATUS; it must exit 2."
          fi
          if [ -s "$CALL_RECORD" ]; then
            refuse "the hook self-test wrote to the call record."
          fi
          chmod 500 "$POLICY_DIR"
          SETTINGS_OID=$(git -C / hash-object --no-filters "$SETTINGS")

          rm -rf .rk-command-policy
          test ! -e .rk-command-policy

          USER_SETTINGS="${CLAUDE_CONFIG_DIR:-${AGENT_HOME:-$HOME}/.claude}/settings.json"
          case "$USER_SETTINGS" in
            *$'\n'*|*$'\r'*) refuse "the user settings path holds a line break." ;;
          esac
          USER_STATE=$("$INTERPRETER" -I - "$USER_SETTINGS" "$POLICY_MAIN_MARKETPLACES" "$POLICY_MAIN_PLUGINS" "$POLICY_GUIDE_MARKETPLACES" "$POLICY_GUIDE_PLUGINS" << 'PY'
          import hashlib, json, os, sys
          CONTROLLED = ("enableAllProjectMcpServers", "enabledPlugins", "extraKnownMarketplaces")
          def canon(value):
              return json.dumps(value, sort_keys=True, separators=(",", ":"), ensure_ascii=True)
          def items(text):
              return [item.strip() for item in text.split("\n") if item.strip()]
          def stage(markets, plugins):
              found = {}
              for path in items(markets):
                  try:
                      with open(os.path.join(path, ".claude-plugin", "marketplace.json")) as handle:
                          name = json.load(handle).get("name")
                  except (OSError, ValueError, AttributeError) as error:
                      raise SystemExit("the staged marketplace %s cannot be read (%s)" % (path, error))
                  if not isinstance(name, str) or not name:
                      raise SystemExit("the staged marketplace %s has no name" % path)
                  found[name] = sorted({path, os.path.realpath(path)})
              return {"extraKnownMarketplaces": found, "enabledPlugins": sorted(items(plugins))}
          data = {}
          if os.path.lexists(sys.argv[1]):
              with open(sys.argv[1], "rb") as handle:
                  raw = handle.read()
              if raw.strip():
                  data = json.loads(raw)
          if not isinstance(data, dict):
              raise SystemExit("the user settings file is not a JSON object")
          kept = {key: value for key, value in data.items() if key not in CONTROLLED}
          keys = {key: hashlib.sha256(canon(value).encode()).hexdigest() for key, value in kept.items()}
          base = {key: data[key] for key in CONTROLLED if key in data}
          allowed = {"main": stage(sys.argv[2], sys.argv[3]), "guide": stage(sys.argv[4], sys.argv[5])}
          print(hashlib.sha256(canon(kept).encode()).hexdigest())
          print(canon(keys))
          print(canon(base))
          print(canon(allowed))
          PY
          ) || refuse "the user settings file $USER_SETTINGS or a staged plugin marketplace cannot be read as JSON."
          USER_DIGEST=$(printf '%s\n' "$USER_STATE" | sed -n 1p)
          USER_KEYS=$(printf '%s\n' "$USER_STATE" | sed -n 2p)
          USER_BASE=$(printf '%s\n' "$USER_STATE" | sed -n 3p)
          USER_ALLOWED=$(printf '%s\n' "$USER_STATE" | sed -n 4p)

          {
            printf 'dir=%s\n' "$POLICY_DIR"
            printf 'checker=%s\n' "$CHECKER"
            printf 'checker_oid=%s\n' "$CHECKER_OID"
            printf 'checker_sha256=%s\n' "$CHECKER_SHA256"
            printf 'settings_file=%s\n' "$SETTINGS"
            printf 'settings_oid=%s\n' "$SETTINGS_OID"
            printf 'interpreter=%s\n' "$INTERPRETER"
            printf 'interpreter_real=%s\n' "$INTERPRETER_REAL"
            printf 'interpreter_oid=%s\n' "$INTERPRETER_OID"
            printf 'call_record=%s\n' "$CALL_RECORD"
            printf 'user_settings=%s\n' "$USER_SETTINGS"
            printf 'user_settings_digest=%s\n' "$USER_DIGEST"
            printf 'user_settings_keys=%s\n' "$USER_KEYS"
            printf 'user_settings_base=%s\n' "$USER_BASE"
            printf 'user_settings_allowed=%s\n' "$USER_ALLOWED"
            printf 'instructions_env=1\n'
          } >> "$GITHUB_OUTPUT"
          echo "Staged the command policy from $COMMAND_POLICY_SHA at $CHECKER (blob $CHECKER_OID) with the hook interpreter $INTERPRETER."

      - name: Resolve model and effort
        id: resolve
        env:
          MODEL_SHORT: ${{ inputs.model }}
          MODEL_ID_IN: ${{ inputs.model_id }}
          EFFORT_IN: ${{ inputs.effort }}
        run: |
          if [ -n "$MODEL_ID_IN" ]; then
            MODEL_ID="$MODEL_ID_IN"
          else
            case "$(printf '%s' "$MODEL_SHORT" | tr '[:upper:]' '[:lower:]')" in
              opus|opus5)     MODEL_ID="claude-opus-5-5" ;;
              sonnet|sonnet5) MODEL_ID="claude-sonnet-5-5" ;;
              fable|fable5)   MODEL_ID="claude-fable-5-2" ;;
              *)              MODEL_ID="claude-opus-5-5" ;;
            esac
          fi
          ID_RE='^[A-Za-z0-9][A-Za-z0-9._:@/-]*(\[[A-Za-z0-9]+\])?$'
          if ! [[ "$MODEL_ID" =~ $ID_RE ]]; then
            echo "::error::The model id is not a valid model id."
            exit 1
          fi

          EFFORT=$(printf '%s' "$EFFORT_IN" | tr '[:upper:]' '[:lower:]')
          case "$EFFORT" in
            '') EFFORT=high ;;
            low|medium|high|xhigh) ;;
            *)
              echo "::error::The effort must be low, medium, high, or xhigh."
              exit 1
              ;;
          esac

          echo "model_id=$MODEL_ID" >> "$GITHUB_OUTPUT"
          echo "effort=$EFFORT" >> "$GITHUB_OUTPUT"
          echo "::notice::Using model: $MODEL_ID"
          echo "::notice::Using effort: $EFFORT"

      - name: Prune stale worktrees before Claude runs
        run: |
          git worktree list --porcelain | sed -n 's/^worktree //p' | while IFS= read -r wt; do
            case "$wt" in
              "$GITHUB_WORKSPACE"/.claude/worktrees/*)
                git worktree remove --force "$wt" 2>/dev/null || rm -rf "$wt" ;;
            esac
          done
          git worktree prune

      - name: Stage the pull request under review
        if: inputs.mode == 'review'
        id: pr_context
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          SETTINGS_FILE: ${{ runner.temp }}/claude-review-settings.json
          GUARD_FILE: ${{ runner.temp }}/claude-review-credential-guard.sh
          REAL_HOME: ${{ steps.review_contract.outputs.real_home }}
          AGENT_HOME: ${{ steps.agent_home.outputs.path }}
          TEMP_AGENT_HOME: ${{ steps.agent_home.outputs.temp }}
          HOME_PARENT: ${{ steps.agent_home.outputs.parent }}
          HOME_PARENT_DENY: ${{ steps.review_contract.outputs.home_parent_deny }}
        run: |
          if [ -z "$REAL_HOME" ] || [ -z "$AGENT_HOME" ]; then
            echo "::error::The run contract has no job home or agent home, so the credential guard cannot cover them."
            exit 1
          fi
          rm -f "$GUARD_FILE" "$SETTINGS_FILE"
          {
            printf '#!/usr/bin/env bash\n'
            printf 'RK_REAL_HOME=%q\n' "$REAL_HOME"
            printf 'RK_AGENT_HOME=%q\n' "$AGENT_HOME"
            printf 'RK_XDG_CONFIG_HOME=%q\n' "${XDG_CONFIG_HOME:-}"
            cat <<'GUARD_EOF'
          set -u
          block() {
            echo "Credential guard: $1. The job token can be readable, so stop the review and report that this run is unsafe." >&2
            exit 2
          }
          AFTER_ACTION=0
          [ "${1:-}" = "--after-action" ] && AFTER_ACTION=1
          action_token_output_only() {
            case "$1" in
              "${RUNNER_TEMP:-/nonexistent}"/_runner_file_commands/set_output_*) ;;
              *) return 1 ;;
            esac
            [ -f "$1" ] && [ ! -L "$1" ] || return 1
            awk -v t="$2" -v b="$3" '
              state == 1 { if ($0 != t) bad = 1; state = 2; next }
              state == 2 { if ($0 != delim) bad = 1; state = 0; next }
              /^github_token<<ghadelimiter_[0-9a-f-]+$/ { delim = substr($0, 15); state = 1; next }
              index($0, t) || index($0, b) { bad = 1 }
              END { exit (bad || state != 0) }
            ' "$1"
          }
          WS="${GITHUB_WORKSPACE:-$PWD}"
          git -C "$WS" rev-parse --git-dir >/dev/null 2>&1 || block "git does not open the workspace as a trusted repository, so its config cannot be checked"
          CONFIG=$(git -C "$WS" config --list 2>/dev/null) || block "git config cannot be read"
          for CONFIG_FILE in "$RK_REAL_HOME/.gitconfig" "$RK_REAL_HOME/.config/git/config" "$RK_AGENT_HOME/.gitconfig" "$RK_AGENT_HOME/.config/git/config" ${RK_XDG_CONFIG_HOME:+"$RK_XDG_CONFIG_HOME/git/config"}; do
            [ -e "$CONFIG_FILE" ] || continue
            MORE=$(git config --includes --file "$CONFIG_FILE" --list 2>/dev/null) || block "the git config file $CONFIG_FILE cannot be read"
            CONFIG=$(printf '%s\n%s' "$CONFIG" "$MORE")
          done
          if printf '%s\n' "$CONFIG" | grep -qiE '^http\..*\.extraheader='; then
            block "git config sets an http extraheader entry"
          fi
          CREDENTIAL_URLS=$(printf '%s\n' "$CONFIG" | grep -iE '^remote\.[^=]*\.(push)?url=[a-z][a-z0-9+.-]*://[^/@]*@' | grep -viE '^remote\.[^=]*\.(push)?url=https://x-access-token@[^/@:]+/' || true)
          if [ -n "$CREDENTIAL_URLS" ]; then
            block "a git remote URL holds a credential"
          fi
          if printf '%s\n' "$CONFIG" | grep -qF 'x-access-token:'; then
            block "a git config value holds an access token"
          fi
          if printf 'protocol=https\nhost=example.invalid\n\n' | GIT_TERMINAL_PROMPT=0 GIT_ASKPASS= SSH_ASKPASS= git -C "$WS" credential fill 2>/dev/null | grep -q '^password='; then
            block "git offers a credential to a host other than the GitHub server"
          fi
          STORES=(
            "$RK_REAL_HOME/.git-credentials"
            "$RK_REAL_HOME/.config/git/credentials"
            "$RK_AGENT_HOME/.git-credentials"
            "$RK_AGENT_HOME/.config/git/credentials"
            "${HOME:-/nonexistent}/.git-credentials"
            "${XDG_CONFIG_HOME:-${HOME:-/nonexistent}/.config}/git/credentials"
          )
          if [ -n "$RK_XDG_CONFIG_HOME" ]; then
            STORES+=("$RK_XDG_CONFIG_HOME/git/credentials")
          fi
          TOKEN_SEEN=0
          for TOKEN in "${GH_TOKEN:-}" "${GITHUB_TOKEN:-}"; do
            [ -n "$TOKEN" ] || continue
            TOKEN_SEEN=1
            AUTH_B64=$(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')
            if printf '%s\n' "$CONFIG" | grep -qF -e "$TOKEN" -e "$AUTH_B64"; then
              block "a git config value holds the job token"
            fi
            LEAKED=""
            while IFS= read -r FILE; do
              [ -n "$FILE" ] || continue
              if [ "$AFTER_ACTION" = 1 ] && action_token_output_only "$FILE" "$TOKEN" "$AUTH_B64"; then
                continue
              fi
              LEAKED="$LEAKED $FILE"
            done < <(grep -rlF -e "$TOKEN" -e "$AUTH_B64" "${RUNNER_TEMP:-/nonexistent}" "${STORES[@]}" 2>/dev/null)
            if [ -n "$LEAKED" ]; then
              block "a file under RUNNER_TEMP or a git credential store holds the job token:$LEAKED"
            fi
          done
          if [ "$TOKEN_SEEN" != 1 ]; then
            block "GH_TOKEN and GITHUB_TOKEN are both empty, so the job token scan cannot run"
          fi
          exit 0
          GUARD_EOF
          } > "$GUARD_FILE"
          chmod 400 "$GUARD_FILE"
          GUARD_OID=$(git hash-object "$GUARD_FILE")
          echo "guard_oid=$GUARD_OID" >> "$GITHUB_OUTPUT"

          BASE_REF=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json baseRefName -q .baseRefName)
          git fetch --quiet origin "+refs/pull/${PR_NUMBER}/head:refs/rk-claude/pr-head"
          git fetch --quiet origin "+refs/heads/${BASE_REF}:refs/rk-claude/pr-base"
          git checkout --quiet --detach refs/rk-claude/pr-head
          echo "base_sha=$(git merge-base refs/rk-claude/pr-base refs/rk-claude/pr-head)" >> "$GITHUB_OUTPUT"
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

          cat > "$SETTINGS_FILE" <<EOF
          {
            "claudeMdExcludes": [
              "${GITHUB_WORKSPACE}/CLAUDE.md",
              "${GITHUB_WORKSPACE}/CLAUDE.local.md",
              "${GITHUB_WORKSPACE}/AGENTS.md",
              "${GITHUB_WORKSPACE}/.claude/CLAUDE.md",
              "${GITHUB_WORKSPACE}/.claude/rules/**",
              "${GITHUB_WORKSPACE}/**/CLAUDE.md",
              "${GITHUB_WORKSPACE}/**/CLAUDE.local.md",
              "${GITHUB_WORKSPACE}/**/AGENTS.md",
              "${GITHUB_WORKSPACE}/**/.claude/CLAUDE.md",
              "${GITHUB_WORKSPACE}/**/.claude/rules/**"
            ],
            "hooks": {
              "PreToolUse": [
                {
                  "matcher": "*",
                  "hooks": [
                    { "type": "command", "command": "git hash-object ${GUARD_FILE} | grep -qx ${GUARD_OID} || { echo 'Credential guard: the guard script changed, so stop the review and report that this run is unsafe.' >&2; exit 2; }; bash ${GUARD_FILE} || exit 2" }
                  ]
                }
              ]
            }
          }
          EOF
          if [ -n "$TEMP_AGENT_HOME" ] || [ "${HOME_PARENT_DENY:-}" = "true" ]; then
            WS_RESOLVED=$(cd -P "$GITHUB_WORKSPACE" && pwd -P) || { echo "::error::The workspace cannot be resolved."; exit 1; }
            DENY_LIST=$(mktemp)
            add_deny() {
              case "$1" in
                *$'\n'*|*$'\r'*) echo "::error::The protected path $1 holds a line break."; exit 1 ;;
              esac
              for w in "$GITHUB_WORKSPACE" "$WS_RESOLVED"; do
                case "$w/" in
                  "${1%/}"/*)
                    echo "::error::The protected path $1 contains the workspace $w, so denying writes to it would break the review."
                    exit 1
                    ;;
                esac
              done
              printf '%s\n' "$1" >> "$DENY_LIST"
            }
            require_deny() {
              if [ ! -e "$1" ] || [ -L "$1" ]; then
                echo "::error::Review refused: the protected path $1 is missing or a symlink, so the sandbox cannot protect it."
                exit 1
              fi
              add_deny "$1"
            }
            optional_deny() {
              if [ -e "$1" ] || [ -L "$1" ]; then
                add_deny "$1"
              fi
            }
            if [ -n "$HOME_PARENT" ]; then
              require_deny "$HOME_PARENT"
            fi
            require_deny "$RUNNER_TEMP"
            for p in .bashrc .bash_profile .bash_login .bash_logout .profile .zshrc .zshenv .zprofile .zlogin .zlogout .bunfig.toml .npmrc .yarnrc .yarnrc.yml .netrc .gitconfig .git-credentials .config .pip .local/bin .bun .ssh .claude .claude.json; do
              optional_deny "${REAL_HOME%/}/$p"
            done
            if [ -n "$TEMP_AGENT_HOME" ]; then
              for p in .bashrc .bash_profile .bash_login .bash_logout .profile .zshrc .zshenv .zprofile .zlogin .zlogout .bunfig.toml .npmrc .yarnrc .yarnrc.yml .netrc .gitconfig .config/git .config/pip .config/gh .pip .local/bin .bun .ssh .claude .claude.json; do
                require_deny "${TEMP_AGENT_HOME%/}/$p"
              done
            fi
            if [ -n "${RUNNER_TOOL_CACHE:-}" ]; then
              if [ ! -e "$RUNNER_TOOL_CACHE" ] && [ ! -L "$RUNNER_TOOL_CACHE" ] && mkdir -p "$RUNNER_TOOL_CACHE" 2>/dev/null; then
                echo "Created the tool cache $RUNNER_TOOL_CACHE, so the settings can deny sandboxed writes to it. It stays on the host."
              fi
              optional_deny "$RUNNER_TOOL_CACHE"
            fi
            WORK_DIR=$(dirname "$RUNNER_TEMP")
            RUNNER_ROOT=$(dirname "$WORK_DIR")
            if [ -f "$RUNNER_ROOT/.runner" ]; then
              for p in bin externals .runner .credentials .credentials_rsaparams .env .path config.sh run.sh run-helper.sh svc.sh safe_sleep.sh; do
                optional_deny "$RUNNER_ROOT/$p"
              done
              for e in "$WORK_DIR"/* "$WORK_DIR"/.[!.]*; do
                if [ ! -e "$e" ] && [ ! -L "$e" ]; then
                  continue
                fi
                if [ "$e" = "${RUNNER_TEMP%/}" ] || grep -qxF "$e" "$DENY_LIST"; then
                  continue
                fi
                E_RESOLVED=$(cd -P "$e" 2>/dev/null && pwd -P) || E_RESOLVED="$e"
                HOLDS_WS=false
                for w in "$GITHUB_WORKSPACE" "$WS_RESOLVED"; do
                  for c in "${e%/}" "${E_RESOLVED%/}"; do
                    case "$w/" in
                      "$c"/*) HOLDS_WS=true ;;
                    esac
                  done
                done
                if [ "$HOLDS_WS" = true ]; then
                  continue
                fi
                add_deny "$e"
              done
            else
              echo "::notice::No .runner file at $RUNNER_ROOT, so the runner installation files are not listed. The sandbox default write policy still applies."
            fi
            echo "Sandboxed commands cannot write to:"
            cat "$DENY_LIST"
            if command -v jq >/dev/null 2>&1; then
              jq --rawfile deny "$DENY_LIST" '.sandbox.filesystem.denyWrite = ($deny | split("\n") | map(select(length > 0)))' "$SETTINGS_FILE" > "$SETTINGS_FILE.new"
            elif command -v python3 >/dev/null 2>&1; then
              python3 -I - "$SETTINGS_FILE" "$DENY_LIST" > "$SETTINGS_FILE.new" << 'PY'
          import json, sys
          with open(sys.argv[1]) as handle:
              data = json.load(handle)
          with open(sys.argv[2]) as handle:
              deny = [line for line in handle.read().split("\n") if line]
          data.setdefault("sandbox", {}).setdefault("filesystem", {})["denyWrite"] = deny
          json.dump(data, sys.stdout, indent=2)
          sys.stdout.write("\n")
          PY
            else
              echo "::error::Review refused: jq or python3 is required to write the sandbox protection entries."
              exit 1
            fi || { echo "::error::Review refused: the sandbox protection entries could not be written."; exit 1; }
            mv "$SETTINGS_FILE.new" "$SETTINGS_FILE"
            rm -f "$DENY_LIST"
          fi
          chmod 400 "$SETTINGS_FILE"
          echo "settings_oid=$(git hash-object "$SETTINGS_FILE")" >> "$GITHUB_OUTPUT"

      - name: Set up Go (gofmt only)
        if: inputs.go_version != ''
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go_version }}

      - name: Record PR head sha before Claude runs
        if: inputs.mode == 'implement'
        id: pre_claude
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          SHA=""
          KIND=local
          if [ -n "$PR_NUMBER" ]; then
            SHA=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json headRefOid -q .headRefOid 2>/dev/null || echo "")
          fi
          if [ -n "$SHA" ]; then
            KIND=pr
          else
            SHA=$(git rev-parse HEAD)
          fi
          echo "head_sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "baseline_kind=$KIND" >> "$GITHUB_OUTPUT"

      - name: Compose Claude prompt
        id: compose_prompt
        env:
          MODEL_ID: ${{ steps.resolve.outputs.model_id }}
          EFFORT: ${{ steps.resolve.outputs.effort }}
          MODE: ${{ inputs.mode }}
          FLOW: ${{ inputs.flow }}
          EXTRA_ALLOWED: ${{ inputs.extra_allowed_tools }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          HEAD_SHA: ${{ steps.pr_context.outputs.head_sha }}
          BASE_SHA: ${{ steps.pr_context.outputs.base_sha }}
          SETTINGS_FILE: ${{ runner.temp }}/claude-review-settings.json
          GH_TOKEN: ${{ github.token }}
          COMMAND_POLICY: ${{ steps.runtime_sources.outputs.command_policy }}
          POLICY_SETTINGS: ${{ steps.command_policy.outputs.settings_file }}
          POLICY_WORKSPACE: ${{ github.workspace }}
        run: |
          PROMPTS_DIR="$RUNNER_TEMP/rk-shared/prompts"
          if [ -n "$FLOW" ]; then
            PROMPT_FILE=$PROMPTS_DIR/sync-docs-release.md
            case "$FLOW" in
              create-release)
                ALLOWED='Read,Glob,Grep,Bash(git status*),Bash(git log*),Bash(git tag --sort*),Bash(git fetch*),Bash(git rev-parse*),Bash(gh auth status),Bash(gh release create*),Bash(gh release view*)'
                ;;
              *)
                ALLOWED='Read,Edit,Write,Glob,Grep,Bash(wc *),Bash(ls *),Bash(git status*),Bash(git log*),Bash(git diff*),Bash(git show*),Bash(git fetch*),Bash(git tag --sort*),Bash(git branch*),Bash(git rev-parse*),Bash(git checkout -b docs-sync/*),Bash(git checkout -b docs-release/*),Bash(git add*),Bash(git commit*),Bash(git push origin docs-sync/*),Bash(git push origin docs-release/*),Bash(gh pr create*),Bash(gh pr view*),Bash(gh issue view*)'
                ;;
            esac
          elif [ "$MODE" = "implement" ]; then
            PROMPT_FILE=$PROMPTS_DIR/issue-workflow.md
            ALLOWED='Bash(git *),Bash(gh *),Read,Edit,Write,Glob,Grep,Skill,EnterWorktree'
          elif [ "$MODE" = "fix-pr" ] || [ "$MODE" = "fix-pr-review" ]; then
            PROMPT_FILE=$PROMPTS_DIR/fix-pr.md
            ALLOWED='Bash(wc *),Bash(ls *),Bash(git status*),Bash(git log*),Bash(git diff*),Bash(git show*),Bash(git fetch*),Bash(git merge origin/*),Bash(git branch*),Bash(git rev-parse*),Bash(git checkout*),Bash(git switch*),Bash(git add*),Bash(git commit*),Bash(git push origin HEAD),Bash(gh pr checkout*),Bash(gh pr view*),Bash(gh pr diff*),Bash(gh pr comment*),Bash(gh issue view*),Bash(gh issue list*),Bash(gh issue create*),Bash(gh api graphql*),Read,Edit,Write,Glob,Grep'
          else
            PROMPT_FILE=$PROMPTS_DIR/pr-review-format.md
            ALLOWED='Bash(git status*),Bash(git log*),Bash(git diff*),Bash(git show*),Bash(git fetch origin),Bash(git fetch origin *),Bash(git branch*),Bash(git rev-parse*),Bash(gh pr view*),Bash(gh pr diff*),Bash(gh pr comment*),Bash(gh issue view*)'
          fi

          if [ -n "$EXTRA_ALLOWED" ]; then
            if printf '%s' "$EXTRA_ALLOWED" | grep -q '["`$]'; then
              echo "::error::extra_allowed_tools must not contain double quotes, backticks, or dollar signs (claude_args is shell-evaluated)."
              exit 1
            fi
            if [ "$FLOW" = "create-release" ]; then
              echo "::notice::extra_allowed_tools is ignored in the create-release flow (hard-locked allowlist)."
            else
              ALLOWED="$ALLOWED,$EXTRA_ALLOWED"
            fi
          fi

          flatten() { tr '\n' ' ' | sed -e 's/[[:space:]]\{2,\}/ /g' -e 's/^ *//' -e 's/ *$//'; }
          TRUSTED_REF=""
          if git fetch --quiet --depth 1 origin "refs/heads/$DEFAULT_BRANCH" 2>/dev/null; then
            TRUSTED_REF=FETCH_HEAD
          else
            echo "::warning::Could not fetch the default branch — repo prompt overrides are skipped this run."
          fi
          PROMPT_NAME=$(basename "$PROMPT_FILE")
          REPLACEMENT_PATH=".github/prompts/$PROMPT_NAME"
          LOCAL_PATH=".github/prompts/$(basename "$PROMPT_FILE" .md)-local.md"
          LEGACY_REPLACEMENT_PATH=""
          LEGACY_LOCAL_PATH=""
          if [ "$MODE" = "fix-pr-review" ]; then
            LEGACY_REPLACEMENT_PATH=".github/prompts/fix-pr-review.md"
            LEGACY_LOCAL_PATH=".github/prompts/fix-pr-review-local.md"
          fi
          if [ -n "$TRUSTED_REF" ] && git cat-file -e "$TRUSTED_REF:$REPLACEMENT_PATH" 2>/dev/null; then
            PROMPT=$(git show "$TRUSTED_REF:$REPLACEMENT_PATH" | flatten)
          elif [ -n "$TRUSTED_REF" ] && [ -n "$LEGACY_REPLACEMENT_PATH" ] && git cat-file -e "$TRUSTED_REF:$LEGACY_REPLACEMENT_PATH" 2>/dev/null; then
            PROMPT=$(git show "$TRUSTED_REF:$LEGACY_REPLACEMENT_PATH" | flatten)
          else
            PROMPT=$(flatten < "$PROMPT_FILE")
          fi
          if [ -n "$TRUSTED_REF" ] && git cat-file -e "$TRUSTED_REF:$LOCAL_PATH" 2>/dev/null; then
            PROMPT="$PROMPT $(git show "$TRUSTED_REF:$LOCAL_PATH" | flatten)"
          elif [ -n "$TRUSTED_REF" ] && [ -n "$LEGACY_LOCAL_PATH" ] && git cat-file -e "$TRUSTED_REF:$LEGACY_LOCAL_PATH" 2>/dev/null; then
            PROMPT="$PROMPT $(git show "$TRUSTED_REF:$LEGACY_LOCAL_PATH" | flatten)"
          fi
          if printf '%s' "$PROMPT" | grep -q '["`$]'; then
            echo "::error::The prompt for this route ($PROMPT_NAME, including any $REPLACEMENT_PATH / $LOCAL_PATH override) must not contain double quotes, backticks, or dollar signs (claude_args is shell-evaluated)."
            exit 1
          fi
          PROMPT="$PROMPT The harness identifier for LLM attribution footers in this run is ${CLAUDE_HARNESS}."
          if [ -n "$FLOW" ]; then
            PROMPT="$PROMPT The requested operation mode for this run is ${FLOW}."
          fi
          if [ "$MODE" = "review" ]; then
            PROMPT="$PROMPT The pull request head is checked out in this workspace already, as a detached HEAD at commit ${HEAD_SHA}. Its merge base with the target branch is ${BASE_SHA}."
          fi
          ARGS="--model ${MODEL_ID} --effort ${EFFORT} --append-system-prompt \"${PROMPT}\" --allowedTools \"${ALLOWED}\""
          if [ "$MODE" = "review" ]; then
            ARGS="$ARGS --disallowedTools \"Edit,Write,NotebookEdit,WebFetch,WebSearch,Skill,Agent,Task,Read(//proc/**),Bash(git *--output*),Bash(git diff*--no-index*),Bash(git fetch*--upload-pack*),Bash(gh pr comment*--body-file*),Bash(gh pr comment* -F*)\" --setting-sources user --settings ${SETTINGS_FILE}"
          fi
          POLICY_SUFFIX=""
          if [ "$MODE" != "review" ] && [ "$COMMAND_POLICY" = "true" ]; then
            for value in "$POLICY_SETTINGS" "$POLICY_WORKSPACE"; do
              case "$value" in
                ''|*'"'*|*'`'*|*'$'*|*'\'*|*$'\n'*|*$'\r'*)
                  echo "::error::Command policy refused: the staged settings file or the workspace path is empty or holds a double quote, backtick, dollar sign, backslash, or line break, so the launch cannot load the policy."
                  exit 1
                  ;;
              esac
            done
            POLICY_SUFFIX=" --setting-sources user --settings \"${POLICY_SETTINGS}\" --add-dir \"${POLICY_WORKSPACE}\""
            ARGS="$ARGS$POLICY_SUFFIX"
          fi
          GUIDE_ARGS="--model ${MODEL_ID} --effort ${EFFORT} --permission-mode default --allowedTools \"Bash(git status*),Bash(git log*),Bash(git diff*),Bash(git show*),Bash(git add*),Bash(git commit*),Bash(git push origin HEAD),Edit,Read,Grep,Glob,Write\"$POLICY_SUFFIX"
          {
            printf 'claude_args<<CLAUDE_ARGS_EOF\n'
            printf '%s\n' "$ARGS"
            printf 'CLAUDE_ARGS_EOF\n'
            printf 'guide_claude_args<<CLAUDE_ARGS_EOF\n'
            printf '%s\n' "$GUIDE_ARGS"
            printf 'CLAUDE_ARGS_EOF\n'
          } >> "$GITHUB_OUTPUT"

      - name: Confirm no job credential persists on disk before Claude runs
        if: inputs.mode == 'review'
        env:
          GH_TOKEN: ${{ github.token }}
          REAL_HOME: ${{ steps.review_contract.outputs.real_home }}
          AGENT_HOME: ${{ steps.agent_home.outputs.path }}
        run: |
          if [ -z "$REAL_HOME" ] || [ -z "$AGENT_HOME" ]; then
            echo "::error::The run contract has no job home or agent home, so the credential check cannot cover them."
            exit 1
          fi
          echo "Git config keys, each with the file that sets it:"
          git config --list --show-origin --name-only
          echo "RUNNER_TEMP contents:"
          ls -la "$RUNNER_TEMP"
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::The job token is empty, so the credential check cannot run."
            exit 1
          fi
          AUTH_B64=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          echo "::add-mask::$AUTH_B64"
          FOUND=0
          if git config --list --name-only | grep -qiE '^http\..*\.extraheader$'; then
            echo "::error::Git config sets an http extraheader entry."
            FOUND=1
          fi
          if git config --list | grep -qF -e "$GH_TOKEN" -e "$AUTH_B64"; then
            echo "::error::A git config value holds the job token."
            FOUND=1
          fi
          for CONFIG_FILE in "$REAL_HOME/.gitconfig" "$REAL_HOME/.config/git/config" "$AGENT_HOME/.gitconfig" "$AGENT_HOME/.config/git/config" ${XDG_CONFIG_HOME:+"$XDG_CONFIG_HOME/git/config"}; do
            [ -e "$CONFIG_FILE" ] || continue
            if ! MORE=$(git config --includes --file "$CONFIG_FILE" --list 2>/dev/null); then
              echo "::error::The git config file $CONFIG_FILE cannot be read."
              FOUND=1
              continue
            fi
            if printf '%s\n' "$MORE" | grep -qiE '^http\..*\.extraheader='; then
              echo "::error::The git config file $CONFIG_FILE sets an http extraheader entry."
              FOUND=1
            fi
            if printf '%s\n' "$MORE" | grep -qF -e "$GH_TOKEN" -e "$AUTH_B64"; then
              echo "::error::The git config file $CONFIG_FILE holds the job token."
              FOUND=1
            fi
          done
          LEAKED=$(grep -rlF -e "$GH_TOKEN" -e "$AUTH_B64" "$RUNNER_TEMP" "$REAL_HOME/.git-credentials" "$REAL_HOME/.config/git/credentials" "$AGENT_HOME/.git-credentials" "$AGENT_HOME/.config/git/credentials" "$HOME/.git-credentials" "${XDG_CONFIG_HOME:-$HOME/.config}/git/credentials" 2>/dev/null || true)
          if [ -n "$LEAKED" ]; then
            echo "::error::Files under RUNNER_TEMP or in a git credential store hold the job token: $(printf '%s' "$LEAKED" | tr '\n' ' ')"
            FOUND=1
          fi
          if [ "$FOUND" -ne 0 ]; then
            echo "::error::A job credential persists on disk, so Claude does not start."
            exit 1
          fi

      - name: Check the staged command policy before Claude runs
        id: policy_before_main
        if: steps.runtime_sources.outputs.command_policy == 'true'
        shell: /bin/bash --noprofile --norc -e -o pipefail {0}
        env:
          PHASE: before-main
          POLICY_ARGS: ${{ steps.compose_prompt.outputs.claude_args }}
          POLICY_CALLS_BEFORE: ''
          EXECUTION_FILE: ''
          POLICY_DIR: ${{ steps.command_policy.outputs.dir }}
          POLICY_CHECKER: ${{ steps.command_policy.outputs.checker }}
          POLICY_CHECKER_OID: ${{ steps.command_policy.outputs.checker_oid }}
          POLICY_SETTINGS: ${{ steps.command_policy.outputs.settings_file }}
          POLICY_SETTINGS_OID: ${{ steps.command_policy.outputs.settings_oid }}
          POLICY_INTERPRETER: ${{ steps.command_policy.outputs.interpreter }}
          POLICY_INTERPRETER_REAL: ${{ steps.command_policy.outputs.interpreter_real }}
          POLICY_INTERPRETER_OID: ${{ steps.command_policy.outputs.interpreter_oid }}
          POLICY_CALL_RECORD: ${{ steps.command_policy.outputs.call_record }}
          POLICY_USER_SETTINGS: ${{ steps.command_policy.outputs.user_settings }}
          POLICY_USER_SETTINGS_DIGEST: ${{ steps.command_policy.outputs.user_settings_digest }}
          POLICY_USER_SETTINGS_KEYS: ${{ steps.command_policy.outputs.user_settings_keys }}
          POLICY_USER_SETTINGS_BASE: ${{ steps.command_policy.outputs.user_settings_base }}
          POLICY_USER_SETTINGS_ALLOWED: ${{ steps.command_policy.outputs.user_settings_allowed }}
          POLICY_WORKSPACE: ${{ github.workspace }}
          POLICY_MANAGED_DIRS: '/etc/claude-code:/Library/Application Support/ClaudeCode'
          BASH_ENV: ''
          ENV: ''
          LD_PRELOAD: ''
          LD_LIBRARY_PATH: ''
        run: |
          PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          export PATH
          while IFS= read -r name; do
            unset "$name"
          done < <(compgen -e | grep -E '^(GIT_|PYTHON)' || true)
          fail() {
            echo "::error::Command policy check ($PHASE): $1"
            exit 1
          }
          case "$PHASE" in
            before-main|after-main|before-guide|after-guide) ;;
            *) fail "the phase is not known." ;;
          esac
          for name in POLICY_DIR POLICY_CHECKER POLICY_CHECKER_OID POLICY_SETTINGS POLICY_SETTINGS_OID POLICY_INTERPRETER POLICY_INTERPRETER_REAL POLICY_INTERPRETER_OID POLICY_CALL_RECORD POLICY_USER_SETTINGS POLICY_USER_SETTINGS_DIGEST POLICY_USER_SETTINGS_KEYS POLICY_USER_SETTINGS_BASE POLICY_USER_SETTINGS_ALLOWED POLICY_WORKSPACE; do
            if [ -z "${!name:-}" ]; then
              fail "$name is empty, so the staged policy cannot be checked."
            fi
          done
          D="$POLICY_DIR"
          if [ "$POLICY_CHECKER" != "$D/command_policy.py" ] || [ "$POLICY_SETTINGS" != "$D/settings.json" ] || [ "$POLICY_CALL_RECORD" != "$D/hook-calls.log" ]; then
            fail "the recorded policy file paths are not inside the staged directory $D."
          fi
          if [ -L "$D" ] || [ ! -d "$D" ] || [ ! -O "$D" ]; then
            fail "the staged directory $D is missing, a symlink, or not a directory of this user."
          fi
          if [ -z "$(find "$D" -maxdepth 0 -perm 0500 -print)" ]; then
            fail "the staged directory $D does not have mode 0500."
          fi
          NAMES=$(cd "$D" && ls -A | LC_ALL=C sort | tr '\n' ' ')
          if [ "$NAMES" != "command_policy.py hook-calls.log settings.json " ]; then
            fail "the staged directory $D holds an unexpected set of entries: $NAMES"
          fi
          check_file() {
            if [ -L "$2" ] || [ ! -f "$2" ] || [ ! -O "$2" ]; then
              fail "$1 $2 is missing, a symlink, or not a regular file of this user."
            fi
            if [ -z "$(find "$2" -maxdepth 0 -perm "$4" -print)" ]; then
              fail "$1 $2 does not have mode $4."
            fi
            if [ -n "$3" ] && [ "$(git -C / hash-object --no-filters "$2" 2>/dev/null)" != "$3" ]; then
              fail "$1 $2 changed since the policy was staged."
            fi
          }
          check_file "The staged checker" "$POLICY_CHECKER" "$POLICY_CHECKER_OID" 0400
          check_file "The policy settings file" "$POLICY_SETTINGS" "$POLICY_SETTINGS_OID" 0400
          check_file "The hook call record" "$POLICY_CALL_RECORD" "" 0600
          if [ -L "$POLICY_INTERPRETER_REAL" ] || [ ! -f "$POLICY_INTERPRETER_REAL" ] || [ "$(git -C / hash-object --no-filters "$POLICY_INTERPRETER_REAL" 2>/dev/null)" != "$POLICY_INTERPRETER_OID" ]; then
            fail "the hook interpreter $POLICY_INTERPRETER_REAL is missing or changed since the policy was staged."
          fi
          if [ ! -f "$POLICY_INTERPRETER" ] || [ ! -x "$POLICY_INTERPRETER" ]; then
            fail "the hook interpreter path $POLICY_INTERPRETER is missing or not executable."
          fi
          RESOLVED=$("$POLICY_INTERPRETER_REAL" -I -c 'import os, sys; print(os.path.realpath(sys.argv[1]))' "$POLICY_INTERPRETER") || fail "the hook interpreter does not run."
          if [ "$RESOLVED" != "$POLICY_INTERPRETER_REAL" ]; then
            fail "the hook interpreter path $POLICY_INTERPRETER now resolves to $RESOLVED, which differs from the recorded $POLICY_INTERPRETER_REAL."
          fi
          if ! PROBLEMS=$("$POLICY_INTERPRETER_REAL" -I - "$POLICY_USER_SETTINGS" "$POLICY_USER_SETTINGS_DIGEST" "$POLICY_USER_SETTINGS_KEYS" "$PHASE" "${POLICY_MANAGED_DIRS:-}" "$POLICY_USER_SETTINGS_BASE" "$POLICY_USER_SETTINGS_ALLOWED" << 'PY'
          import hashlib, json, os, sys
          path, digest, baseline, phase, managed, base_text, allowed_text = sys.argv[1:8]
          CONTROLLED = ("enableAllProjectMcpServers", "enabledPlugins", "extraKnownMarketplaces")
          MISSING = object()
          problems = []
          def canon(value):
              return json.dumps(value, sort_keys=True, separators=(",", ":"), ensure_ascii=True)
          def load(name):
              with open(name, "rb") as handle:
                  raw = handle.read()
              if not raw.strip():
                  return {}
              data = json.loads(raw)
              if not isinstance(data, dict):
                  raise ValueError("the top level is not an object")
              return data
          try:
              data = load(path) if os.path.lexists(path) else {}
          except (OSError, ValueError) as error:
              print("the user settings file %s cannot be read as a JSON object (%s)." % (path, error))
              sys.exit(1)
          kept = {key: value for key, value in data.items() if key not in CONTROLLED}
          if hashlib.sha256(canon(kept).encode()).hexdigest() != digest:
              try:
                  before = json.loads(baseline)
              except ValueError:
                  before = {}
              now = {key: hashlib.sha256(canon(value).encode()).hexdigest() for key, value in kept.items()}
              changed = sorted(key for key in set(before) | set(now) if before.get(key) != now.get(key))
              problems.append("the user settings file %s changed since the policy was staged; changed top-level keys: %s." % (path, ", ".join(changed) if changed else "none named"))
          try:
              base = json.loads(base_text)
              allowed = json.loads(allowed_text)
          except ValueError:
              problems.append("the recorded user settings baseline or the expected plugin settings cannot be read.")
              base, allowed = {}, {}
          if not isinstance(base, dict) or not isinstance(allowed, dict):
              problems.append("the recorded user settings baseline or the expected plugin settings are not JSON objects.")
              base, allowed = {}, {}
          stages = {"before-main": [], "after-main": ["main"], "before-guide": ["main"], "after-guide": ["main", "guide"]}.get(phase, [])
          markets = {}
          plugins = set()
          for stage in stages:
              expected = allowed.get(stage) if isinstance(allowed.get(stage), dict) else {}
              for name, paths in (expected.get("extraKnownMarketplaces") or {}).items():
                  markets.setdefault(name, set()).update(paths)
              plugins.update(expected.get("enabledPlugins") or [])
          value = data.get("enableAllProjectMcpServers", MISSING)
          if value != base.get("enableAllProjectMcpServers", MISSING) and not (stages and value is True):
              problems.append("the user settings key enableAllProjectMcpServers holds a value that this job does not write.")
          def entries(source, key):
              value = source.get(key, {})
              if not isinstance(value, dict):
                  if source is data:
                      problems.append("the user settings key %s is not a JSON object." % key)
                  return {}
              return value
          base_plugins = entries(base, "enabledPlugins")
          for name, value in entries(data, "enabledPlugins").items():
              if (name in base_plugins and base_plugins[name] == value) or (name in plugins and value is True):
                  continue
              problems.append("the user settings key enabledPlugins holds the entry %s, which this job does not install at this point." % json.dumps(name))
          base_markets = entries(base, "extraKnownMarketplaces")
          for name, value in entries(data, "extraKnownMarketplaces").items():
              if name in base_markets and base_markets[name] == value:
                  continue
              if name in markets and any(value == {"source": {"source": "directory", "path": item}} for item in markets[name]):
                  continue
              problems.append("the user settings key extraKnownMarketplaces holds the entry %s, which is not a plugin marketplace that this job stages at this point." % json.dumps(name))
          if phase.startswith("before"):
              if data.get("disableAllHooks") is True:
                  problems.append("the user settings file %s sets disableAllHooks to true." % path)
              for base in [item for item in managed.split(":") if item]:
                  files = []
                  single = os.path.join(base, "managed-settings.json")
                  if os.path.lexists(single):
                      files.append(single)
                  dropins = os.path.join(base, "managed-settings.d")
                  if os.path.lexists(dropins):
                      try:
                          names = sorted(name for name in os.listdir(dropins) if name.endswith(".json") and not name.startswith("."))
                      except OSError as error:
                          problems.append("the managed settings directory %s cannot be read (%s)." % (dropins, error))
                          names = []
                      files.extend(os.path.join(dropins, name) for name in names)
                  for name in files:
                      try:
                          managed_data = load(name)
                      except (OSError, ValueError) as error:
                          problems.append("the managed settings file %s cannot be read as a JSON object (%s)." % (name, error))
                          continue
                      for key in ("disableAllHooks", "allowManagedHooksOnly"):
                          if managed_data.get(key) is True:
                              problems.append("the managed settings file %s sets %s to true, so the policy hook would not run." % (name, key))
          for problem in problems:
              print(problem)
          sys.exit(1 if problems else 0)
          PY
          ); then
            while IFS= read -r line; do
              [ -n "$line" ] && echo "::error::Command policy check ($PHASE): $line"
            done <<< "$PROBLEMS"
            fail "the user or managed settings do not keep the policy hook in force."
          fi
          LINES=$(wc -l < "$POLICY_CALL_RECORD" | tr -d ' ')
          case "$PHASE" in
            before-*)
              SUFFIX=" --setting-sources user --settings \"$POLICY_SETTINGS\" --add-dir \"$POLICY_WORKSPACE\""
              case "${POLICY_ARGS:-}" in
                *"$SUFFIX") ;;
                *) fail "the launch arguments do not end with the policy settings flags, so the launch would not load the staged policy." ;;
              esac
              echo "call_lines=$LINES" >> "$GITHUB_OUTPUT"
              ;;
            after-*)
              case "${POLICY_CALLS_BEFORE:-}" in
                ''|*[!0-9]*) fail "the call record line count from before the launch is missing." ;;
              esac
              if [ -z "${EXECUTION_FILE:-}" ] || [ ! -f "$EXECUTION_FILE" ]; then
                echo "::notice::Command policy check ($PHASE): the execution file is missing, so the check that the hook ran for each Bash call is skipped."
              else
                BASH_OK=$("$POLICY_INTERPRETER_REAL" -I - "$EXECUTION_FILE" << 'PY'
          import json, sys
          with open(sys.argv[1]) as handle:
              data = json.load(handle)
          records = []
          for item in data if isinstance(data, list) else [data]:
              records.extend(item if isinstance(item, list) else [item])
          def blocks(record, kind):
              if not isinstance(record, dict) or record.get("type") != kind:
                  return []
              message = record.get("message")
              content = message.get("content") if isinstance(message, dict) else None
              return [block for block in content if isinstance(block, dict)] if isinstance(content, list) else []
          bash_ids = {block.get("id") for record in records for block in blocks(record, "assistant") if block.get("type") == "tool_use" and block.get("name") == "Bash"}
          print(sum(1 for record in records for block in blocks(record, "user") if block.get("type") == "tool_result" and block.get("tool_use_id") in bash_ids and not block.get("is_error")))
          PY
                ) || fail "the execution file $EXECUTION_FILE cannot be read."
                if [ "$BASH_OK" -gt 0 ] && [ "$LINES" -le "$POLICY_CALLS_BEFORE" ]; then
                  fail "the policy hook did not run: the launch ran $BASH_OK Bash calls without an error result, and the call record gained no line."
                fi
              fi
              ;;
          esac
          echo "The staged command policy is unchanged ($PHASE)."

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@f3b070c88125d33dbae5653df5f143101d4ea9dc # v1.0.276
        env:
          HOME: ${{ steps.agent_home.outputs.path }}
