name: Claude Code run

on:
  workflow_call:
    inputs:
      mode:
        description: 'review, implement, or fix-pr (fix-pr-review is a deprecated alias for fix-pr)'
        required: true
        type: string
      flow:
        description: 'Docs/release flow: empty, sync-docs, create-release, or sync-release'
        required: false
        type: string
        default: ''
      model_id:
        description: 'Resolved model id for claude_args'
        required: true
        type: string
      effort:
        description: 'Resolved effort level for claude_args'
        required: true
        type: string
      runs_on:
        description: 'Runner label for the job (e.g. self-hosted)'
        required: false
        type: string
        default: 'ubuntu-latest'
      timeout_minutes:
        description: 'Job timeout in minutes (raise for repos whose implement runs exceed the default)'
        required: false
        type: number
        default: 45
      go_version:
        description: 'If non-empty, install this Go version — ONLY for gofmt on edited files; pair with extra_allowed_tools: Bash(gofmt *)'
        required: false
        type: string
        default: ''
      extra_allowed_tools:
        description: 'Comma-separated allowlist entries appended to every route except the hard-locked create-release flow'
        required: false
        type: string
        default: ''
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        description: 'Claude Code OAuth token for agent authentication'
        required: true

jobs:
  run:
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    env:
      CLAUDE_HARNESS: anthropics/claude-code-action@v1
      BOT_LOGIN: ${{ inputs.mode == 'review' && 'github-actions[bot]' || 'claude[bot]' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ inputs.mode == 'review' && '0' || '1' }}

      - name: Checkout rk-skills (shared prompts and scripts)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: richkuo/rk-skills
          ref: main
          path: .rk-skills-shared
          fetch-depth: 1

      - name: Stage shared assets outside the workspace
        run: |
          rm -rf "$RUNNER_TEMP/rk-shared"
          mkdir -p "$RUNNER_TEMP/rk-shared"
          cp -R .rk-skills-shared/templates/claude-workflow/prompts "$RUNNER_TEMP/rk-shared/prompts"
          cp -R .rk-skills-shared/templates/claude-workflow/scripts "$RUNNER_TEMP/rk-shared/scripts"
          rm -rf .rk-skills-shared

      - name: Prune stale worktrees before Claude runs
        run: |
          git worktree list --porcelain | sed -n 's/^worktree //p' | while IFS= read -r wt; do
            case "$wt" in
              "$GITHUB_WORKSPACE"/.claude/worktrees/*)
                git worktree remove --force "$wt" 2>/dev/null || rm -rf "$wt" ;;
            esac
          done
          git worktree prune

      - name: Stage the pull request under review
        if: inputs.mode == 'review'
        id: pr_context
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          SETTINGS_FILE: ${{ runner.temp }}/claude-review-settings.json
        run: |
          BASE_REF=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json baseRefName -q .baseRefName)
          git fetch --quiet origin "+refs/pull/${PR_NUMBER}/head:refs/rk-claude/pr-head"
          git fetch --quiet origin "+refs/heads/${BASE_REF}:refs/rk-claude/pr-base"
          git checkout --quiet --detach refs/rk-claude/pr-head
          echo "base_sha=$(git merge-base refs/rk-claude/pr-base refs/rk-claude/pr-head)" >> "$GITHUB_OUTPUT"
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

          cat > "$SETTINGS_FILE" <<EOF
          {
            "claudeMdExcludes": [
              "${GITHUB_WORKSPACE}/CLAUDE.md",
              "${GITHUB_WORKSPACE}/CLAUDE.local.md",
              "${GITHUB_WORKSPACE}/AGENTS.md",
              "${GITHUB_WORKSPACE}/.claude/CLAUDE.md",
              "${GITHUB_WORKSPACE}/.claude/rules/**",
              "${GITHUB_WORKSPACE}/**/CLAUDE.md",
              "${GITHUB_WORKSPACE}/**/CLAUDE.local.md",
              "${GITHUB_WORKSPACE}/**/AGENTS.md",
              "${GITHUB_WORKSPACE}/**/.claude/CLAUDE.md",
              "${GITHUB_WORKSPACE}/**/.claude/rules/**"
            ]
          }
          EOF

      - name: Set up Go (gofmt only)
        if: inputs.go_version != ''
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go_version }}

      - name: Record PR head sha before Claude runs
        if: inputs.mode == 'implement'
        id: pre_claude
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          SHA=""
          KIND=local
          if [ -n "$PR_NUMBER" ]; then
            SHA=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json headRefOid -q .headRefOid 2>/dev/null || echo "")
          fi
          if [ -n "$SHA" ]; then
            KIND=pr
          else
            SHA=$(git rev-parse HEAD)
          fi
          echo "head_sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "baseline_kind=$KIND" >> "$GITHUB_OUTPUT"

      - name: Compose Claude prompt
        id: compose_prompt
        env:
          MODEL_ID: ${{ inputs.model_id }}
          EFFORT: ${{ inputs.effort }}
          MODE: ${{ inputs.mode }}
          FLOW: ${{ inputs.flow }}
          EXTRA_ALLOWED: ${{ inputs.extra_allowed_tools }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          HEAD_SHA: ${{ steps.pr_context.outputs.head_sha }}
          BASE_SHA: ${{ steps.pr_context.outputs.base_sha }}
          SETTINGS_FILE: ${{ runner.temp }}/claude-review-settings.json
        run: |
          PROMPTS_DIR="$RUNNER_TEMP/rk-shared/prompts"
          if [ -n "$FLOW" ]; then
            PROMPT_FILE=$PROMPTS_DIR/sync-docs-release.md
            case "$FLOW" in
              create-release)
                ALLOWED='Read,Glob,Grep,Bash(git status*),Bash(git log*),Bash(git tag --sort*),Bash(git fetch*),Bash(git rev-parse*),Bash(gh auth status),Bash(gh release create*),Bash(gh release view*)'
                ;;
              *)
                ALLOWED='Read,Edit,Write,Glob,Grep,Bash(wc *),Bash(ls *),Bash(git status*),Bash(git log*),Bash(git diff*),Bash(git show*),Bash(git fetch*),Bash(git tag --sort*),Bash(git branch*),Bash(git rev-parse*),Bash(git checkout -b docs-sync/*),Bash(git checkout -b docs-release/*),Bash(git add*),Bash(git commit*),Bash(git push origin docs-sync/*),Bash(git push origin docs-release/*),Bash(gh pr create*),Bash(gh pr view*),Bash(gh issue view*)'
                ;;
            esac
          elif [ "$MODE" = "implement" ]; then
            PROMPT_FILE=$PROMPTS_DIR/issue-workflow.md
            ALLOWED='Bash(git *),Bash(gh *),Read,Edit,Write,Glob,Grep,Skill,EnterWorktree'
          elif [ "$MODE" = "fix-pr" ] || [ "$MODE" = "fix-pr-review" ]; then
            PROMPT_FILE=$PROMPTS_DIR/fix-pr.md
            ALLOWED='Bash(wc *),Bash(ls *),Bash(git status*),Bash(git log*),Bash(git diff*),Bash(git show*),Bash(git fetch*),Bash(git branch*),Bash(git rev-parse*),Bash(git checkout*),Bash(git switch*),Bash(git add*),Bash(git commit*),Bash(git push origin HEAD),Bash(gh pr checkout*),Bash(gh pr view*),Bash(gh pr diff*),Bash(gh pr comment*),Bash(gh issue view*),Bash(gh issue create*),Bash(gh api graphql*),Read,Edit,Write,Glob,Grep'
          else
            PROMPT_FILE=$PROMPTS_DIR/pr-review-format.md
            ALLOWED='Bash(git status*),Bash(git log*),Bash(git diff*),Bash(git show*),Bash(git fetch*),Bash(git branch*),Bash(git rev-parse*),Bash(gh pr view*),Bash(gh pr diff*),Bash(gh pr comment*),Bash(gh issue view*)'
          fi

          if [ -n "$EXTRA_ALLOWED" ]; then
            if printf '%s' "$EXTRA_ALLOWED" | grep -q '["`$]'; then
              echo "::error::extra_allowed_tools must not contain double quotes, backticks, or dollar signs (claude_args is shell-evaluated)."
              exit 1
            fi
            if [ "$FLOW" = "create-release" ]; then
              echo "::notice::extra_allowed_tools is ignored in the create-release flow (hard-locked allowlist)."
            else
              ALLOWED="$ALLOWED,$EXTRA_ALLOWED"
            fi
          fi

          flatten() { tr '\n' ' ' | sed -e 's/[[:space:]]\{2,\}/ /g' -e 's/^ *//' -e 's/ *$//'; }
          TRUSTED_REF=""
          if git fetch --quiet --depth 1 origin "refs/heads/$DEFAULT_BRANCH" 2>/dev/null; then
            TRUSTED_REF=FETCH_HEAD
          else
            echo "::warning::Could not fetch the default branch — repo prompt overrides are skipped this run."
          fi
          PROMPT_NAME=$(basename "$PROMPT_FILE")
          REPLACEMENT_PATH=".github/prompts/$PROMPT_NAME"
          LOCAL_PATH=".github/prompts/$(basename "$PROMPT_FILE" .md)-local.md"
          LEGACY_REPLACEMENT_PATH=""
          LEGACY_LOCAL_PATH=""
          if [ "$MODE" = "fix-pr-review" ]; then
            LEGACY_REPLACEMENT_PATH=".github/prompts/fix-pr-review.md"
            LEGACY_LOCAL_PATH=".github/prompts/fix-pr-review-local.md"
          fi
          if [ -n "$TRUSTED_REF" ] && git cat-file -e "$TRUSTED_REF:$REPLACEMENT_PATH" 2>/dev/null; then
            PROMPT=$(git show "$TRUSTED_REF:$REPLACEMENT_PATH" | flatten)
          elif [ -n "$TRUSTED_REF" ] && [ -n "$LEGACY_REPLACEMENT_PATH" ] && git cat-file -e "$TRUSTED_REF:$LEGACY_REPLACEMENT_PATH" 2>/dev/null; then
            PROMPT=$(git show "$TRUSTED_REF:$LEGACY_REPLACEMENT_PATH" | flatten)
          else
            PROMPT=$(flatten < "$PROMPT_FILE")
          fi
          if [ -n "$TRUSTED_REF" ] && git cat-file -e "$TRUSTED_REF:$LOCAL_PATH" 2>/dev/null; then
            PROMPT="$PROMPT $(git show "$TRUSTED_REF:$LOCAL_PATH" | flatten)"
          elif [ -n "$TRUSTED_REF" ] && [ -n "$LEGACY_LOCAL_PATH" ] && git cat-file -e "$TRUSTED_REF:$LEGACY_LOCAL_PATH" 2>/dev/null; then
            PROMPT="$PROMPT $(git show "$TRUSTED_REF:$LEGACY_LOCAL_PATH" | flatten)"
          fi
          if printf '%s' "$PROMPT" | grep -q '["`$]'; then
            echo "::error::The prompt for this route ($PROMPT_NAME, including any $REPLACEMENT_PATH / $LOCAL_PATH override) must not contain double quotes, backticks, or dollar signs (claude_args is shell-evaluated)."
            exit 1
          fi
          PROMPT="$PROMPT The harness identifier for LLM attribution footers in this run is ${CLAUDE_HARNESS}."
          if [ -n "$FLOW" ]; then
            PROMPT="$PROMPT The requested operation mode for this run is ${FLOW}."
          fi
          if [ "$MODE" = "review" ]; then
            PROMPT="$PROMPT The pull request head is checked out in this workspace already, as a detached HEAD at commit ${HEAD_SHA}. Its merge base with the target branch is ${BASE_SHA}."
          fi
          ARGS="--model ${MODEL_ID} --effort ${EFFORT} --append-system-prompt \"${PROMPT}\" --allowedTools \"${ALLOWED}\""
          if [ "$MODE" = "review" ]; then
            ARGS="$ARGS --disallowedTools \"Edit,Write,NotebookEdit,WebFetch,WebSearch,Skill,Agent,Task\" --setting-sources user --settings ${SETTINGS_FILE}"
          fi
          {
            printf 'claude_args<<CLAUDE_ARGS_EOF\n'
            printf '%s\n' "$ARGS"
            printf 'CLAUDE_ARGS_EOF\n'
          } >> "$GITHUB_OUTPUT"

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@fa2b2666b747000bf42767d1f332065b375e3c8f # v1.0.214
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          github_token: ${{ inputs.mode == 'review' && github.token || '' }}

          allowed_bots: 'claude'

          show_full_output: true

          plugin_marketplaces: |
            https://github.com/anthropics/claude-code.git
            https://github.com/richkuo/rk-skills.git
          plugins: |
            code-review@claude-code-plugins
            rk-skills@rk-skills

          claude_args: ${{ steps.compose_prompt.outputs.claude_args }}

      - name: Fail if Claude Code returned an error
        if: steps.claude.outcome == 'success'
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            echo "::warning::jq is not installed on this runner — skipping the Claude Code error check."
            exit 0
          fi
          if [ -z "$EXECUTION_FILE" ] || [ ! -f "$EXECUTION_FILE" ]; then
            echo "::error::Claude Code execution output file is missing."
            exit 1
          fi

          RESULT=$(jq -s '
            def records:
              .[] | if type == "array" then .[] else . end;
            [records | select(type == "object" and .type == "result")] | last // {}
          ' "$EXECUTION_FILE")
          IS_ERROR=$(printf '%s' "$RESULT" | jq -r '.is_error // false')
          if [ "$IS_ERROR" = "true" ]; then
            API_STATUS=$(printf '%s' "$RESULT" | jq -r '.api_error_status // empty')
            MESSAGE=$(printf '%s' "$RESULT" | jq -r '.result // "Claude Code reported an error."')
            if [ -n "$API_STATUS" ]; then
              echo "::error::Claude Code failed with API status ${API_STATUS}: ${MESSAGE}"
            else
              echo "::error::Claude Code failed: ${MESSAGE}"
            fi
            exit 1
          fi

      - name: Detect if Claude made commits
        if: inputs.mode == 'implement' && steps.claude.outcome == 'success'
        id: claude_changes
        env:
          GH_TOKEN: ${{ github.token }}
          PRE_HEAD_SHA: ${{ steps.pre_claude.outputs.head_sha }}
          BASELINE_KIND: ${{ steps.pre_claude.outputs.baseline_kind }}
          PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$BASELINE_KIND" = "pr" ]; then
            AFTER_SHA=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json headRefOid -q .headRefOid 2>/dev/null || echo "")
            if [ -n "$AFTER_SHA" ] && [ "$PRE_HEAD_SHA" != "$AFTER_SHA" ]; then
              echo "made_commits=true" >> "$GITHUB_OUTPUT"
            else
              echo "made_commits=false" >> "$GITHUB_OUTPUT"
              echo "::notice::Claude pushed no commits — skipping CLAUDE.md revision."
            fi
          else
            git fetch --quiet origin "$GITHUB_REF_NAME" 2>/dev/null || true
            CURRENT_SHA=$(git rev-parse HEAD)
            if [ "$PRE_HEAD_SHA" != "$CURRENT_SHA" ] || ! git diff --quiet || [ -n "$(git status --porcelain)" ]; then
              echo "made_commits=true" >> "$GITHUB_OUTPUT"
            else
              echo "made_commits=false" >> "$GITHUB_OUTPUT"
              echo "::notice::Claude made no code changes — skipping CLAUDE.md revision."
            fi
          fi

      - name: Capture primary Claude comment before revise pass
        if: inputs.mode == 'implement' && steps.claude.outcome == 'success'
        id: primary_comment
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SELECT_ONLY: '1'
        run: echo "id=$(bash "$RUNNER_TEMP/rk-shared/scripts/patch_claude_comment.sh")" >> "$GITHUB_OUTPUT"

      - name: Revise CLAUDE.md with session learnings
        if: inputs.mode == 'implement' && steps.claude.outcome == 'success' && steps.claude_changes.outputs.made_commits == 'true'
        uses: anthropics/claude-code-action@fa2b2666b747000bf42767d1f332065b375e3c8f # v1.0.214
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: "Use the Skill tool to invoke the 'claude-md-management:revise-claude-md' skill. Review the changes made in this session (use git log and git diff to inspect them) and update CLAUDE.md with any new patterns, conventions, or important context learned. If you modified CLAUDE.md, you MUST persist it: commit it on the current branch following the repository commit conventions and push with git push origin HEAD — an uncommitted edit is discarded when this job ends."
          plugin_marketplaces: |
            https://github.com/anthropics/claude-code.git
            https://github.com/anthropics/claude-plugins-official.git
          plugins: |
            code-review@claude-code-plugins
            claude-md-management@claude-plugins-official
          claude_args: --model ${{ inputs.model_id }} --effort ${{ inputs.effort }} --allowedTools "Bash(git status*),Bash(git log*),Bash(git diff*),Bash(git show*),Bash(git add*),Bash(git commit*),Bash(git push origin HEAD),Edit,Read,Grep,Glob,Write"

      - name: Append LLM footer to Claude comment
        env:
          GH_TOKEN: ${{ github.token }}
          MODEL_ID: ${{ inputs.model_id }}
          EFFORT: ${{ inputs.effort }}
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          TARGET_COMMENT_ID: ${{ steps.primary_comment.outputs.id }}
        run: bash "$RUNNER_TEMP/rk-shared/scripts/patch_claude_comment.sh"

      - name: Mark cancellation for downstream status note
        if: always() && cancelled()
        run: echo "IS_CANCELLED=true" >> "$GITHUB_ENV"

      - name: Note workflow cancellation/failure on Claude comment
        if: always() && (cancelled() || failure())
        env:
          GH_TOKEN: ${{ github.token }}
          MODEL_ID: ${{ inputs.model_id }}
          EFFORT: ${{ inputs.effort }}
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          ON_MISS: post
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ ! -f "$RUNNER_TEMP/rk-shared/scripts/patch_claude_comment.sh" ]; then
            echo "::notice::Shared scripts unavailable — cannot patch the Claude comment."
            exit 0
          fi

          if [ "${IS_CANCELLED:-}" = "true" ]; then
            STATUS_NOTE="**Workflow cancelled before completion.** See [run log]($RUN_URL)."
          else
            STATUS_NOTE="**Workflow failed before completion.** See [run log]($RUN_URL)."
          fi
          export STATUS_NOTE

          bash "$RUNNER_TEMP/rk-shared/scripts/patch_claude_comment.sh"

      - name: Clean up worktrees after Claude runs
        if: always()
        run: |
          git worktree list --porcelain | sed -n 's/^worktree //p' | while IFS= read -r wt; do
            case "$wt" in
              "$GITHUB_WORKSPACE"/.claude/worktrees/*)
                git worktree remove --force "$wt" 2>/dev/null || rm -rf "$wt" ;;
            esac
          done
          git worktree prune
