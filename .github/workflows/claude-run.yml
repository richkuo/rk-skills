            exit 1
          fi

      - name: Empty the temporary agent home
        id: agent_home_cleanup
        if: always() && steps.agent_home.outputs.temp != ''
        shell: /bin/bash --noprofile --norc -e -o pipefail {0}
        env:
          TEMP_AGENT_HOME: ${{ steps.agent_home.outputs.temp }}
          HOME_PARENT: ${{ steps.agent_home.outputs.parent }}
        run: |
          PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          export PATH
          T="$TEMP_AGENT_HOME"
          PARENT="${HOME_PARENT:-}"
          case "$PARENT" in
            /*/.rk-claude-homes) ;;
            *)
              echo "::error::The directory $PARENT that should hold the temporary agent home does not match the name this workflow creates, so $T is not touched."
              exit 1
              ;;
          esac
          if [ -L "$PARENT" ] || [ ! -d "$PARENT" ] || [ ! -O "$PARENT" ]; then
            echo "::error::The directory $PARENT that holds the temporary agent home is a symlink, not a directory, or not owned by this user, so $T is not touched."
            exit 1
          fi
          case "$T" in
            "$PARENT"/home.??????????) ;;
            *)
              echo "::error::The temporary agent home $T does not match the name this workflow creates, so it is not touched."
              exit 1
              ;;
          esac
          if [ -L "$T" ] || [ ! -d "$T" ] || [ ! -O "$T" ]; then
            echo "::error::The temporary agent home $T is a symlink, not a directory, or not owned by this user, so it is not touched."
            exit 1
          fi
          for attempt in 1 2 3; do
            find "$T" -mindepth 1 -type d ! -perm -u=rwx -exec chmod u+rwx {} + 2>/dev/null || true
            if find "$T" -mindepth 1 -delete 2>/dev/null; then
              break
            fi
            echo "Emptying $T: attempt $attempt did not remove every entry."
          done
          chmod 700 "$T"
          if [ -n "$(find "$T" -mindepth 1 -print -quit)" ]; then
            echo "::error::The temporary agent home $T is not empty after cleanup."
            exit 1
          fi
          MODE_STRING=$(ls -ld "$T" | cut -c1-10)
          if [ -L "$T" ] || [ ! -d "$T" ] || [ ! -O "$T" ] || [ "${MODE_STRING:4:6}" != "------" ]; then
            echo "::error::The temporary agent home $T is not an empty directory owned by this user with no group or other permissions after cleanup ($MODE_STRING)."
            exit 1
          fi
          echo "The temporary agent home $T is empty, $MODE_STRING, and stays until a later review removes it after one day, because later steps keep its program directories on PATH."

      - name: Fail if Claude Code returned an error
        if: steps.claude.outcome == 'success'
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            echo "::warning::jq is not installed on this runner — skipping the Claude Code error check."
            exit 0
          fi
          if [ -z "$EXECUTION_FILE" ] || [ ! -f "$EXECUTION_FILE" ]; then
            echo "::error::Claude Code execution output file is missing."
            exit 1
          fi

          RESULT=$(jq -s '
            def records:
              .[] | if type == "array" then .[] else . end;
            [records | select(type == "object" and .type == "result")] | last // {}
          ' "$EXECUTION_FILE")
          IS_ERROR=$(printf '%s' "$RESULT" | jq -r '.is_error // false')
          if [ "$IS_ERROR" = "true" ]; then
            API_STATUS=$(printf '%s' "$RESULT" | jq -r '.api_error_status // empty')
            MESSAGE=$(printf '%s' "$RESULT" | jq -r '.result // "Claude Code reported an error."')
            if [ -n "$API_STATUS" ]; then
              echo "::error::Claude Code failed with API status ${API_STATUS}: ${MESSAGE}"
            else
              echo "::error::Claude Code failed: ${MESSAGE}"
            fi
            exit 1
