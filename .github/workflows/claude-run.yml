name: Claude Code run

on:
  workflow_call:
    inputs:
      mode:
        description: 'review, implement, or fix-pr (fix-pr-review is a deprecated alias for fix-pr)'
        required: true
        type: string
      flow:
        description: 'Docs/release flow: empty, sync-docs, create-release, or sync-release'
        required: false
        type: string
        default: ''
      model:
        description: 'Model shorthand from the @claude invocation (opus, sonnet, or fable, each also with a 5 suffix); anything else selects the default'
        required: false
        type: string
        default: ''
      model_id:
        description: 'Deprecated: a caller-resolved model id, used verbatim when set; pass model instead'
        required: false
        type: string
        default: ''
      effort:
        description: 'Requested effort (low, medium, high, or xhigh); empty selects high'
        required: false
        type: string
        default: ''
      runs_on:
        description: 'Runner label for the job (e.g. self-hosted)'
        required: false
        type: string
        default: 'ubuntu-latest'
      timeout_minutes:
        description: 'Job timeout in minutes (raise for repos whose implement runs exceed the default)'
        required: false
        type: number
        default: 45
      go_version:
        description: 'If non-empty, install this Go version — ONLY for gofmt on edited files; pair with extra_allowed_tools: Bash(gofmt *)'
        required: false
        type: string
        default: ''
      extra_allowed_tools:
        description: 'Comma-separated allowlist entries appended to every route except the hard-locked create-release flow; when the default-branch CLAUDE.md states an agent guide contract, the exact entries Bash(<regenerate command>) and Bash(<verify command>) are removed on every route'
        required: false
        type: string
        default: ''
      guide_contract_permit:
        description: 'Comma-separated plain commands, each exactly equal to the agent guide contract Regenerate or Verify command, that permit the trusted runner to run them; no Bash() wrapper, no wildcard; never added to any agent allowlist; any non-blank entry makes the contract mandatory: when no contract is readable at the default-branch commit, the sync-docs and sync-release flows stop before the agent starts and the post-implementation guide revision stops, each with an issue comment that states the reason'
        required: false
        type: string
        default: ''
      review_subprocess_scrub:
        description: 'Review route only. true (the default) runs the action secret scrub on every runner; on Linux the scrub installs bubblewrap and socat with sudo apt-get and sets kernel.apparmor_restrict_unprivileged_userns=0. On a self-hosted Linux runner whose layout breaks the scrub sandbox (the workspace inside $HOME/actions-runner or $HOME/runners, anthropics/claude-code#97730, or a root review with a workspace ancestor owned by another uid, anthropics/claude-code#97731), the workflow prepares the run so the scrub stays on: a temporary HOME for the action step and root-owned .claude and .mcp.json stubs in those ancestors. When that preparation fails, the review stops before Claude starts; it never turns the scrub off. false turns the scrub off on every runner, so tool subprocesses can see the Claude credential; it runs only for a pull request author with the OWNER, MEMBER, or COLLABORATOR association (or claude[bot]) and only with review_subprocess_scrub_off_accepted: true.'
        required: false
        type: boolean
        default: true
      review_subprocess_scrub_self_hosted:
        description: 'Ignored. Kept only so a caller that sets it still runs. The value skips no layout detection, no stub or home preparation, no protection check, and no author gate.'
        required: false
        type: boolean
        default: false
      review_subprocess_scrub_off_accepted:
        description: 'Review route only. Accepts the credential exposure of review_subprocess_scrub: false. A review with the scrub off runs only when this is true and the pull request author has the OWNER, MEMBER, or COLLABORATOR association (or is claude[bot]); any other author is refused whatever this value is. It has no effect while review_subprocess_scrub is true.'
        required: false
        type: boolean
        default: false
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        description: 'Claude Code OAuth token for agent authentication'
        required: true

jobs:
  run:
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    env:
      CLAUDE_HARNESS: anthropics/claude-code-action@v1
      BOT_LOGIN: ${{ inputs.mode == 'review' && 'github-actions[bot]' || 'claude[bot]' }}
    steps:
      - name: Refuse a docs, release, or implement run on a pull request
        env:
          MODE: ${{ inputs.mode }}
          FLOW: ${{ inputs.flow }}
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_PR_URL: ${{ github.event.issue.pull_request.url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          ON_PR=false
          if [ -n "$ISSUE_PR_URL" ] || [ -n "$PR_NUMBER" ]; then
            ON_PR=true
          fi
          case "$EVENT_NAME" in
            pull_request|pull_request_target|pull_request_review|pull_request_review_comment) ON_PR=true ;;
          esac
          if [ "$ON_PR" = "true" ] && { [ -n "$FLOW" ] || [ "$MODE" = "implement" ]; }; then
            echo "::error::Run refused: a docs or release flow, or the implement route, cannot run on a pull request event. Start a docs or release flow from a comment on a plain issue. Update the caller workflow from the current template."
            exit 1
          fi

      - name: Resolve the review execution contract
        if: inputs.mode == 'review'
        id: review_contract
        env:
          SCRUB: ${{ inputs.review_subprocess_scrub }}
          SCRUB_SELF_HOSTED: ${{ inputs.review_subprocess_scrub_self_hosted }}
          SCRUB_OFF_ACCEPTED: ${{ inputs.review_subprocess_scrub_off_accepted }}
          REPO_PRIVATE: ${{ github.event.repository.private }}
          ISSUE_PR_URL: ${{ github.event.issue.pull_request.url }}
          ISSUE_AUTHOR_ASSOC: ${{ github.event.issue.author_association }}
          ISSUE_AUTHOR_LOGIN: ${{ github.event.issue.user.login }}
          PR_AUTHOR_ASSOC: ${{ github.event.pull_request.author_association }}
          PR_AUTHOR_LOGIN: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          fail() {
            echo "::error::Review refused: $1"
            exit 1
          }
          one_line() {
            case "$2" in
              *$'\n'*|*$'\r'*) fail "$1 holds a line break, so the run contract cannot record it." ;;
            esac
          }
          [ -n "${HOME:-}" ] || fail "HOME is empty, so the job home cannot be recorded."
          [ -n "${GITHUB_WORKSPACE:-}" ] || fail "GITHUB_WORKSPACE is empty."
          one_line HOME "$HOME"
          one_line GITHUB_WORKSPACE "$GITHUB_WORKSPACE"
          REAL_HOME="$HOME"
          if [ "$SCRUB_SELF_HOSTED" = "true" ]; then
            echo "::notice::review_subprocess_scrub_self_hosted is ignored. It changes no scrub decision, preparation, protection check, or author gate."
          fi

          SCRUB_VALUE=1
          NEEDS_TEMP_HOME=false
          STUB_SCAN=false
          HOME_PARENT_DENY=false
          if [ "$SCRUB" != "true" ]; then
            if [ -n "$ISSUE_PR_URL" ]; then
              AUTHOR_ASSOC="$ISSUE_AUTHOR_ASSOC"
              AUTHOR_LOGIN="$ISSUE_AUTHOR_LOGIN"
            else
              AUTHOR_ASSOC="$PR_AUTHOR_ASSOC"
              AUTHOR_LOGIN="$PR_AUTHOR_LOGIN"
            fi
            AUTHOR_TRUSTED=false
            case "$AUTHOR_ASSOC" in
              OWNER|MEMBER|COLLABORATOR) AUTHOR_TRUSTED=true ;;
            esac
            if [ "$AUTHOR_LOGIN" = "claude[bot]" ]; then
              AUTHOR_TRUSTED=true
            fi
            echo "Review pull request author association: ${AUTHOR_ASSOC:-NONE}, trusted: $AUTHOR_TRUSTED."
            echo "review_subprocess_scrub_off_accepted: ${SCRUB_OFF_ACCEPTED:-false}."
            if [ "$REPO_PRIVATE" = "true" ]; then
              EXPOSURE="This repository is private, so only accounts with access can post comments, but commits from other people can still be in the diff."
            else
              EXPOSURE="This repository is public, so any GitHub user can post that text."
            fi
            if [ "$AUTHOR_TRUSTED" != "true" ]; then
              fail "review_subprocess_scrub is false, so tool subprocesses could see the Claude credential, and the pull request author association is ${AUTHOR_ASSOC:-NONE}. A review of a pull request from an author outside OWNER, MEMBER, COLLABORATOR, or claude[bot] runs only with the scrub on, and review_subprocess_scrub_off_accepted does not change this. Remove review_subprocess_scrub: false from the review job (the default is true)."
            fi
            if [ "$SCRUB_OFF_ACCEPTED" != "true" ]; then
              fail "review_subprocess_scrub is false, so tool subprocesses could see the Claude credential. Every review reads text that people other than the pull request author can write: comments, formal reviews, inline review comments, and commits in the diff. $EXPOSURE A review runs with the scrub off only when the review job also sets review_subprocess_scrub_off_accepted: true. Remove review_subprocess_scrub: false from the review job (the default is true), or set review_subprocess_scrub_off_accepted: true to accept the exposure."
            fi
            echo "::warning::Review subprocess scrub off: review_subprocess_scrub is false and review_subprocess_scrub_off_accepted is true, so tool subprocesses can see the Claude credential (CLAUDE_CODE_OAUTH_TOKEN) while the review reads text that people other than the pull request author can write: comments, formal reviews, inline review comments, and commits in the diff. $EXPOSURE A prompt injection in that text can try to read the credential."
            SCRUB_VALUE=0
          elif [ "${RUNNER_ENVIRONMENT:-}" != "self-hosted" ]; then
            echo "Review subprocess scrub on: runner environment '${RUNNER_ENVIRONMENT:-unknown}'."
          elif [ "$(uname -s)" != "Linux" ]; then
            echo "Review subprocess scrub on: self-hosted runner is not Linux."
          else
            HOME_RESOLVED=$(cd -P "$HOME" 2>/dev/null && pwd -P) || fail "the job home $HOME cannot be resolved."
            WS_RESOLVED=$(cd -P "$GITHUB_WORKSPACE" 2>/dev/null && pwd -P) || fail "the workspace $GITHUB_WORKSPACE cannot be resolved."
            UID_NOW=$(id -u) || fail "the user ID cannot be read."
            HOME_PARENT_DENY=true
            DENIED_ROOTS=()
            for h in "$HOME" "$HOME_RESOLVED"; do
              h="${h%/}"
              [ -n "$h" ] || continue
              for name in actions-runner runners; do
                DENIED_ROOTS+=("$h/$name")
                if [ -e "$h/$name" ]; then
                  ROOT_RESOLVED=$(cd -P "$h/$name" 2>/dev/null && pwd -P) || fail "the runner path $h/$name exists but cannot be resolved."
                  DENIED_ROOTS+=("$ROOT_RESOLVED")
                fi
              done
            done
            for d in "${DENIED_ROOTS[@]}"; do
              for w in "$GITHUB_WORKSPACE" "$WS_RESOLVED"; do
                case "$w" in
                  "$d"/*)
                    if [ "$NEEDS_TEMP_HOME" != "true" ]; then
                      echo "The workspace $w is inside the denied runner path $d under the job home (anthropics/claude-code#97730), so the action step runs with a temporary HOME."
                    fi
                    NEEDS_TEMP_HOME=true
                    ;;
                esac
              done
            done
            if [ "$UID_NOW" = "0" ]; then
              STUB_SCAN=true
              echo "The review runs as root, so workspace ancestors owned by another user ID get .claude and .mcp.json stubs (anthropics/claude-code#97731)."
            fi
            echo "Review subprocess scrub on: self-hosted Linux runner, temporary HOME: $NEEDS_TEMP_HOME, ancestor stub scan: $STUB_SCAN."
          fi
          {
            printf 'scrub=%s\n' "$SCRUB_VALUE"
            printf 'real_home=%s\n' "$REAL_HOME"
            printf 'needs_temp_home=%s\n' "$NEEDS_TEMP_HOME"
            printf 'stub_scan=%s\n' "$STUB_SCAN"
            printf 'home_parent_deny=%s\n' "$HOME_PARENT_DENY"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ inputs.mode == 'review' && '0' || '1' }}
          persist-credentials: ${{ inputs.mode != 'review' }}

      - name: Read review git credentials from the environment at fetch time
        if: inputs.mode == 'review'
        run: |
          git config --local core.repositoryformatversion 1
          git config --local extensions.worktreeConfig true
          git config --worktree credential.helper ""
          git config --worktree "credential.${GITHUB_SERVER_URL}.helper" ""
          git config --worktree --add "credential.${GITHUB_SERVER_URL}.helper" "!f() { test \"\$1\" = get || return 0; echo username=x-access-token; echo \"password=\$GH_TOKEN\"; }; f"

      - name: Resolve immutable runtime revisions
        id: runtime_sources
        env:
          WORKFLOW_SHA: ${{ job.workflow_sha }}
          PLUGINS_OFFICIAL_SHA: e0ab6e51219eef74e417a0e1d89e5d53e5e763d4
        run: |
          set -euo pipefail
          require_sha() {
            name="$1"
            value="$2"
            if ! printf '%s' "$value" | grep -qxE '[0-9a-f]{40}'; then
              echo "::error::${name} is not a full commit identifier. The run stops. There is no branch or tag fallback."
              exit 1
            fi
          }
          require_sha "Called workflow revision" "$WORKFLOW_SHA"
          require_sha "Pinned Claude plugin marketplace" "$PLUGINS_OFFICIAL_SHA"
          {
            printf 'workflow_sha=%s\n' "$WORKFLOW_SHA"
            printf 'plugins_official_sha=%s\n' "$PLUGINS_OFFICIAL_SHA"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout rk-skills (shared prompts and scripts)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: richkuo/rk-skills
          ref: ${{ steps.runtime_sources.outputs.workflow_sha }}
          path: .rk-skills-shared
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout pinned Claude plugin sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: anthropics/claude-plugins-official
          ref: ${{ steps.runtime_sources.outputs.plugins_official_sha }}
          path: .rk-plugin-official
          fetch-depth: 1
          persist-credentials: false

      - name: Stage shared scripts and pinned plugin sources outside the workspace
        env:
          WORKFLOW_SHA: ${{ steps.runtime_sources.outputs.workflow_sha }}
          PLUGINS_OFFICIAL_SHA: ${{ steps.runtime_sources.outputs.plugins_official_sha }}
        run: |
          set -euo pipefail
          got_workflow="$(git -C .rk-skills-shared rev-parse HEAD)"
          if [ "$got_workflow" != "$WORKFLOW_SHA" ]; then
            echo "::error::Shared checkout ${got_workflow} does not match the called workflow commit ${WORKFLOW_SHA}."
            exit 1
          fi
          got_plugins="$(git -C .rk-plugin-official rev-parse HEAD)"
          if [ "$got_plugins" != "$PLUGINS_OFFICIAL_SHA" ]; then
            echo "::error::Plugin checkout ${got_plugins} does not match the pinned commit ${PLUGINS_OFFICIAL_SHA}."
            exit 1
          fi

          rm -rf "$RUNNER_TEMP/rk-shared"
          mkdir -p "$RUNNER_TEMP/rk-shared"
          cp -R .rk-skills-shared/templates/claude-workflow/prompts "$RUNNER_TEMP/rk-shared/prompts"
          cp -R .rk-skills-shared/templates/claude-workflow/scripts "$RUNNER_TEMP/rk-shared/scripts"

          plugin_source() {
            file="$1"
            plugin="$2"
            if command -v jq >/dev/null 2>&1; then
              jq -er --arg name "$plugin" '
                (.plugins // []) | map(select(.name == $name)) as $matches
                | if ($matches | length) != 1 then
                    error("count")
                  else
                    $matches[0].source
                  end
                | if type != "string" then
                    error("type")
                  else
                    .
                  end
              ' "$file"
              return
            fi
            if ! command -v python3 >/dev/null 2>&1; then
              echo "::error::jq or python3 is required to validate pinned plugin sources." >&2
              return 1
            fi
            python3 -I - "$file" "$plugin" << 'PY'
          import json, sys
          path, name = sys.argv[1], sys.argv[2]
          with open(path) as handle:
              data = json.load(handle)
          matches = [item for item in data.get("plugins", []) if item.get("name") == name]
          if len(matches) != 1:
              sys.exit(1)
          source = matches[0].get("source")
          if not isinstance(source, str):
              sys.exit(1)
          print(source)
          PY
          }

          read_source() {
            file="$1"
            plugin="$2"
            if ! value="$(plugin_source "$file" "$plugin")"; then
              echo "::error::Could not read one string source for ${plugin}. The run stops. There is no branch or tag fallback." >&2
              exit 1
            fi
            printf '%s' "$value"
          }

          require_plugin_dir() {
            plugin="$1"
            source="$2"
            root="$3"
            if ! printf '%s' "$source" | grep -qxE '\./[A-Za-z0-9._/-]+'; then
              echo "::error::${plugin} source is not a relative path inside the pinned checkout. The run stops. There is no branch or tag fallback." >&2
              exit 1
            fi
            case "$source" in
              *..*)
                echo "::error::${plugin} source leaves the pinned checkout." >&2
                exit 1
                ;;
            esac
            rel="${source#./}"
            if [ ! -d "${root}/${rel}" ]; then
              echo "::error::Pinned checkout is missing ${plugin} at ${rel}." >&2
              exit 1
            fi
            printf '%s' "$rel"
          }

          skills_source="$(read_source ".rk-skills-shared/.claude-plugin/marketplace.json" rk-skills)"
          if [ "$skills_source" != "./" ]; then
            echo "::error::rk-skills plugin source is not the repository root. The run stops. There is no branch or tag fallback."
            exit 1
          fi

          code_review_source="$(read_source ".rk-plugin-official/.claude-plugin/marketplace.json" code-review)"
          md_source="$(read_source ".rk-plugin-official/.claude-plugin/marketplace.json" claude-md-management)"
          code_review_rel="$(require_plugin_dir code-review "$code_review_source" .rk-plugin-official)"
          md_rel="$(require_plugin_dir claude-md-management "$md_source" .rk-plugin-official)"

          rm -rf "$RUNNER_TEMP/rk-plugin-sources"
          mkdir -p "$RUNNER_TEMP/rk-plugin-sources"
          cp -R .rk-skills-shared "$RUNNER_TEMP/rk-plugin-sources/rk-skills"
          rm -rf "$RUNNER_TEMP/rk-plugin-sources/rk-skills/.git"

          pinned="$RUNNER_TEMP/rk-plugin-sources/rk-pinned-claude-plugins"
          mkdir -p "$pinned/.claude-plugin" "$(dirname "$pinned/$code_review_rel")" "$(dirname "$pinned/$md_rel")"
          cp -R ".rk-plugin-official/$code_review_rel" "$pinned/$code_review_rel"
          cp -R ".rk-plugin-official/$md_rel" "$pinned/$md_rel"
          if command -v python3 >/dev/null 2>&1; then
            python3 -I - ".rk-plugin-official/.claude-plugin/marketplace.json" "$pinned/.claude-plugin/marketplace.json" "$code_review_source" "$md_source" << 'PY'
          import json, sys
          upstream, dest, code_review, md = sys.argv[1:]
          with open(upstream) as handle:
              data = json.load(handle)
          def entry(name, source):
              matches = [item for item in data.get("plugins", []) if isinstance(item, dict) and item.get("name") == name]
              if len(matches) != 1:
                  sys.exit(1)
              item = dict(matches[0])
              item["source"] = source
              return item
          body = {
              "name": "rk-pinned-claude-plugins",
              "description": "Local copies of the required Claude plugins from one reviewed commit.",
              "owner": {"name": "rk-skills maintainers"},
              "plugins": [
                  entry("code-review", code_review),
                  entry("claude-md-management", md),
              ],
          }
          with open(dest, "w") as handle:
              json.dump(body, handle, indent=2)
              handle.write("\n")
          PY
          else
            jq -e --arg code_review "$code_review_source" --arg md "$md_source" \
              'def entry($name; $source): [.plugins[] | select(type == "object" and .name == $name)] | if length == 1 then .[0] | .source = $source else error("count") end; {name: "rk-pinned-claude-plugins", description: "Local copies of the required Claude plugins from one reviewed commit.", owner: {name: "rk-skills maintainers"}, plugins: [entry("code-review"; $code_review), entry("claude-md-management"; $md)]}' \
              .rk-plugin-official/.claude-plugin/marketplace.json > "$pinned/.claude-plugin/marketplace.json"
          fi

          rm -rf .rk-skills-shared .rk-plugin-official
          test -d "$RUNNER_TEMP/rk-shared/prompts"
          test -d "$RUNNER_TEMP/rk-shared/scripts"
          test -f "$RUNNER_TEMP/rk-plugin-sources/rk-skills/.claude-plugin/marketplace.json"
          test ! -e "$RUNNER_TEMP/rk-plugin-sources/rk-skills/.git"
          test -f "$pinned/.claude-plugin/marketplace.json"
          test -d "$pinned/$code_review_rel"
          test -d "$pinned/$md_rel"
          test ! -e .rk-skills-shared
          test ! -e .rk-plugin-official

      - name: Prepare workspace ancestor stubs for the scrub sandbox
        id: ancestor_stubs
        if: inputs.mode == 'review' && steps.review_contract.outputs.stub_scan == 'true'
        run: bash "$RUNNER_TEMP/rk-shared/scripts/review_ancestor_stubs.sh"

      - name: Select the agent home
        id: agent_home
        env:
          NEEDS_TEMP_HOME: ${{ steps.review_contract.outputs.needs_temp_home }}
          HOME_PARENT_DENY: ${{ steps.review_contract.outputs.home_parent_deny }}
        run: bash "$RUNNER_TEMP/rk-shared/scripts/review_agent_home.sh"

      - name: Resolve model and effort
        id: resolve
        env:
          MODEL_SHORT: ${{ inputs.model }}
          MODEL_ID_IN: ${{ inputs.model_id }}
          EFFORT_IN: ${{ inputs.effort }}
        run: |
          if [ -n "$MODEL_ID_IN" ]; then
            MODEL_ID="$MODEL_ID_IN"
          else
            case "$(printf '%s' "$MODEL_SHORT" | tr '[:upper:]' '[:lower:]')" in
              opus|opus5)     MODEL_ID="claude-opus-5-5" ;;
              sonnet|sonnet5) MODEL_ID="claude-sonnet-5-5" ;;
              fable|fable5)   MODEL_ID="claude-fable-5-2" ;;
              *)              MODEL_ID="claude-opus-5-5" ;;
            esac
          fi
          ID_RE='^[A-Za-z0-9][A-Za-z0-9._:@/-]*(\[[A-Za-z0-9]+\])?$'
          if ! [[ "$MODEL_ID" =~ $ID_RE ]]; then
            echo "::error::The model id is not a valid model id."
            exit 1
          fi

          EFFORT=$(printf '%s' "$EFFORT_IN" | tr '[:upper:]' '[:lower:]')
          case "$EFFORT" in
            '') EFFORT=high ;;
            low|medium|high|xhigh) ;;
            *)
              echo "::error::The effort must be low, medium, high, or xhigh."
              exit 1
              ;;
          esac

          echo "model_id=$MODEL_ID" >> "$GITHUB_OUTPUT"
          echo "effort=$EFFORT" >> "$GITHUB_OUTPUT"
          echo "::notice::Using model: $MODEL_ID"
          echo "::notice::Using effort: $EFFORT"

      - name: Prune stale worktrees before Claude runs
        run: |
          git worktree list --porcelain | sed -n 's/^worktree //p' | while IFS= read -r wt; do
            case "$wt" in
              "$GITHUB_WORKSPACE"/.claude/worktrees/*)
                git worktree remove --force "$wt" 2>/dev/null || rm -rf "$wt" ;;
            esac
          done
          git worktree prune

      - name: Stage the pull request under review
        if: inputs.mode == 'review'
        id: pr_context
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          SETTINGS_FILE: ${{ runner.temp }}/claude-review-settings.json
          GUARD_FILE: ${{ runner.temp }}/claude-review-credential-guard.sh
          REAL_HOME: ${{ steps.review_contract.outputs.real_home }}
          AGENT_HOME: ${{ steps.agent_home.outputs.path }}
          TEMP_AGENT_HOME: ${{ steps.agent_home.outputs.temp }}
          HOME_PARENT: ${{ steps.agent_home.outputs.parent }}
          HOME_PARENT_DENY: ${{ steps.review_contract.outputs.home_parent_deny }}
        run: |
          if [ -z "$REAL_HOME" ] || [ -z "$AGENT_HOME" ]; then
            echo "::error::The run contract has no job home or agent home, so the credential guard cannot cover them."
            exit 1
          fi
          bash "$RUNNER_TEMP/rk-shared/scripts/review_write_guard.sh"
          GUARD_OID=$(git hash-object "$GUARD_FILE")

          BASE_REF=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json baseRefName -q .baseRefName)
          git fetch --quiet origin "+refs/pull/${PR_NUMBER}/head:refs/rk-claude/pr-head"
          git fetch --quiet origin "+refs/heads/${BASE_REF}:refs/rk-claude/pr-base"
          git checkout --quiet --detach refs/rk-claude/pr-head
          echo "base_sha=$(git merge-base refs/rk-claude/pr-base refs/rk-claude/pr-head)" >> "$GITHUB_OUTPUT"
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

          GUARD_OID="$GUARD_OID" bash "$RUNNER_TEMP/rk-shared/scripts/review_write_settings.sh"
          echo "settings_oid=$(git hash-object "$SETTINGS_FILE")" >> "$GITHUB_OUTPUT"

      - name: Set up Go (gofmt only)
        if: inputs.go_version != ''
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ inputs.go_version }}

      - name: Record PR head sha before Claude runs
        if: inputs.mode == 'implement'
        id: pre_claude
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          SHA=""
          KIND=local
          if [ -n "$PR_NUMBER" ]; then
            SHA=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json headRefOid -q .headRefOid 2>/dev/null || echo "")
          fi
          if [ -n "$SHA" ]; then
            KIND=pr
          else
            SHA=$(git rev-parse HEAD)
          fi
          echo "head_sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "baseline_kind=$KIND" >> "$GITHUB_OUTPUT"
          git for-each-ref --format='%(objectname) %(refname)' refs/heads > "$RUNNER_TEMP/rk-shared/refs-before.txt"
          echo "refs_sha=$(git hash-object --no-filters "$RUNNER_TEMP/rk-shared/refs-before.txt")" >> "$GITHUB_OUTPUT"

      - name: Compose Claude prompt
        id: compose_prompt
        env:
          MODEL_ID: ${{ steps.resolve.outputs.model_id }}
          EFFORT: ${{ steps.resolve.outputs.effort }}
          MODE: ${{ inputs.mode }}
          FLOW: ${{ inputs.flow }}
          EXTRA_ALLOWED: ${{ inputs.extra_allowed_tools }}
          GUIDE_PERMIT: ${{ inputs.guide_contract_permit }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          HEAD_SHA: ${{ steps.pr_context.outputs.head_sha }}
          BASE_SHA: ${{ steps.pr_context.outputs.base_sha }}
          SETTINGS_FILE: ${{ runner.temp }}/claude-review-settings.json
          GH_TOKEN: ${{ github.token }}
        run: |
          PROMPTS_DIR="$RUNNER_TEMP/rk-shared/prompts"
          if [ -n "$FLOW" ]; then
            PROMPT_FILE=$PROMPTS_DIR/sync-docs-release.md
            case "$FLOW" in
              create-release)
                ALLOWED='Read,Glob,Grep,Bash(git status*),Bash(git log*),Bash(git tag --sort*),Bash(git fetch*),Bash(git rev-parse*),Bash(gh auth status),Bash(gh release create*),Bash(gh release view*)'
                ;;
              *)
                ALLOWED='Read,Edit,Write,Glob,Grep,Bash(wc *),Bash(ls *),Bash(git status*),Bash(git log*),Bash(git diff*),Bash(git show*),Bash(git fetch*),Bash(git tag --sort*),Bash(git branch*),Bash(git rev-parse*),Bash(git checkout -b docs-sync/*),Bash(git checkout -b docs-release/*),Bash(git add*),Bash(git commit*),Bash(git push origin docs-sync/*),Bash(git push origin docs-release/*),Bash(gh pr create*),Bash(gh pr view*),Bash(gh issue view*)'
                ;;
            esac
          elif [ "$MODE" = "implement" ]; then
            PROMPT_FILE=$PROMPTS_DIR/issue-workflow.md
            ALLOWED='Bash(git *),Bash(gh *),Read,Edit,Write,Glob,Grep,Skill,EnterWorktree'
          elif [ "$MODE" = "fix-pr" ] || [ "$MODE" = "fix-pr-review" ]; then
            PROMPT_FILE=$PROMPTS_DIR/fix-pr.md
            ALLOWED='Bash(wc *),Bash(ls *),Bash(git status*),Bash(git log*),Bash(git diff*),Bash(git show*),Bash(git fetch*),Bash(git merge origin/*),Bash(git branch*),Bash(git rev-parse*),Bash(git checkout*),Bash(git switch*),Bash(git add*),Bash(git commit*),Bash(git push origin HEAD),Bash(gh pr checkout*),Bash(gh pr view*),Bash(gh pr diff*),Bash(gh pr comment*),Bash(gh issue view*),Bash(gh issue list*),Bash(gh issue create*),Bash(gh api graphql*),Read,Edit,Write,Glob,Grep'
          else
            PROMPT_FILE=$PROMPTS_DIR/pr-review-format.md
            ALLOWED='Bash(git status*),Bash(git log*),Bash(git diff*),Bash(git show*),Bash(git fetch origin),Bash(git fetch origin *),Bash(git branch*),Bash(git rev-parse*),Bash(gh pr view*),Bash(gh pr diff*),Bash(gh pr comment*),Bash(gh issue view*)'
          fi

          ROUTE_EXTRA=""
          if [ -n "$EXTRA_ALLOWED" ]; then
            if printf '%s' "$EXTRA_ALLOWED" | grep -q '["`$]'; then
              echo "::error::extra_allowed_tools must not contain double quotes, backticks, or dollar signs (claude_args is shell-evaluated)."
              exit 1
            fi
            if [ "$FLOW" = "create-release" ]; then
              echo "::notice::extra_allowed_tools is ignored in the create-release flow (hard-locked allowlist)."
            else
              ROUTE_EXTRA="$EXTRA_ALLOWED"
            fi
          fi
          if [ -n "$GUIDE_PERMIT" ]; then
            if printf '%s' "$GUIDE_PERMIT" | grep -q '["`$]'; then
              echo "::error::guide_contract_permit must not contain double quotes, backticks, or dollar signs (it reaches shell-composed text)."
              exit 1
            fi
            if [ -n "$ROUTE_EXTRA" ]; then
              ROUTE_EXTRA=$(RK_EXTRA="$ROUTE_EXTRA" RK_PERMIT="$GUIDE_PERMIT" awk 'BEGIN {
                n = split(ENVIRON["RK_PERMIT"], permit, ",")
                for (i = 1; i <= n; i++) { v = permit[i]; gsub(/^[ \t]+|[ \t]+$/, "", v); if (v != "") drop["Bash(" v ")"] = 1 }
                m = split(ENVIRON["RK_EXTRA"], extra, ",")
                out = ""
                for (i = 1; i <= m; i++) { v = extra[i]; gsub(/^[ \t]+|[ \t]+$/, "", v); if (v != "" && !(v in drop)) out = out (out == "" ? "" : ",") v }
                print out
              }')
            fi
          fi

          flatten() { tr '\n' ' ' | sed -e 's/[[:space:]]\{2,\}/ /g' -e 's/^ *//' -e 's/ *$//'; }
          echo "guide_runner_sha=$(git hash-object --no-filters "$RUNNER_TEMP/rk-shared/scripts/guide_contract.py" 2>/dev/null || true)" >> "$GITHUB_OUTPUT"
          TRUSTED_REF=""
          if git fetch --quiet --depth 1 origin "refs/heads/$DEFAULT_BRANCH" 2>/dev/null; then
            TRUSTED_REF=FETCH_HEAD
          else
            echo "::warning::Could not fetch the default branch — repo prompt overrides are skipped this run."
          fi
          PROMPT_NAME=$(basename "$PROMPT_FILE")
          REPLACEMENT_PATH=".github/prompts/$PROMPT_NAME"
          LOCAL_PATH=".github/prompts/$(basename "$PROMPT_FILE" .md)-local.md"
          LEGACY_REPLACEMENT_PATH=""
          LEGACY_LOCAL_PATH=""
          if [ "$MODE" = "fix-pr-review" ]; then
            LEGACY_REPLACEMENT_PATH=".github/prompts/fix-pr-review.md"
            LEGACY_LOCAL_PATH=".github/prompts/fix-pr-review-local.md"
          fi
          if [ -n "$TRUSTED_REF" ] && git cat-file -e "$TRUSTED_REF:$REPLACEMENT_PATH" 2>/dev/null; then
            PROMPT=$(git show "$TRUSTED_REF:$REPLACEMENT_PATH" | flatten)
          elif [ -n "$TRUSTED_REF" ] && [ -n "$LEGACY_REPLACEMENT_PATH" ] && git cat-file -e "$TRUSTED_REF:$LEGACY_REPLACEMENT_PATH" 2>/dev/null; then
            PROMPT=$(git show "$TRUSTED_REF:$LEGACY_REPLACEMENT_PATH" | flatten)
          else
            PROMPT=$(flatten < "$PROMPT_FILE")
          fi
          TRUSTED_SHA=""
          if [ -n "$TRUSTED_REF" ]; then
            TRUSTED_SHA=$(git rev-parse "$TRUSTED_REF")
          elif [ "${GITHUB_REF:-}" = "refs/heads/$DEFAULT_BRANCH" ]; then
            TRUSTED_SHA=$(git rev-parse HEAD)
          else
            echo "::warning::The default branch could not be fetched and this run is not on it, so the agent guide contract is not read this run."
          fi
          echo "trusted_sha=$TRUSTED_SHA" >> "$GITHUB_OUTPUT"
          GUIDE_ADD_DIR=""
          GUIDE_REQUIRED=false
          if [ -n "$(printf '%s' "$GUIDE_PERMIT" | LC_ALL=C tr -d ',[:space:]')" ]; then
            GUIDE_REQUIRED=true
          fi
          GUIDE_HEADING=false
          if [ -n "$TRUSTED_SHA" ] && grep -qxF '## Agent guide contract' <(git show "$TRUSTED_SHA:CLAUDE.md" 2>/dev/null); then
            GUIDE_HEADING=true
          fi
          guide_stop() {
            GUIDE_STOP_REASON=$(printf '%s' "$1" | tr '\r\n' '  ')
            echo "guide_stop_reason=$GUIDE_STOP_REASON" >> "$GITHUB_OUTPUT"
            echo "::error::The documentation sync is stopped: $GUIDE_STOP_REASON"
            exit 1
          }
          if [ -n "$FLOW" ] && [ "$FLOW" != "create-release" ] && [ "$GUIDE_REQUIRED" = true ]; then
            GUIDE_ENTRY=""
            if [ -n "$TRUSTED_SHA" ]; then
              GUIDE_ENTRY=$(git ls-tree "$TRUSTED_SHA" -- CLAUDE.md 2>/dev/null) || GUIDE_ENTRY=""
            fi
            case "$GUIDE_ENTRY" in
              "100644 blob "*|"100755 blob "*) GUIDE_REGULAR=true ;;
              *) GUIDE_REGULAR=false ;;
            esac
            if [ -z "$TRUSTED_SHA" ]; then
              guide_stop "the caller sets guide_contract_permit, but the default branch could not be fetched and this run is not on it, so no agent guide contract can be read"
            elif [ -z "$GUIDE_ENTRY" ]; then
              guide_stop "the caller sets guide_contract_permit, but CLAUDE.md is missing at the default-branch commit ${TRUSTED_SHA}"
            elif [ "$GUIDE_REGULAR" != true ]; then
              guide_stop "the caller sets guide_contract_permit, but CLAUDE.md at the default-branch commit ${TRUSTED_SHA} is not a regular file"
            elif [ "$GUIDE_HEADING" != true ]; then
              guide_stop "the caller sets guide_contract_permit, but CLAUDE.md at the default-branch commit ${TRUSTED_SHA} has no line that is exactly ## Agent guide contract"
            fi
          fi
          if [ -n "$FLOW" ] && [ "$FLOW" != "create-release" ] && [ "$GUIDE_HEADING" = true ]; then
            GUIDE_DIR="$RUNNER_TEMP/rk-guide"
            GUIDE_RUNNER="$GUIDE_DIR/guide_contract.py"
            GUIDE_STAGE_DIR="$RUNNER_TEMP/rk-guide-stage"
            if [ -d "$GUIDE_DIR" ]; then
              chmod -R u+w "$GUIDE_DIR"
            fi
            rm -rf "$GUIDE_DIR" "$GUIDE_STAGE_DIR" "$GUIDE_STAGE_DIR.applied.json"
            mkdir -p "$GUIDE_DIR"
            GUIDE_OUT=""
            if command -v python3 >/dev/null 2>&1 && cp "$RUNNER_TEMP/rk-shared/scripts/guide_contract.py" "$GUIDE_RUNNER" && chmod 444 "$GUIDE_RUNNER"; then
              GUIDE_OUT=$(RK_EXTRA_ALLOWED="$ROUTE_EXTRA" RK_GUIDE_PERMIT="$GUIDE_PERMIT" python3 -I "$GUIDE_RUNNER" sync-state --repo "$GITHUB_WORKSPACE" --ref "$TRUSTED_SHA" --state-file "$GUIDE_DIR/sync-state.json" --runner "$GUIDE_RUNNER" --stage-dir "$GUIDE_STAGE_DIR") || GUIDE_OUT=""
            fi
            chmod 555 "$GUIDE_DIR"
            guide_value() { printf '%s\n' "$GUIDE_OUT" | sed -n "s/^$1=//p" | head -n 1; }
            GUIDE_STATE=$(guide_value state)
            GUIDE_REASON=$(guide_value reason | tr -d '"`$')
            GUIDE_EXTRA=""
            if [ -z "$GUIDE_STATE" ]; then
              GUIDE_STATE=unavailable
              GUIDE_REASON="python3 is missing or the guide contract runner failed, so no project command runs"
            else
              GUIDE_EXTRA=$(guide_value filtered_extra)
            fi
            echo "::notice::Agent guide contract state: $GUIDE_STATE."
            if [ "$GUIDE_STATE" = "none" ] && [ "$GUIDE_REQUIRED" = true ]; then
              guide_stop "the caller sets guide_contract_permit, but ${GUIDE_REASON}, read from the default-branch commit ${TRUSTED_SHA}"
            fi
            if [ "$GUIDE_STATE" != "none" ]; then
              ROUTE_EXTRA="$GUIDE_EXTRA"
              PROMPT="$PROMPT $(flatten < "$PROMPTS_DIR/sync-docs-guide-contract.md")"
              if [ "$GUIDE_STATE" = "ready" ]; then
                GUIDE_CHECK=$(guide_value check_command)
                GUIDE_RUN=$(guide_value run_command)
                ALLOWED="$ALLOWED,Bash($GUIDE_CHECK),Bash($GUIDE_RUN)"
                PROMPT="$PROMPT The agent guide contract state for this run is ready, read from the default-branch commit ${TRUSTED_SHA}. The runner check command is [[${GUIDE_CHECK}]] and the runner run command is [[${GUIDE_RUN}]]."
                GUIDE_STAGED=$(guide_value staged | tr -d '"`$')
                GUIDE_ADD_DIR=$(guide_value stage_dir | tr -d '"`$')
                if [ -n "$GUIDE_ADD_DIR" ]; then
                  PROMPT="$PROMPT The staging directory for this run is ${GUIDE_ADD_DIR}. The staged copies of the stated sources are: ${GUIDE_STAGED:-none}."
                fi
              else
                PROMPT="$PROMPT The agent guide contract state for this run is ${GUIDE_STATE}, read from the default-branch commit ${TRUSTED_SHA}, for this reason: ${GUIDE_REASON}."
              fi
            fi
          elif [ -z "$FLOW" ] && [ -n "$ROUTE_EXTRA" ] && [ "$GUIDE_HEADING" = true ]; then
            ROUTE_OUT=""
            if command -v python3 >/dev/null 2>&1; then
              ROUTE_OUT=$(RK_EXTRA_ALLOWED="$ROUTE_EXTRA" python3 -I "$RUNNER_TEMP/rk-shared/scripts/guide_contract.py" route-extra --repo "$GITHUB_WORKSPACE" --ref "$TRUSTED_SHA") || ROUTE_OUT=""
            fi
            ROUTE_STATE=$(printf '%s\n' "$ROUTE_OUT" | sed -n 's/^state=//p' | head -n 1)
            case "$ROUTE_STATE" in
              none) ;;
              ok) ROUTE_EXTRA=$(printf '%s\n' "$ROUTE_OUT" | sed -n 's/^filtered_extra=//p' | head -n 1) ;;
              *)
                echo "::warning::The default-branch CLAUDE.md has an agent guide contract heading, but the contract state is ${ROUTE_STATE:-unknown, because python3 is missing or the guide contract runner failed}, so the project commands cannot be removed from extra_allowed_tools and every extra_allowed_tools entry is dropped for this run."
                ROUTE_EXTRA=""
                ;;
            esac
          fi
          if [ -n "$ROUTE_EXTRA" ]; then
            ALLOWED="$ALLOWED,$ROUTE_EXTRA"
          fi
          if [ -n "$TRUSTED_REF" ] && git cat-file -e "$TRUSTED_REF:$LOCAL_PATH" 2>/dev/null; then
            PROMPT="$PROMPT $(git show "$TRUSTED_REF:$LOCAL_PATH" | flatten)"
          elif [ -n "$TRUSTED_REF" ] && [ -n "$LEGACY_LOCAL_PATH" ] && git cat-file -e "$TRUSTED_REF:$LEGACY_LOCAL_PATH" 2>/dev/null; then
            PROMPT="$PROMPT $(git show "$TRUSTED_REF:$LEGACY_LOCAL_PATH" | flatten)"
          fi
          if printf '%s' "$PROMPT" | grep -q '["`$]'; then
            echo "::error::The prompt for this route ($PROMPT_NAME, including any $REPLACEMENT_PATH / $LOCAL_PATH override) must not contain double quotes, backticks, or dollar signs (claude_args is shell-evaluated)."
            exit 1
          fi
          PROMPT="$PROMPT The harness identifier for LLM attribution footers in this run is ${CLAUDE_HARNESS}."
          if [ -n "$FLOW" ]; then
            PROMPT="$PROMPT The requested operation mode for this run is ${FLOW}."
          fi
          if [ "$MODE" = "review" ]; then
            PROMPT="$PROMPT The pull request head is checked out in this workspace already, as a detached HEAD at commit ${HEAD_SHA}. Its merge base with the target branch is ${BASE_SHA}."
          fi
          ARGS="--model ${MODEL_ID} --effort ${EFFORT} --append-system-prompt \"${PROMPT}\" --allowedTools \"${ALLOWED}\""
          if [ -n "$GUIDE_ADD_DIR" ]; then
            ARGS="$ARGS --add-dir \"${GUIDE_ADD_DIR}\""
          fi
          if [ "$MODE" = "review" ]; then
            ARGS="$ARGS --disallowedTools \"Edit,Write,NotebookEdit,WebFetch,WebSearch,Skill,Agent,Task,Read(//proc/**),Bash(git *--output*),Bash(git diff*--no-index*),Bash(git fetch*--upload-pack*),Bash(gh pr comment*--body-file*),Bash(gh pr comment* -F*)\" --setting-sources user --settings ${SETTINGS_FILE}"
          fi
          {
            printf 'claude_args<<CLAUDE_ARGS_EOF\n'
            printf '%s\n' "$ARGS"
            printf 'CLAUDE_ARGS_EOF\n'
          } >> "$GITHUB_OUTPUT"

      - name: Confirm no job credential persists on disk before Claude runs
        if: inputs.mode == 'review'
        env:
          GH_TOKEN: ${{ github.token }}
          GUARD_FILE: ${{ runner.temp }}/claude-review-credential-guard.sh
          GUARD_OID: ${{ steps.pr_context.outputs.guard_oid }}
        run: |
          echo "Git config keys, each with the file that sets it:"
          git config --list --show-origin --name-only
          echo "RUNNER_TEMP contents:"
          ls -la "$RUNNER_TEMP"
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::The job token is empty, so the credential check cannot run."
            exit 1
          fi
          AUTH_B64=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          echo "::add-mask::$AUTH_B64"
          if [ -z "$GUARD_OID" ] || [ "$(git hash-object "$GUARD_FILE" 2>/dev/null)" != "$GUARD_OID" ]; then
            echo "::error::The credential guard script is missing or changed before Claude ran."
            exit 1
          fi
          if ! bash "$GUARD_FILE"; then
            echo "::error::A job credential persists on disk, so Claude does not start."
            exit 1
          fi

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@acfe7992852970efb4fee683d63d628e3e52df67 # v1.0.286
        env:
          HOME: ${{ steps.agent_home.outputs.path }}
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: ${{ steps.review_contract.outputs.scrub }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          github_token: ${{ inputs.mode == 'review' && github.token || '' }}

          allowed_non_write_users: ${{ inputs.mode == 'review' && 'rk-skills:no-login-matches' || '' }}

          allowed_bots: 'claude'

          show_full_output: true

          plugin_marketplaces: |
            ${{ runner.temp }}/rk-plugin-sources/rk-pinned-claude-plugins
            ${{ runner.temp }}/rk-plugin-sources/rk-skills
          plugins: |
            code-review@rk-pinned-claude-plugins
            rk-skills@rk-skills

          claude_args: ${{ steps.compose_prompt.outputs.claude_args }}

      - name: Confirm no job credential persisted on disk while Claude ran
        if: always() && inputs.mode == 'review' && steps.claude.outcome != 'skipped'
        shell: /bin/bash --noprofile --norc -e -o pipefail {0}
        env:
          GH_TOKEN: ${{ github.token }}
          GUARD_FILE: ${{ runner.temp }}/claude-review-credential-guard.sh
          SETTINGS_FILE: ${{ runner.temp }}/claude-review-settings.json
          GUARD_OID: ${{ steps.pr_context.outputs.guard_oid }}
          SETTINGS_OID: ${{ steps.pr_context.outputs.settings_oid }}
          TEMP_AGENT_HOME: ${{ steps.agent_home.outputs.temp }}
        run: |
          if [ -n "$TEMP_AGENT_HOME" ]; then
            KEPT_PATH=""
            IFS=: read -r -a PATH_PARTS <<< "$PATH"
            for PART in "${PATH_PARTS[@]}"; do
              case "$PART" in
                "$TEMP_AGENT_HOME"|"$TEMP_AGENT_HOME"/*) continue ;;
              esac
              KEPT_PATH="${KEPT_PATH:+$KEPT_PATH:}$PART"
            done
            PATH="$KEPT_PATH"
            export PATH
          fi
          echo "Git config keys, each with the file that sets it:"
          git config --list --show-origin --name-only
          if [ -z "$GUARD_OID" ] || [ "$(git hash-object "$GUARD_FILE" 2>/dev/null)" != "$GUARD_OID" ]; then
            echo "::error::The credential guard script changed while Claude ran."
            exit 1
          fi
          if [ -z "$SETTINGS_OID" ] || [ "$(git hash-object "$SETTINGS_FILE" 2>/dev/null)" != "$SETTINGS_OID" ]; then
            echo "::error::The review settings file changed while Claude ran."
            exit 1
          fi
          if ! bash "$GUARD_FILE" --after-action; then
            echo "::error::The job token persisted on disk while Claude ran."
            exit 1
          fi

      - name: Empty the temporary agent home
        id: agent_home_cleanup
        if: always() && steps.agent_home.outputs.temp != ''
        shell: /bin/bash --noprofile --norc -e -o pipefail {0}
        env:
          TEMP_AGENT_HOME: ${{ steps.agent_home.outputs.temp }}
          HOME_PARENT: ${{ steps.agent_home.outputs.parent }}
        run: |
          PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          export PATH
          T="$TEMP_AGENT_HOME"
          PARENT="${HOME_PARENT:-}"
          case "$PARENT" in
            /*/.rk-claude-homes) ;;
            *)
              echo "::error::The directory $PARENT that should hold the temporary agent home does not match the name this workflow creates, so $T is not touched."
              exit 1
              ;;
          esac
          if [ -L "$PARENT" ] || [ ! -d "$PARENT" ] || [ ! -O "$PARENT" ]; then
            echo "::error::The directory $PARENT that holds the temporary agent home is a symlink, not a directory, or not owned by this user, so $T is not touched."
            exit 1
          fi
          case "$T" in
            "$PARENT"/home.??????????) ;;
            *)
              echo "::error::The temporary agent home $T does not match the name this workflow creates, so it is not touched."
              exit 1
              ;;
          esac
          if [ -L "$T" ] || [ ! -d "$T" ] || [ ! -O "$T" ]; then
            echo "::error::The temporary agent home $T is a symlink, not a directory, or not owned by this user, so it is not touched."
            exit 1
          fi
          for attempt in 1 2 3; do
            find "$T" -mindepth 1 -type d ! -perm -u=rwx -exec chmod u+rwx {} + 2>/dev/null || true
            if find "$T" -mindepth 1 -delete 2>/dev/null; then
              break
            fi
            echo "Emptying $T: attempt $attempt did not remove every entry."
          done
          chmod 700 "$T"
          if [ -n "$(find "$T" -mindepth 1 -print -quit)" ]; then
            echo "::error::The temporary agent home $T is not empty after cleanup."
            exit 1
          fi
          MODE_STRING=$(ls -ld "$T" | cut -c1-10)
          if [ -L "$T" ] || [ ! -d "$T" ] || [ ! -O "$T" ] || [ "${MODE_STRING:4:6}" != "------" ]; then
            echo "::error::The temporary agent home $T is not an empty directory owned by this user with no group or other permissions after cleanup ($MODE_STRING)."
            exit 1
          fi
          echo "The temporary agent home $T is empty, $MODE_STRING, and stays until a later review removes it after one day, because later steps keep its program directories on PATH."

      - name: Fail if Claude Code returned an error
        if: steps.claude.outcome == 'success'
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            echo "::warning::jq is not installed on this runner — skipping the Claude Code error check."
            exit 0
          fi
          if [ -z "$EXECUTION_FILE" ] || [ ! -f "$EXECUTION_FILE" ]; then
            echo "::error::Claude Code execution output file is missing."
            exit 1
          fi

          RESULT=$(jq -s '
            def records:
              .[] | if type == "array" then .[] else . end;
            [records | select(type == "object" and .type == "result")] | last // {}
          ' "$EXECUTION_FILE")
          IS_ERROR=$(printf '%s' "$RESULT" | jq -r '.is_error // false')
          if [ "$IS_ERROR" = "true" ]; then
            API_STATUS=$(printf '%s' "$RESULT" | jq -r '.api_error_status // empty')
            MESSAGE=$(printf '%s' "$RESULT" | jq -r '.result // "Claude Code reported an error."')
            if [ -n "$API_STATUS" ]; then
              echo "::error::Claude Code failed with API status ${API_STATUS}: ${MESSAGE}"
            else
              echo "::error::Claude Code failed: ${MESSAGE}"
            fi
            exit 1
          fi

      - name: Detect if Claude made commits
        if: inputs.mode == 'implement' && steps.claude.outcome == 'success'
        id: claude_changes
        env:
          GH_TOKEN: ${{ github.token }}
          PRE_HEAD_SHA: ${{ steps.pre_claude.outputs.head_sha }}
          BASELINE_KIND: ${{ steps.pre_claude.outputs.baseline_kind }}
          PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          REFS_SHA: ${{ steps.pre_claude.outputs.refs_sha }}
          RUNNER_SHA: ${{ steps.compose_prompt.outputs.guide_runner_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$BASELINE_KIND" = "pr" ]; then
            AFTER_SHA=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json headRefOid -q .headRefOid 2>/dev/null || echo "")
            if [ -n "$AFTER_SHA" ] && [ "$PRE_HEAD_SHA" != "$AFTER_SHA" ]; then
              echo "made_commits=true" >> "$GITHUB_OUTPUT"
            else
              echo "made_commits=false" >> "$GITHUB_OUTPUT"
              echo "::notice::Claude pushed no commits — skipping CLAUDE.md revision."
            fi
          else
            git fetch --quiet origin "$GITHUB_REF_NAME" 2>/dev/null || true
            CURRENT_SHA=$(git rev-parse HEAD)
            if [ "$PRE_HEAD_SHA" != "$CURRENT_SHA" ] || ! git diff --quiet || [ -n "$(git status --porcelain)" ]; then
              echo "made_commits=true" >> "$GITHUB_OUTPUT"
            else
              echo "made_commits=false" >> "$GITHUB_OUTPUT"
              echo "::notice::Claude made no code changes — skipping CLAUDE.md revision."
            fi
          fi
          GUIDE_GATE=true
          COUNT=""
          RUNNER="$RUNNER_TEMP/rk-shared/scripts/guide_contract.py"
          REFS_FILE="$RUNNER_TEMP/rk-shared/refs-before.txt"
          if [ -n "$REFS_SHA" ] && [ "$(git hash-object --no-filters "$REFS_FILE" 2>/dev/null || true)" = "$REFS_SHA" ] && [ -n "$RUNNER_SHA" ] && [ "$(git hash-object --no-filters "$RUNNER" 2>/dev/null || true)" = "$RUNNER_SHA" ] && command -v python3 >/dev/null 2>&1; then
            COUNT=$(python3 -I "$RUNNER" session-branches --repo "$GITHUB_WORKSPACE" --refs-before "$REFS_FILE" --start "$PRE_HEAD_SHA" --default-branch "$DEFAULT_BRANCH" | sed -n 's/^count=//p' | head -n 1) || COUNT=""
            if [ "$COUNT" = "0" ]; then
              GUIDE_GATE=false
            fi
          fi
          echo "guide_gate=$GUIDE_GATE" >> "$GITHUB_OUTPUT"
          if [ "$GUIDE_GATE" = true ]; then
            echo "::notice::The agent guide contract gate is open (session branches: ${COUNT:-not proved})."
          else
            echo "::notice::The agent guide contract gate is closed: the session left no branch with session commits."
          fi

      - name: Capture primary Claude comment before revise pass
        if: inputs.mode == 'implement' && steps.claude.outcome == 'success'
        id: primary_comment
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SELECT_ONLY: '1'
        run: echo "id=$(bash "$RUNNER_TEMP/rk-shared/scripts/patch_claude_comment.sh")" >> "$GITHUB_OUTPUT"

      - name: Prepare the guide contract revise pass
        if: inputs.mode == 'implement' && steps.claude.outcome == 'success' && (steps.claude_changes.outputs.made_commits == 'true' || steps.claude_changes.outputs.guide_gate == 'true')
        id: guide_contract
        env:
          FLOW: ${{ inputs.flow }}
          TRUSTED_SHA: ${{ steps.compose_prompt.outputs.trusted_sha }}
          RUNNER_SHA: ${{ steps.compose_prompt.outputs.guide_runner_sha }}
          REFS_SHA: ${{ steps.pre_claude.outputs.refs_sha }}
          START_SHA: ${{ steps.pre_claude.outputs.head_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REPO: ${{ github.repository }}
          RK_GUIDE_PERMIT: ${{ inputs.guide_contract_permit }}
          GH_TOKEN: ${{ github.token }}
        run: |
          stop() {
            printf 'state=stop\nreason=%s\n' "$1" >> "$GITHUB_OUTPUT"
            echo "::notice::Agent guide contract revise pass: stop. $1"
            exit 0
          }
          GUIDE_REQUIRED=false
          if [ -n "$(printf '%s' "$RK_GUIDE_PERMIT" | LC_ALL=C tr -d ',[:space:]')" ]; then
            GUIDE_REQUIRED=true
          fi
          no_contract() {
            if [ "$GUIDE_REQUIRED" = true ]; then
              stop "$1"
            fi
            echo "state=none" >> "$GITHUB_OUTPUT"
            exit 0
          }
          GUIDE_ENTRY=""
          if [ -n "$TRUSTED_SHA" ]; then
            GUIDE_ENTRY=$(git ls-tree "$TRUSTED_SHA" -- CLAUDE.md 2>/dev/null) || GUIDE_ENTRY=""
          fi
          case "$GUIDE_ENTRY" in
            "100644 blob "*|"100755 blob "*) GUIDE_REGULAR=true ;;
            *) GUIDE_REGULAR=false ;;
          esac
          if [ -z "$TRUSTED_SHA" ]; then
            no_contract "the caller sets guide_contract_permit, but the trusted default-branch commit was not recorded before the session ran, so no guide revision runs"
          elif [ -z "$GUIDE_ENTRY" ]; then
            no_contract "the caller sets guide_contract_permit, but CLAUDE.md is missing at the default-branch commit ${TRUSTED_SHA}, so no guide revision runs"
          elif [ "$GUIDE_REGULAR" != true ]; then
            no_contract "the caller sets guide_contract_permit, but CLAUDE.md at the default-branch commit ${TRUSTED_SHA} is not a regular file, so no guide revision runs"
          elif ! grep -qxF '## Agent guide contract' <(git show "$TRUSTED_SHA:CLAUDE.md" 2>/dev/null); then
            no_contract "the caller sets guide_contract_permit, but CLAUDE.md at the default-branch commit ${TRUSTED_SHA} has no line that is exactly ## Agent guide contract, so no guide revision runs"
          fi
          RUNNER="$RUNNER_TEMP/rk-shared/scripts/guide_contract.py"
          GUIDE_DIR="$RUNNER_TEMP/rk-guide-revise"
          command -v python3 >/dev/null 2>&1 || stop "python3 is missing, so the guide contract revise pass cannot run"
          NOW_SHA=$(git hash-object --no-filters "$RUNNER" 2>/dev/null || true)
          if [ -z "$RUNNER_SHA" ] || [ "$NOW_SHA" != "$RUNNER_SHA" ]; then
            stop "the guide contract runner changed after the prompt was composed, so it does not run"
          fi
          if [ -z "$REFS_SHA" ] || [ "$(git hash-object --no-filters "$RUNNER_TEMP/rk-shared/refs-before.txt" 2>/dev/null || true)" != "$REFS_SHA" ]; then
            stop "the branch list recorded before the session ran is missing or changed, so the session branch cannot be found"
          fi
          STAGE_DIR="$RUNNER_TEMP/rk-guide-stage"
          rm -rf "$GUIDE_DIR" "$STAGE_DIR" "$STAGE_DIR.applied.json"
          mkdir -p "$GUIDE_DIR"
          OUT=$(python3 -I "$RUNNER" prepare --repo "$GITHUB_WORKSPACE" --trusted "$TRUSTED_SHA" --start "$START_SHA" --default-branch "$DEFAULT_BRANCH" --refs-before "$RUNNER_TEMP/rk-shared/refs-before.txt" --slug "$REPO" --state-file "$GUIDE_DIR/state.json" --prompt-template "$RUNNER_TEMP/rk-shared/prompts/revise-guide-contract.md" --prompt-out "$GUIDE_DIR/prompt.md" --flavor claude --flow "$FLOW" --stage-dir "$STAGE_DIR") || OUT=""
          value() { printf '%s\n' "$OUT" | sed -n "s/^$1=//p" | head -n 1; }
          STATE=$(value state)
          [ -n "$STATE" ] || stop "the guide contract runner failed while it prepared the revise pass"
          printf 'state=%s\nreason=%s\ndigest=%s\nbranch=%s\n' "$STATE" "$(value reason)" "$(value digest)" "$(value branch)" >> "$GITHUB_OUTPUT"
          echo "::notice::Agent guide contract revise pass: $STATE. $(value reason)"
          if [ "$STATE" = "ready" ]; then
            DELIM="RK_GUIDE_PROMPT_$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
            {
              printf 'prompt<<%s\n' "$DELIM"
              cat "$GUIDE_DIR/prompt.md"
              printf '%s\n' "$DELIM"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Revise CLAUDE.md with session learnings
        if: inputs.mode == 'implement' && steps.claude.outcome == 'success' && steps.claude_changes.outputs.made_commits == 'true' && steps.guide_contract.outputs.state == 'none'
        uses: anthropics/claude-code-action@acfe7992852970efb4fee683d63d628e3e52df67 # v1.0.286
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: "Use the Skill tool to invoke the 'claude-md-management:revise-claude-md' skill. Review the changes made in this session (use git log and git diff to inspect them) and update CLAUDE.md with any new patterns, conventions, or important context learned. If you modified CLAUDE.md, you MUST persist it: commit it on the current branch following the repository commit conventions and push with git push origin HEAD — an uncommitted edit is discarded when this job ends."
          plugin_marketplaces: |
            ${{ runner.temp }}/rk-plugin-sources/rk-pinned-claude-plugins
          plugins: |
            code-review@rk-pinned-claude-plugins
            claude-md-management@rk-pinned-claude-plugins
          claude_args: --model ${{ steps.resolve.outputs.model_id }} --effort ${{ steps.resolve.outputs.effort }} --permission-mode default --allowedTools "Bash(git status*),Bash(git log*),Bash(git diff*),Bash(git show*),Bash(git add*),Bash(git commit*),Bash(git push origin HEAD),Edit,Read,Grep,Glob,Write"

      - name: Revise the guide sources
        if: steps.guide_contract.outputs.state == 'ready'
        id: guide_revise
        continue-on-error: true
        uses: anthropics/claude-code-action@acfe7992852970efb4fee683d63d628e3e52df67 # v1.0.286
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: 'claude'
          prompt: ${{ steps.guide_contract.outputs.prompt }}
          claude_args: --model ${{ steps.resolve.outputs.model_id }} --effort ${{ steps.resolve.outputs.effort }} --permission-mode default --add-dir ${{ runner.temp }}/rk-guide-stage --allowedTools "Bash(git status*),Bash(git log*),Bash(git diff*),Bash(git show*),Edit,Write,Read,Grep,Glob"

      - name: Regenerate, verify, and commit the agent guides
        if: steps.guide_contract.outputs.state == 'ready'
        id: guide_settle
        env:
          DIGEST: ${{ steps.guide_contract.outputs.digest }}
          RUNNER_SHA: ${{ steps.compose_prompt.outputs.guide_runner_sha }}
          MODEL_ID: ${{ steps.resolve.outputs.model_id }}
          EFFORT: ${{ steps.resolve.outputs.effort }}
        run: |
          RUNNER="$RUNNER_TEMP/rk-shared/scripts/guide_contract.py"
          GUIDE_DIR="$RUNNER_TEMP/rk-guide-revise"
          NOW_SHA=$(git hash-object --no-filters "$RUNNER" 2>/dev/null || true)
          if [ -z "$RUNNER_SHA" ] || [ "$NOW_SHA" != "$RUNNER_SHA" ]; then
            printf '{"result": "stop", "reason": "the guide contract runner changed after the prompt was composed, so it does not run"}\n' > "$GUIDE_DIR/result.json"
            echo "result=stop" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          OUT=$(python3 -I "$RUNNER" settle --state-file "$GUIDE_DIR/state.json" --state "$DIGEST" --result-file "$GUIDE_DIR/result.json" --model "$MODEL_ID" --effort "$EFFORT" --harness "$CLAUDE_HARNESS") || OUT=""
          printf '%s\n' "$OUT"
          RESULT=$(printf '%s\n' "$OUT" | sed -n 's/^result=//p' | head -n 1)
          echo "result=${RESULT:-stop}" >> "$GITHUB_OUTPUT"

      - name: Push the agent guide commit
        if: steps.guide_settle.outputs.result == 'committed'
        continue-on-error: true
        uses: anthropics/claude-code-action@acfe7992852970efb4fee683d63d628e3e52df67 # v1.0.286
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: 'claude'
          prompt: "Run exactly one Bash command, git -C .claude/worktrees/rk-guide-revise push, then stop. Run no other command, edit no file, and report the command output."
          claude_args: --model ${{ steps.resolve.outputs.model_id }} --effort low --permission-mode default --max-turns 4 --allowedTools "Bash(git -C .claude/worktrees/rk-guide-revise push)"

      - name: Report a stopped documentation sync
        id: guide_stop_report
        if: always() && steps.compose_prompt.outputs.guide_stop_reason != '' && steps.agent_home_cleanup.outcome != 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          REASON: ${{ steps.compose_prompt.outputs.guide_stop_reason }}
          FLOW: ${{ inputs.flow }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          RELEASE_NOTE=''
          if [ "$FLOW" = "sync-release" ]; then
            RELEASE_NOTE=' No release follows in this run.'
          fi
          BODY=$(printf '**The %s flow did not start.** No agent ran, and no file changed. Reason: %s.%s\n\nTo run the flow, put the agent guide contract block, outside any code fence, in the root CLAUDE.md on the default branch and start the flow from the default branch, or remove the `guide_contract_permit` input from the caller workflow. See the [run log](%s).' "$FLOW" "$REASON" "$RELEASE_NOTE" "$RUN_URL")
          if [ -n "$ISSUE_NUMBER" ] && gh api --method POST "repos/${REPO}/issues/${ISSUE_NUMBER}/comments" --raw-field body="$BODY" >/dev/null; then
            echo "posted=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::The comment for the stopped documentation sync could not be posted."
          fi
          exit 0

      - name: Report the guide contract result
        if: always() && (steps.guide_contract.outputs.state == 'ready' || steps.guide_contract.outputs.state == 'stop')
        env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ steps.guide_contract.outputs.state }}
          REASON: ${{ steps.guide_contract.outputs.reason }}
          DIGEST: ${{ steps.guide_contract.outputs.digest }}
          REVISE_OUTCOME: ${{ steps.guide_revise.outcome }}
          EXECUTION_FILE: ${{ steps.guide_revise.outputs.execution_file }}
          RUNNER_SHA: ${{ steps.compose_prompt.outputs.guide_runner_sha }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          RUNNER="$RUNNER_TEMP/rk-shared/scripts/guide_contract.py"
          GUIDE_DIR="$RUNNER_TEMP/rk-guide-revise"
          NOW_SHA=$(git hash-object --no-filters "$RUNNER" 2>/dev/null || true)
          if ! command -v python3 >/dev/null 2>&1 || [ -z "$RUNNER_SHA" ] || [ "$NOW_SHA" != "$RUNNER_SHA" ]; then
            if [ "$STATE" != "stop" ] || [ -z "$REASON" ]; then
              REASON="the guide contract runner is missing or changed after the prompt was composed"
            fi
            gh api --method POST "repos/${REPO}/issues/${ISSUE_NUMBER}/comments" --raw-field body="**The agent guide revise pass landed no guide commit.** The implementation is already pushed, and this step left the agent guides on the session branch unedited. Reason: ${REASON}. See the [run log](${RUN_URL})." || echo "::warning::The guide contract comment could not be posted."
            exit 0
          fi
          python3 -I "$RUNNER" report --prepare-state "$STATE" --prepare-reason "$REASON" --state-file "$GUIDE_DIR/state.json" --state "$DIGEST" --result-file "$GUIDE_DIR/result.json" --revise-outcome "$REVISE_OUTCOME" --execution-file "$EXECUTION_FILE" --slug "$REPO" --issue "$ISSUE_NUMBER" --run-url "$RUN_URL" || echo "::warning::The guide contract report step failed."
          exit 0

      - name: Append LLM footer to Claude comment
        env:
          GH_TOKEN: ${{ github.token }}
          MODEL_ID: ${{ steps.resolve.outputs.model_id }}
          EFFORT: ${{ steps.resolve.outputs.effort }}
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          TARGET_COMMENT_ID: ${{ steps.primary_comment.outputs.id }}
        run: bash "$RUNNER_TEMP/rk-shared/scripts/patch_claude_comment.sh"

      - name: Mark cancellation for downstream status note
        if: always() && cancelled() && steps.agent_home_cleanup.outcome != 'failure'
        run: echo "IS_CANCELLED=true" >> "$GITHUB_ENV"

      - name: Note workflow cancellation/failure on Claude comment
        if: always() && (cancelled() || failure()) && steps.agent_home_cleanup.outcome != 'failure' && steps.guide_stop_report.outputs.posted != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          MODEL_ID: ${{ steps.resolve.outputs.model_id }}
          EFFORT: ${{ steps.resolve.outputs.effort }}
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          ON_MISS: post
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "${IS_CANCELLED:-}" = "true" ]; then
            STATUS_NOTE="**Workflow cancelled before completion.** See [run log]($RUN_URL)."
          else
            STATUS_NOTE="**Workflow failed before completion.** See [run log]($RUN_URL)."
          fi
          export STATUS_NOTE

          if ! command -v jq >/dev/null 2>&1 || ! command -v python3 >/dev/null 2>&1; then
            BODY=$(printf '%s\n\nThis runner lacks jq or python3, which the comment scripts need, so this note is a plain new comment.\n\n---\nLLM: %s | %s | Harness: %s' "$STATUS_NOTE" "${MODEL_ID:-(model not resolved)}" "${EFFORT:-unknown}" "${CLAUDE_HARNESS:-unknown}")
            gh api "repos/${REPO}/issues/${ISSUE_NUMBER}/comments" --method POST --raw-field body="$BODY"
            exit 0
          fi

          if [ ! -f "$RUNNER_TEMP/rk-shared/scripts/patch_claude_comment.sh" ]; then
            echo "::notice::Shared scripts unavailable — cannot patch the Claude comment."
            exit 0
          fi

          bash "$RUNNER_TEMP/rk-shared/scripts/patch_claude_comment.sh"

      - name: Clean up worktrees after Claude runs
        if: always() && steps.agent_home_cleanup.outcome != 'failure'
        run: |
          git worktree list --porcelain | sed -n 's/^worktree //p' | while IFS= read -r wt; do
            case "$wt" in
              "$GITHUB_WORKSPACE"/.claude/worktrees/*)
                git worktree remove --force "$wt" 2>/dev/null || rm -rf "$wt" ;;
            esac
          done
          git worktree prune
