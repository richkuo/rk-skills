      - name: Check the staged command policy after Claude runs
        if: always() && steps.runtime_sources.outputs.command_policy == 'true' && steps.claude.outcome != 'skipped'
        shell: /bin/bash --noprofile --norc -e -o pipefail {0}
        env:
          PHASE: after-main
          POLICY_ARGS: ${{ steps.compose_prompt.outputs.claude_args }}
          POLICY_CALLS_BEFORE: ${{ steps.policy_before_main.outputs.call_lines }}
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
          POLICY_DIR: ${{ steps.command_policy.outputs.dir }}
          POLICY_CHECKER: ${{ steps.command_policy.outputs.checker }}
          POLICY_CHECKER_OID: ${{ steps.command_policy.outputs.checker_oid }}
          POLICY_SETTINGS: ${{ steps.command_policy.outputs.settings_file }}
          POLICY_SETTINGS_OID: ${{ steps.command_policy.outputs.settings_oid }}
          POLICY_INTERPRETER: ${{ steps.command_policy.outputs.interpreter }}
          POLICY_INTERPRETER_REAL: ${{ steps.command_policy.outputs.interpreter_real }}
          POLICY_INTERPRETER_OID: ${{ steps.command_policy.outputs.interpreter_oid }}
          POLICY_CALL_RECORD: ${{ steps.command_policy.outputs.call_record }}
          POLICY_USER_SETTINGS: ${{ steps.command_policy.outputs.user_settings }}
          POLICY_USER_SETTINGS_DIGEST: ${{ steps.command_policy.outputs.user_settings_digest }}
          POLICY_USER_SETTINGS_KEYS: ${{ steps.command_policy.outputs.user_settings_keys }}
          POLICY_USER_SETTINGS_BASE: ${{ steps.command_policy.outputs.user_settings_base }}
          POLICY_USER_SETTINGS_ALLOWED: ${{ steps.command_policy.outputs.user_settings_allowed }}
          POLICY_WORKSPACE: ${{ github.workspace }}
          POLICY_MANAGED_DIRS: '/etc/claude-code:/Library/Application Support/ClaudeCode'
          BASH_ENV: ''
          ENV: ''
          LD_PRELOAD: ''
          LD_LIBRARY_PATH: ''
        run: |
          PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          export PATH
          while IFS= read -r name; do
            unset "$name"
          done < <(compgen -e | grep -E '^(GIT_|PYTHON)' || true)
          fail() {
            echo "::error::Command policy check ($PHASE): $1"
            exit 1
          }
          case "$PHASE" in
            before-main|after-main|before-guide|after-guide) ;;
            *) fail "the phase is not known." ;;
          esac
          for name in POLICY_DIR POLICY_CHECKER POLICY_CHECKER_OID POLICY_SETTINGS POLICY_SETTINGS_OID POLICY_INTERPRETER POLICY_INTERPRETER_REAL POLICY_INTERPRETER_OID POLICY_CALL_RECORD POLICY_USER_SETTINGS POLICY_USER_SETTINGS_DIGEST POLICY_USER_SETTINGS_KEYS POLICY_USER_SETTINGS_BASE POLICY_USER_SETTINGS_ALLOWED POLICY_WORKSPACE; do
            if [ -z "${!name:-}" ]; then
              fail "$name is empty, so the staged policy cannot be checked."
            fi
