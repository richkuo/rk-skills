name: Check skills

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - run: bun bin/check-skills.mjs

      - run: bun tests/milestone-pipeline.integration.mjs

      - run: bun tests/guide-contract.integration.mjs

  guide-contract-allowlist:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install the Claude Code version that the action pin installs
        run: |
          set -euo pipefail
          ACTION_SHA=$(grep -oE 'anthropics/claude-code-action@[0-9a-f]{40}' .github/workflows/claude-run.yml | sort -u)
          [ "$(printf '%s\n' "$ACTION_SHA" | wc -l)" -eq 1 ] || { echo "::error::claude-run.yml pins more than one action commit."; exit 1; }
          ACTION_SHA=${ACTION_SHA#*@}
          VERSION=$(curl -fsSL "https://raw.githubusercontent.com/anthropics/claude-code-action/$ACTION_SHA/src/entrypoints/run.ts" | sed -nE 's/^[[:space:]]*const claudeCodeVersion = "([0-9][0-9.]*)";.*/\1/p' | head -n 1)
          [ -n "$VERSION" ] || { echo "::error::Cannot read the Claude Code version from run.ts at $ACTION_SHA."; exit 1; }
          curl -fsSL https://claude.ai/install.sh | bash -s -- "$VERSION"
          GOT=$("$HOME/.local/bin/claude" --version | awk '{print $1}')
          [ "$GOT" = "$VERSION" ] || { echo "::error::Installed Claude Code $GOT, expected $VERSION."; exit 1; }
          echo "RK_CLAUDE_BIN=$HOME/.local/bin/claude" >> "$GITHUB_ENV"

      - run: bun tests/guide-contract.integration.mjs
